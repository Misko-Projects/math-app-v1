  - { id: brick, name: game.material.brick, art: material/brick } # W5 Brick Factory
  - { id: produce, name: game.material.produce, art: material/produce } # W6 Garden Terraces
  - { id: bread, name: game.material.bread, art: material/bread } # W7 Bakery
  - { id: coin, name: game.material.coin, art: material/coin } # W8 Market
  - { id: ticket, name: game.material.ticket, art: material/ticket } # W9 Clock Tower & Ferry
  - { id: glass, name: game.material.glass, art: material/glass } # W10 Builder's Yard
  - { id: beam, name: game.material.beam, art: material/beam } # W10 Builder's Yard
  - { id: rope, name: game.material.rope, art: material/rope } # W11 Weigh Station & Lookout

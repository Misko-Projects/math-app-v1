# U02 game data (02 §5.8 GameData; 05 §4 and §6): the materials workshops produce. Each material
# has a spoken name (`game.material.<id>` in narration/game.yaml) and an art component
# `material/<id>` (packages/ui/art). Game data is split across game/*.yaml by section: lists
# concatenate, and `island` is defined once (island.yaml).

materials:

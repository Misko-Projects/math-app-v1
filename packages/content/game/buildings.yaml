# U02 game data: buildings (02 §5.8 BuildingDef; 05 §3, §4 and §6).
#
# - Workshops follow the 05 §4 table: `workshopId` is the building id and `unlock` is the table's
#   Unlock column as an UnlockRule. Workshops that are free at the start have an empty level-1
#   recipe; the level-1 recipe of every other building is its build cost.
# - Every building has levels 1–3. Level upgrades unlock decor (`decor:<id>`), avatar outfits
#   (`outfit:<option>`) and residents (`resident:<id>`), never math gates (05 §6).
# - Costs: buildings a K child can reach use small countable costs (≤ 10 of each material, shown
#   as ten-frames); buildings gated on grade 1–3 skills use larger base-ten costs (05 §6).
# - A recipe only uses materials of workshops that are unlocked whenever the building is (its own
#   product only from level 2), so no recipe needs a material nobody can make yet.
# - Projects (`shared: true`) need materials from several workshops, so both children contribute.

buildings:
  # ---------- storehouse (05 §3) ----------
  - id: storehouse
    kind: storehouse
    art: building/storehouse
    footprint: [2, 2]
    unlock: { start: true }
    levels:
      - { level: 1, recipe: {}, unlocks: [] }
      - { level: 2, recipe: { stone: 10, light: 5 }, unlocks: [decor:lamp-post] }
      - { level: 3, recipe: { stone: 10, light: 10 }, unlocks: [decor:bird-bath] }

  # ---------- workshops (05 §4) ----------
  - id: road-crew # W1
    kind: workshop
    workshopId: road-crew
    art: building/road-crew
    footprint: [2, 1]
    unlock: { start: true }
    levels:
      - { level: 1, recipe: {}, unlocks: [] }
      - { level: 2, recipe: { stone: 10 }, unlocks: [decor:shell-bench] }
      - { level: 3, recipe: { stone: 10, light: 6 }, unlocks: [decor:flag-pole] }
  - id: lantern-grove # W2
    kind: workshop
    workshopId: lantern-grove
    art: building/lantern-grove
    footprint: [2, 2]
    unlock: { start: true }
    levels:
      - { level: 1, recipe: {}, unlocks: [] }
      - { level: 2, recipe: { light: 10, stone: 4 }, unlocks: [decor:lamp-post] }
      - { level: 3, recipe: { light: 10, stone: 8 }, unlocks: [decor:swing-bench] }
  - id: ten-boat-dock # W3: unlocks when the first home is built
    kind: workshop
    workshopId: ten-boat-dock
    art: building/ten-boat-dock
    footprint: [3, 1]
    unlock:
      any:
        - { building: shell-cottage }
        - { building: driftwood-hut }
        - { building: burrow-house }
        - { building: reef-house }
    levels:
      - { level: 1, recipe: { stone: 6, light: 4 }, unlocks: [] }
      - { level: 2, recipe: { plank: 10, stone: 5 }, unlocks: [resident:kibo] }
      - { level: 3, recipe: { plank: 10, light: 10 }, unlocks: [resident:zinna] }
  - id: treasure-beach # W4
    kind: workshop
    workshopId: treasure-beach
    art: building/treasure-beach
    footprint: [2, 1]
    unlock: { roadLength: 20 }
    levels:
      - { level: 1, recipe: { stone: 10, light: 5 }, unlocks: [] }
      - { level: 2, recipe: { gem: 10, stone: 6 }, unlocks: [decor:tide-pool] }
      - { level: 3, recipe: { gem: 10, light: 8 }, unlocks: [decor:kite-stand] }
  - id: brick-factory # W5
    kind: workshop
    workshopId: brick-factory
    art: building/brick-factory
    footprint: [2, 2]
    unlock: { skill: CPS.04, atLeast: practiced }
    levels:
      - { level: 1, recipe: { stone: 10, light: 8 }, unlocks: [] }
      - { level: 2, recipe: { brick: 10, stone: 6 }, unlocks: [decor:windmill] }
      - { level: 3, recipe: { brick: 10, light: 10 }, unlocks: [decor:fountain] }
  - id: garden-terraces # W6 (grade 2 gate: base-ten costs)
    kind: workshop
    workshopId: garden-terraces
    art: building/garden-terraces
    footprint: [2, 2]
    unlock: { skill: MUL.02, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 24, light: 16 }, unlocks: [] }
      - { level: 2, recipe: { produce: 30, stone: 20 }, unlocks: [decor:garden-arch] }
      - { level: 3, recipe: { produce: 48, light: 30 }, unlocks: [decor:bird-bath] }
  - id: bakery # W7 (grade 1 and 3 gates: base-ten costs); brings the Half-Crabs
    kind: workshop
    workshopId: bakery
    art: building/bakery
    footprint: [2, 1]
    unlock:
      any:
        - { skill: FRA.01, atLeast: ready }
        - { skill: MUL.05, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 20, light: 15 }, unlocks: [resident:halvie] }
      - { level: 2, recipe: { bread: 25, stone: 15 }, unlocks: [resident:tibo] }
      - { level: 3, recipe: { bread: 40, light: 25 }, unlocks: [resident:pira] }
  - id: market # W8 (grade 2 gate: base-ten costs); brings the Coin Clams
    kind: workshop
    workshopId: market
    art: building/market
    footprint: [2, 1]
    unlock: { skill: MON.01, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 25, light: 20 }, unlocks: [resident:centa] }
      - { level: 2, recipe: { coin: 30, stone: 20 }, unlocks: [resident:nell, resident:dimi] }
      - { level: 3, recipe: { coin: 50, light: 30 }, unlocks: [resident:quarta] }
  - id: clock-tower # W9 Clock Tower & Ferry (grade 1 gate: base-ten costs); brings the Clockfish
    kind: workshop
    workshopId: clock-tower
    art: building/clock-tower
    footprint: [1, 2]
    unlock: { skill: TIM.01, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 20, light: 12 }, unlocks: [resident:minna] }
      - { level: 2, recipe: { ticket: 20, stone: 15 }, unlocks: [resident:horo] }
      - { level: 3, recipe: { ticket: 35, light: 25 }, unlocks: [resident:sundy] }
  - id: builders-yard # W10
    kind: workshop
    workshopId: builders-yard
    art: building/builders-yard
    footprint: [2, 2]
    unlock: { skill: GEO.01, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 10, light: 6 }, unlocks: [] }
      - { level: 2, recipe: { glass: 8, beam: 10 }, unlocks: [decor:swing-bench] }
      - { level: 3, recipe: { glass: 10, beam: 10, stone: 10 }, unlocks: [decor:windmill] }
  - id: weigh-station # W11 Weigh Station & Lookout
    kind: workshop
    workshopId: weigh-station
    art: building/weigh-station
    footprint: [2, 1]
    unlock: { skill: ALG.01, atLeast: ready }
    levels:
      - { level: 1, recipe: { stone: 8, light: 8 }, unlocks: [] }
      - { level: 2, recipe: { rope: 10, flag: 6 }, unlocks: [decor:flag-pole] }
      - { level: 3, recipe: { rope: 10, flag: 10 }, unlocks: [decor:kite-stand] }
  - id: rhythm-orchard # W12
    kind: workshop
    workshopId: rhythm-orchard
    art: building/rhythm-orchard
    footprint: [2, 2]
    unlock: { skillKind: fact-fluency, atLeast: practiced }
    levels:
      - { level: 1, recipe: { stone: 6, light: 10 }, unlocks: [] }
      - { level: 2, recipe: { fruit: 10, light: 6 }, unlocks: [decor:garden-arch] }
      - { level: 3, recipe: { fruit: 10, stone: 10 }, unlocks: [decor:fountain] }
  # W13: its rewards are decor only, the star shards (04 §6.3): the puzzle-source decor, which its
  # requests give and its levels unlock. It produces no material (02 §5.6), so stone and light build it.
  - id: puzzle-tower
    kind: workshop
    workshopId: puzzle-tower
    art: building/puzzle-tower
    footprint: [1, 2]
    unlock:
      any:
        - { minGrade: "1" }
        - { masteredCount: 10 }
    levels:
      - { level: 1, recipe: { stone: 8, light: 8 }, unlocks: [decor:star-statue] }
      - { level: 2, recipe: { stone: 10, light: 8 }, unlocks: [decor:telescope, decor:moon-lamp] }
      - { level: 3, recipe: { stone: 10, light: 10 }, unlocks: [decor:crystal-tower] }
  - id: practice-pier # fallback host (04 §6.3): makes whatever a request asks for
    kind: workshop
    workshopId: practice-pier
    art: building/practice-pier
    footprint: [2, 1]
    unlock: { start: true }
    levels:
      - { level: 1, recipe: {}, unlocks: [] }
      - { level: 2, recipe: { stone: 6, light: 6 }, unlocks: [decor:driftwood-sign] }
      - { level: 3, recipe: { stone: 10, light: 10 }, unlocks: [decor:kite-stand] }

  # ---------- homes: each level brings a resident (05 §5 Arrival) ----------
  - id: shell-cottage
    kind: home
    art: building/shell-cottage
    footprint: [1, 1]
    unlock: { start: true }
    levels:
      - { level: 1, recipe: { stone: 5, light: 3 }, unlocks: [resident:hobb] }
      - { level: 2, recipe: { stone: 8, light: 5 }, unlocks: [resident:lark] }
      - { level: 3, recipe: { plank: 6, stone: 8, light: 6 }, unlocks: [resident:ollo] }
  - id: driftwood-hut
    kind: home
    art: building/driftwood-hut
    footprint: [1, 1]
    unlock: { building: ten-boat-dock }
    levels:
      - { level: 1, recipe: { plank: 6, stone: 4 }, unlocks: [resident:ottie] }
      - { level: 2, recipe: { plank: 8, light: 5 }, unlocks: [resident:niva] }
      - { level: 3, recipe: { plank: 10, light: 8 }, unlocks: [resident:pell] }
  - id: burrow-house
    kind: home
    art: building/burrow-house
    footprint: [1, 1]
    unlock: { roadLength: 20 }
    levels:
      - { level: 1, recipe: { stone: 8, light: 4, gem: 2 }, unlocks: [resident:fennie] }
      - { level: 2, recipe: { stone: 10, gem: 5 }, unlocks: [resident:wendle] }
      - { level: 3, recipe: { stone: 10, light: 8, gem: 8 }, unlocks: [resident:mavi] }
  - id: reef-house
    kind: home
    art: building/reef-house
    footprint: [1, 1]
    unlock: { building: lighthouse }
    levels:
      - { level: 1, recipe: { plank: 8, light: 6 }, unlocks: [resident:sefa] }
      - { level: 2, recipe: { plank: 10, stone: 8 }, unlocks: [resident:brin] }
      - { level: 3, recipe: { plank: 10, light: 10, stone: 10 }, unlocks: [resident:pom] }

  # ---------- shared projects (05 §6): each one opens a ring of the island (island.yaml) ----------
  - id: lighthouse
    kind: project
    art: building/lighthouse
    footprint: [2, 2]
    unlock: { all: [{ building: ten-boat-dock }, { skill: CPS.03, atLeast: practiced }] }
    shared: true
    levels:
      - level: 1
        recipe: { stone: 10, light: 10, plank: 10 }
        unlocks: [decor:lantern-string, outfit:accessory-shell-necklace]
      - { level: 2, recipe: { light: 10, plank: 10 }, unlocks: [decor:lamp-post] }
      - { level: 3, recipe: { stone: 10, light: 10, plank: 10 }, unlocks: [decor:fountain] }
  - id: east-bridge # Bridge to East Beach
    kind: project
    art: building/east-bridge
    footprint: [3, 1]
    unlock: { all: [{ building: lighthouse }, { building: brick-factory }] }
    shared: true
    levels:
      - level: 1
        recipe: { plank: 10, brick: 10, stone: 10 }
        unlocks: [outfit:hat-flower-crown, decor:garden-arch]
      - { level: 2, recipe: { plank: 10, brick: 10, light: 10 }, unlocks: [decor:windmill] }
      - level: 3
        recipe: { plank: 10, brick: 10, stone: 10, light: 10 }
        unlocks: [decor:swing-bench]
  - id: festival-stage # grade 2 gate (Market): base-ten costs, "needs 34 planks"
    kind: project
    art: building/festival-stage
    footprint: [2, 2]
    unlock: { all: [{ building: lighthouse }, { building: market }] }
    shared: true
    levels:
      - level: 1
        recipe: { plank: 34, light: 25, coin: 20 }
        unlocks: [outfit:hat-festival, decor:bunting]
      - level: 2
        recipe: { plank: 45, stone: 30, coin: 35 }
        unlocks: [outfit:top-festival, decor:festival-drum]
      - { level: 3, recipe: { plank: 50, light: 50, coin: 50 }, unlocks: [decor:paper-lanterns] }

# U02 game data: decor (02 §5.8; 05 §6 "Decor", §7). Art component `decor/<id>`; footprint is
# [w, h] in plots. Sources say how decor is earned, never bought or drawn at random (05 §7):
# - starter: owned from the start (one of each);
# - project: building and project level upgrades (buildings.yaml `decor:<id>` unlocks);
# - festival: festival and Storm Watch rewards (progression.yaml), and the Festival Stage;
# - gift: a parent's wrapped gift (`gift.left`);
# - puzzle: the Puzzle Tower's star shards (05 §4 W13, 04 §6.3): its request rewards and levels.

decor:

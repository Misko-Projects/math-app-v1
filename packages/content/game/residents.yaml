# U02 game data: residents, the Pebblings (02 §5.8 ResidentDef; 05 §5). Each resident has a name
# clip `res.<id>` and the lines it lists (`res.<id>.<line>`) in narration/game.yaml.
#
# - `number` is the quantity shown in the shell (lit pebbles in a 2 × 5 ten-frame). Teens (11–19)
#   and 20 are `family: tens`: a Ten Turtle plus a small friend (the friend is the `species`), or
#   two Ten Turtles. Families of Ten Turtles (30 … 100) ride together and come as the road grows.
# - Specials: the Hundred Whale (`hundreds`), Half-Crabs (`fraction`, number = the fraction),
#   Clockfish (`clock`, number = the hour) and Coin Clams (`coin`, number = cents).
# - Starter buddies (`starterBuddy: true`) are there from the start; every other resident arrives
#   when a home is built or upgraded (`via: home`) or on the ferry (`via: ferry`), in step with the
#   island (05 §5 Arrival). A building level that brings a resident names it (`resident:<id>`).
# - `affinity`: the workshops the resident makes requests for (04 §6.3).


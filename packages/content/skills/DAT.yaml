# K01 (#11): the K–1 DAT rows of 03 §3.17. DAT.03–08 are grade 2–3 (K02, graph.yaml plannedIds).
strand: DAT
skills:
  - id: DAT.01
    name: Sort things into groups by one attribute
    kind: concept
    grade: K
    standards: { ccss: [K.MD.B.3] }
    prerequisites: [CNT.04]
    gateway: false
    representations: [objects, shapes]

  - id: DAT.02
    name: Read picture and bar graphs with up to 3 categories
    kind: concept
    grade: 1
    standards: { ccss: [1.MD.C.4] }
    prerequisites: [DAT.10, ADD.20]
    gateway: false
    representations: [picture-graph, bar-graph]

  # K02 slice 4b (#17): DAT.04 and DAT.05 (grade 2). DAT.03 is planned: line plots have no
  # accessible names yet.
  - id: DAT.04
    name: Build picture and bar graphs (up to 4 categories)
    kind: procedure
    grade: 2
    standards: { ccss: [2.MD.D.10] }
    prerequisites: [DAT.02, DAT.09]
    gateway: false
    representations: [tally, picture-graph, bar-graph]

  - id: DAT.05
    name: Put-together, take-apart and compare questions about a bar graph
    kind: problem-solving
    grade: 2
    standards: { ccss: [2.MD.D.10] }
    prerequisites: [DAT.04, ADD.12]
    gateway: false
    encompasses: { DAT.02: 0.6 }
    representations: [bar-graph, symbols]

  - id: DAT.09
    name: Tally marks and simple tables
    kind: procedure
    grade: 1
    standards: { ccss: [], supports: [1.MD.C.4] }
    prerequisites: [DAT.10, CNT.06]
    gateway: false
    representations: [tally, table]

  - id: DAT.10
    name: Count each group and order the groups by how many
    kind: procedure
    grade: K
    standards: { ccss: [K.MD.B.3] }
    prerequisites: [DAT.01, CMP.02]
    gateway: false
    representations: [objects, picture-graph]

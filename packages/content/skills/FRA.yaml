# K01 (#11): the grade-1 FRA rows of 03 §3.11. K02 slice 4a (#17) adds FRA.02, slice 5a FRA.03,
# FRA.06, FRA.09 and FRA.13, slice 5b FRA.04 and FRA.10–12, slice 5c FRA.05, FRA.14, FRA.15, FRA.17.
strand: FRA
skills:
  - id: FRA.01
    name: Halves and fourths of circles and rectangles
    kind: concept
    grade: 1
    standards: { ccss: [1.G.A.3] }
    prerequisites: [FRA.07, GEO.02]
    gateway: false
    representations: [fraction-shape, fraction-strip, words]

  - id: FRA.02
    name: Halves, thirds and fourths; four fourths make a whole
    kind: concept
    grade: 2
    standards: { ccss: [2.G.A.3] }
    prerequisites: [FRA.01]
    gateway: false
    representations: [fraction-shape, fraction-strip, words]

  - id: FRA.07
    name: "Equal parts or not? Spot fair shares"
    kind: concept
    grade: 1
    standards: { ccss: [], supports: [1.G.A.3] }
    prerequisites: [GEO.01, MUL.12]
    gateway: false
    representations: [objects, fraction-shape]

  - id: FRA.08
    name: More equal parts means smaller parts
    kind: concept
    grade: 1
    standards: { ccss: [1.G.A.3] }
    prerequisites: [FRA.01]
    gateway: false
    # symbols: the abstract order cards name each strip's part count (FRA.08.t4).
    representations: [fraction-shape, fraction-strip, symbols]

  # K02 slice 4c-2 (#17): equal shares that look different (frac.partition grid cut, frac.shares).
  # number-pad (the squares in each part) is added to the catalog row as built.
  - id: FRA.16
    name: Equal shares of the same whole need not look the same
    kind: concept
    grade: 2
    standards: { ccss: [2.G.A.3] }
    prerequisites: [FRA.02]
    gateway: false
    representations: [fraction-shape, area-grid]

  # K02 slice 5a (#17): grade 3 fractions as parts of a whole. The fraction-line representation
  # and format of FRA.03 and FRA.06 come with the number-line slice (as built, 03 §3.11); FRA.06
  # and FRA.13 add `order` (a constructed answer) for V27, as FRA.08 does.
  - id: FRA.03
    name: "Unit fractions: 1/b is one of b equal parts"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.1] }
    prerequisites: [FRA.02, FRA.16, MUL.05]
    gateway: true
    representations: [fraction-shape, fraction-strip, symbols]

  - id: FRA.09
    name: "Non-unit fractions: a/b is a copies of 1/b"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.1] }
    prerequisites: [FRA.03]
    gateway: false
    representations: [fraction-shape, fraction-strip, symbols]

  - id: FRA.06
    name: Compare fractions with the same denominator
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3d] }
    prerequisites: [FRA.09, PV.02]
    gateway: false
    representations: [fraction-strip, symbols]

  - id: FRA.13
    name: Compare fractions with the same numerator
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3d] }
    prerequisites: [FRA.06, FRA.08]
    gateway: false
    representations: [fraction-strip, symbols]
    encompasses: { FRA.08: 0.5 }

  # K02 slice 5b (#17): fractions on the number line (frac.line). FRA.15 stays planned.
  - id: FRA.04
    name: Unit fractions on the number line
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.2a] }
    prerequisites: [FRA.03, MEA.04]
    gateway: true
    representations: [fraction-strip, ruler, fraction-line, symbols]

  - id: FRA.10
    name: Place any fraction a/b on a number line
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.2b] }
    prerequisites: [FRA.04, FRA.09]
    gateway: false
    representations: [fraction-strip, fraction-line]
    encompasses: { FRA.04: 1.0, FRA.09: 0.5 }

  - id: FRA.11
    name: Fractions greater than 1 on the number line
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.2b] }
    prerequisites: [FRA.10]
    gateway: false
    representations: [fraction-strip, fraction-line, symbols]

  - id: FRA.12
    name: "Whole numbers as fractions (3 = 3/1; 4/4 = 1)"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3c] }
    prerequisites: [FRA.10]
    gateway: false
    representations: [fraction-strip, fraction-line, symbols]

  # K02 slice 5c (#17): two names for one amount, benchmarks and equal areas. Denominators are 2,
  # 3, 4, 6 and 8. FRA.15 adds `order` (a constructed answer) for V27 and has no line item; FRA.14
  # adds fraction-pick (a name under a grid-parts picture, any equal name right) (as built, 03 §3.11).
  - id: FRA.05
    name: "Equivalent fractions with models (1/2 = 2/4)"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3a, 3.NF.A.3b] }
    prerequisites: [FRA.10, FRA.09]
    gateway: true
    representations: [fraction-strip, fraction-line, symbols]

  - id: FRA.17
    name: Equivalent fractions on the number line
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3a] }
    prerequisites: [FRA.05]
    gateway: false
    representations: [fraction-line, symbols]

  - id: FRA.15
    name: Compare a fraction with 1/2 and with 1
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3d] }
    prerequisites: [FRA.12, FRA.06]
    gateway: false
    representations: [fraction-strip, symbols]

  - id: FRA.14
    name: Split shapes into equal areas; each part is 1/b of the area
    kind: concept
    grade: 3
    standards: { ccss: [3.G.A.2] }
    prerequisites: [FRA.03, GEO.04]
    gateway: false
    representations: [fraction-shape, area-grid]

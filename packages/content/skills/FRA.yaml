# K01 (#11): the grade-1 FRA rows of 03 §3.11. K02 slice 4a (#17) adds FRA.02, slice 5a FRA.03,
# FRA.06, FRA.09 and FRA.13; the other grade 3 rows are planned (graph.yaml plannedIds).
strand: FRA
skills:
  - id: FRA.01
    name: Halves and fourths of circles and rectangles
    kind: concept
    grade: 1
    standards: { ccss: [1.G.A.3] }
    prerequisites: [FRA.07, GEO.02]
    gateway: false
    representations: [fraction-shape, fraction-strip, words]

  - id: FRA.02
    name: Halves, thirds and fourths; four fourths make a whole
    kind: concept
    grade: 2
    standards: { ccss: [2.G.A.3] }
    prerequisites: [FRA.01]
    gateway: false
    representations: [fraction-shape, fraction-strip, words]

  - id: FRA.07
    name: "Equal parts or not? Spot fair shares"
    kind: concept
    grade: 1
    standards: { ccss: [], supports: [1.G.A.3] }
    prerequisites: [GEO.01, MUL.12]
    gateway: false
    representations: [objects, fraction-shape]

  - id: FRA.08
    name: More equal parts means smaller parts
    kind: concept
    grade: 1
    standards: { ccss: [1.G.A.3] }
    prerequisites: [FRA.01]
    gateway: false
    # symbols: the abstract order cards name each strip's part count (FRA.08.t4).
    representations: [fraction-shape, fraction-strip, symbols]

  # K02 slice 4c-2 (#17): equal shares that look different (frac.partition grid cut, frac.shares).
  # number-pad (the squares in each part) is added to the catalog row as built.
  - id: FRA.16
    name: Equal shares of the same whole need not look the same
    kind: concept
    grade: 2
    standards: { ccss: [2.G.A.3] }
    prerequisites: [FRA.02]
    gateway: false
    representations: [fraction-shape, area-grid]

  # K02 slice 5a (#17): grade 3 fractions as parts of a whole. The fraction-line representation
  # and format of FRA.03 and FRA.06 come with the number-line slice (as built, 03 §3.11); FRA.06
  # and FRA.13 add `order` (a constructed answer) for V27, as FRA.08 does.
  - id: FRA.03
    name: "Unit fractions: 1/b is one of b equal parts"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.1] }
    prerequisites: [FRA.02, FRA.16, MUL.05]
    gateway: true
    representations: [fraction-shape, fraction-strip, symbols]

  - id: FRA.09
    name: "Non-unit fractions: a/b is a copies of 1/b"
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.1] }
    prerequisites: [FRA.03]
    gateway: false
    representations: [fraction-shape, fraction-strip, symbols]

  - id: FRA.06
    name: Compare fractions with the same denominator
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3d] }
    prerequisites: [FRA.09, PV.02]
    gateway: false
    representations: [fraction-strip, symbols]

  - id: FRA.13
    name: Compare fractions with the same numerator
    kind: concept
    grade: 3
    standards: { ccss: [3.NF.A.3d] }
    prerequisites: [FRA.06, FRA.08]
    gateway: false
    representations: [fraction-strip, symbols]
    encompasses: { FRA.08: 0.5 }

# CNT: Counting (03 §3.3). K01 (#11) authors the K and grade-1 rows; CNT.19 and CNT.20 came with
# the place-value strand. CNT.11, CNT.12 and CNT.17 are grade 2 (K02) and are planned ids in
# graph.yaml.

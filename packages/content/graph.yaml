# Graph-level settings (03 §4.1, §9.2).
# roots: the only skills allowed to have no prerequisites (V05).
roots: [CNT.01, SUB.01]
# coverageGrades: grades whose catalog is complete; V20 checks standards coverage only for these.
# K01 (#11) lands the K–1 catalog in several PRs and sets [K, 1] in the last one; K02 sets [K, 1, 2, 3].
coverageGrades: []
# plannedIds: catalog ids (03 §3) not authored yet; V03 accepts a gap there. K01 authors the K–1
# catalog one strand group at a time, so these gaps are later K01 PRs (ADD.02, SUB.04) or K02
# (grade 2: CNT.11, CNT.12, CNT.17). K01 clears the K–1 entries; K02 clears the rest.
plannedIds: [ADD.02, CNT.11, CNT.12, CNT.17, SUB.04]
# pendingGameSkills: catalog skills (03 §3) that game data unlock rules name before the curriculum
# authors them (03 §9.2), each with the exact places allowed to name it (building:<id>,
# resident:<id>, outfit:<option>, ring:<index>). Such a rule warns and stays unsatisfied until the
# skill exists; an unauthored skill anywhere else is an error. The PR that authors a skill removes
# its entry (a stale entry or place only warns).
pendingGameSkills:
  CPS.04: [building:brick-factory]
  MUL.02: [building:garden-terraces]
  FRA.01: [building:bakery]
  MUL.05: [building:bakery]
  MON.01: [building:market]
  TIM.01: [building:clock-tower]
  GEO.01: [building:builders-yard]
  ALG.01: [building:weigh-station]

# FRA narration (03 §8): skill intros and template prompts owned by the strand.
sk.FRA.01.intro:
  text: "Two equal parts are halves. Four equal parts are fourths."
sk.FRA.07.intro:
  text: "Fair shares are all the same size."
sk.FRA.08.intro:
  text: "Cut a pie into more parts, and each piece gets smaller."

tp.FRA.01.t1.prompt:
  text: "Cut it into {what|word}. Then fill one part."
tp.FRA.01.t2.prompt:
  text: "Cut the strip into {what|word}. Then fill one part."
tp.FRA.01.t3.prompt:
  text: "Which one is cut into {what|word}?"
tp.FRA.01.t4.prompt:
  text: "Mark the strip so it is cut into {what|word}."
tp.FRA.07.t1.prompt:
  text: "Is this a fair share? Does each one have the same?"
tp.FRA.07.t2.prompt:
  text: "Move them so each one has the same. How many does each one have?"
tp.FRA.07.t3.prompt:
  text: "Cut it into {den} parts that are all the same size."
tp.FRA.07.t4.prompt:
  text: "Is it cut into equal parts? Are all the parts the same size?"
tp.FRA.07.t5.prompt:
  text: "The two sides have {a} and {b}. How many must move to make it fair?"
tp.FRA.08.t1.prompt:
  text: "Which piece is bigger? They may be the same size."
tp.FRA.08.t2.prompt:
  text: "Which piece of pie is bigger? They may be the same size."
tp.FRA.08.t3.prompt:
  text: "Put them in order. Start with the biggest piece."
tp.FRA.08.t4.prompt:
  # The order holds only because the wholes are the same size and each is cut into equal parts,
  # so the prompt says both (PR #84 review round 3).
  text: "Same size strips, cut into equal parts. The number says how many; biggest pieces first."
sk.FRA.02.intro:
  text: "Three equal parts are thirds. Four fourths make a whole."
tp.FRA.02.t2.prompt:
  text: "Cut it into fourths. Then fill all the parts."

# K02 slice 4c-2 (#17): equal shares that look different.
sk.FRA.16.intro:
  text: "Equal shares have the same amount. They do not have to look the same."
tp.FRA.16.t1.prompt:
  text: "Cut the grid into {what|word}. The parts can have different shapes."
  level: "2"
tp.FRA.16.t2.prompt:
  text: "These parts are equal shares. How many squares are in each part?"
  level: "2"
tp.FRA.16.t3.prompt:
  text: "Are these parts equal shares?"
  level: "2"

# K02 slice 5a (#17): grade 3 fractions as parts of a whole. A story prompt names the part it
# asks about (the eaten parts); prompts never say the fraction asked for.
sk.FRA.03.intro:
  text: "Cut a whole into equal parts. One of those parts is a unit fraction, like one fourth."
  level: "3"
sk.FRA.09.intro:
  text: "Three fourths is three parts, and each part is one fourth."
  level: "3"
sk.FRA.06.intro:
  text: "When the parts are the same size, more parts make more."
  level: "3"
sk.FRA.13.intro:
  text: "Same number of parts? The whole cut into fewer parts has bigger parts."
  level: "3"
tp.FRA.03.t1.prompt:
  text: "Cut it into {den} equal parts. Then fill one part."
  level: "3"
tp.FRA.03.t2.prompt:
  text: "Cut the strip into {den} equal parts. Then fill one part."
  level: "3"
tp.FRA.03.t3.prompt:
  text: "What fraction is shaded? Type the top number and the bottom number."
  level: "3"
tp.FRA.03.t4.prompt:
  text: "A pie is cut into {den} equal parts. You eat 1 part. What fraction of the pie did you eat?"
  level: "3"
tp.FRA.09.t1.prompt:
  text: "Cut it into {den} equal parts. Then fill {num} parts."
  level: "3"
tp.FRA.09.t2.prompt:
  text: "What fraction of the strip is shaded? Type the top number and the bottom number."
  level: "3"
tp.FRA.09.t4.prompt:
  text: "A pie is cut into {den} equal parts. You eat {num} parts. What fraction of the pie did you eat?"
  level: "3"
tp.FRA.06.t1.prompt:
  text: "Which strip shows more? They may be the same."
  level: "3"
tp.FRA.06.t3.prompt:
  text: "Which sign goes between them: <, > or =?"
  level: "3"
tp.FRA.06.t2.prompt:
  text: "Put them in order. Start with the biggest."
  level: "3"
tp.FRA.06.t4.prompt:
  text: "Put the fractions in order. Start with the biggest."
  level: "3"
tp.FRA.13.t1.prompt:
  text: "The strips are the same size. Which one shows more? They may be the same."
  level: "3"
# K02 slice 5b (#17): fractions on the number line. Fractions are said and shown as words
# (`fracw`), never as a/b text.
sk.FRA.04.intro:
  text: "Fractions live on the number line too. One fourth is one jump of one fourth from 0."
  level: "3"
sk.FRA.10.intro:
  text: "Three fourths is three jumps of one fourth from 0."
  level: "3"
sk.FRA.11.intro:
  text: "A fraction can be more than one. Five fourths is one whole and one fourth more."
  level: "3"
sk.FRA.12.intro:
  text: "Four fourths make one whole. On the number line, four fourths is at 1."
  level: "3"
tp.FRA.04.t1.prompt:
  text: "Put the dot at {f|fracw} on the strip."
  level: "3"
tp.FRA.04.t2.prompt:
  text: "Where is the flag on the ruler? Type the top number and the bottom number."
  level: "3"
tp.FRA.04.t3.prompt:
  text: "Put the dot at {f|fracw} on the number line."
  level: "3"
tp.FRA.04.t4.prompt:
  text: "A path is cut into {den} equal steps. You take 1 step. What fraction of the path did you walk?"
  level: "3"
tp.FRA.10.t1.prompt:
  text: "Put the dot at {f|fracw} on the strip."
  level: "3"
tp.FRA.10.t2.prompt:
  text: "Put the dot at {f|fracw} on the number line."
  level: "3"
tp.FRA.10.t3.prompt:
  text: "This line is cut into {den} equal parts. What fraction is at the dot? Type the top number and the bottom number."
  level: "3"
tp.FRA.11.t1.prompt:
  text: "Put the dot at {f|fracw}. Each strip is one whole."
  level: "3"
tp.FRA.11.t2.prompt:
  text: "Put the dot at {f|fracw} on the number line."
  level: "3"
tp.FRA.11.t3.prompt:
  text: "Each whole is cut into {den} equal parts. Where is the flag? Type the top number and the bottom number."
  level: "3"
tp.FRA.11.t4.prompt:
  text: "Which two whole numbers is {f|fracw} between? Type the smaller one first."
  level: "3"
tp.FRA.12.t1.prompt:
  text: "Put the dot at {f|fracw}. Each strip is one whole."
  level: "3"
tp.FRA.12.t2.prompt:
  text: "Each whole is cut into {den} equal parts. Write where the flag is, with {den} on the bottom."
  level: "3"
tp.FRA.12.t3.prompt:
  text: "How many wholes make {f|fracw}?"
  level: "3"

# ADD narration (03 §8): skill intros, template prompts and lesson lines owned by the strand.
# Shared prompts, hints, feedback and the addsub.facts solution lines are in common.yaml.
sk.ADD.01.intro:
  text: "When we add, we put groups together."
sk.ADD.02.intro:
  text: "Let's add and take away small numbers. You will get fast!"
sk.ADD.03.intro:
  text: "Start with the bigger number and count on. No need to start at one!"
sk.ADD.04.intro:
  text: "To take away, count back. When the numbers are close, count up!"
sk.ADD.06.intro:
  text: "Let's get fast at adding and taking away up to ten."
sk.ADD.07.intro:
  text: "A double is two of the same number. Doubles are fun to know!"
sk.ADD.08.intro:
  text: "Let's make a ten first. A full ten helps you add!"
sk.ADD.09.intro:
  text: "To take away, think: what do I add?"
sk.ADD.15.intro:
  text: "One more, two more, one less, two less. Let's hop!"
sk.ADD.16.intro:
  text: "A near double is a double and one more."
sk.ADD.17.intro:
  text: "Adding nine? Add ten, then take one away!"
sk.ADD.18.intro:
  text: "Take away to get back to ten first. Then take away more."
sk.ADD.19.intro:
  text: "Count up from the small number to the big one. Stop at ten on the way!"
sk.ADD.24.intro:
  text: "When we take away, some go away. How many are left?"
sk.ADD.26.intro:
  text: "Ten and some ones make a teen number. Take the ten away to get the ones!"
sk.ADD.27.intro:
  text: "Jump on the number line to add and take away."

tp.ADD.01.t2.prompt:
  text: "Show {start} fingers. Put up more to make {n}."
tp.ADD.03.t1.prompt:
  text: "Start on {a} and hop {b} more. Where do you land?"
tp.ADD.03.t4.prompt:
  text: "{a} + {b} = ?"
  say: "What is {a} plus {b}? Start with the bigger number."
tp.ADD.04.t2.prompt:
  text: "Start on {b} and hop up to {a}. How many hops?"
tp.ADD.07.t3.prompt:
  text: "Look fast! How many dots in all?"
tp.ADD.08.t1.prompt:
  text: "Fill the first frame to make ten. How many is {a} + {b}?"
  say: "Fill the first frame to make ten. How many is {a} plus {b}?"
tp.ADD.08.t2.prompt:
  text: "Slide beads to fill the top row. How many is {a} + {b}?"
  say: "Slide beads to fill the top row. How many is {a} plus {b}?"
tp.ADD.08.t4.prompt:
  text: "{a} + {b} = ? Split {b} to make ten."
  say: "What is {a} plus {b}? Split {b} to make ten."
tp.ADD.09.t1.prompt:
  text: "{a} − {b} = ? Think: {b} and what make {a}?"
  say: "What is {a} take away {b}? Think: {b} and what make {a}?"
tp.ADD.09.t4.prompt:
  text: "{a} + ? = {result}"
  say: "{a} plus what number makes {result}?"
tp.ADD.17.t1.prompt:
  text: "How many is {a} + {b}? Slide a full ten, then take one away."
  say: "How many is {a} plus {b}? Slide a full ten, then take one away."
tp.ADD.19.t1.prompt:
  text: "{a} − {b} = ? Start at {b} and jump up to {a}."
  say: "What is {a} take away {b}? Start at {b} and jump up to {a}."
tp.ADD.24.t1.prompt:
  text: "There are {start} in the boat. Take {away} out."
tp.ADD.24.t2.prompt:
  text: "Show {start} fingers. Then put {away} down."
tp.ADD.26.t1.prompt:
  text: "Put {b} more next to the full ten. How many in all?"
tp.ADD.26.t2.prompt:
  text: "Think of ten and some ones. What number goes in the box?"

# ADD.08 authored lesson: make ten on the frames, then on the open number line.
ls.ADD.08.w1.s1:
  text: "Here are {a} and {b}."
  voice: pip
ls.ADD.08.w1.s2:
  text: "Move {give} from this group to fill the ten."
  voice: pip
ls.ADD.08.w1.s3:
  text: "Now this frame is a full ten."
  voice: pip
ls.ADD.08.w1.s4:
  text: "Ten and {keep} make {n}!"
  voice: pip
  style: excited
ls.ADD.08.outro:
  text: "You got to ten first. That helps you add!"
  voice: pip

# ---------- equality and story problems (K01 part 5) ----------
# Lines owned by the relational-equality skills (ADD.10, ADD.11) say "is the same as" for = (03 §8.4).
sk.ADD.05.intro:
  text: "Add the numbers in any order. The total is the same!"
sk.ADD.10.intro:
  text: "Equal is when both sides are the same."
sk.ADD.11.intro:
  text: "The box can be on any side. Find the number that makes it true!"
sk.ADD.12.intro:
  text: "Let's find the missing number in each story."
sk.ADD.13.intro:
  text: "Add three numbers. Look for two that make ten!"
sk.ADD.20.intro:
  text: "Listen to the story. Show it to find how many."
sk.ADD.21.intro:
  text: "Who has more, and how many more? Let's compare!"
sk.ADD.23.intro:
  text: "Let's find the numbers that tell the story."
sk.ADD.25.intro:
  text: "This story has three numbers. Find a ten to help!"

tp.ADD.05.t1.prompt:
  text: "Put in {b} more. How many is {b} + {a}?"
  say: "Put in {b} more. How many is {b} plus {a}?"
tp.ADD.05.t2.prompt:
  text: "Both sides must be the same. How many go in the box?"
tp.ADD.05.t3.prompt:
  text: "The parts are {a} and {b}. What is {b} + {a}?"
  say: "The parts are {a} and {b}. What is {b} plus {a}?"
tp.ADD.10.t1.prompt:
  text: "Add shells to make both sides the same."
tp.ADD.10.t3.prompt:
  text: "Does it balance? Are both sides the same?"
tp.ADD.10.t4.prompt:
  text: "Is it true? Are both sides the same?"
tp.ADD.11.t1.prompt:
  text: "What number in the box makes it balance?"
tp.ADD.11.t3.prompt:
  text: "Look at the parts and the whole. What number goes in the box?"
tp.ADD.12.t2.prompt:
  text: "{who|name} finds {a} more {item|noun:a} and now has {b}. How many were there at the start?"
tp.ADD.12.t3.prompt:
  text: "{who|name} has {a} {item|noun:a}, {b} more than the {other|noun:many}. How many {other|noun:many} does {who|name} have?"
tp.ADD.13.t1.prompt:
  text: "Put in {b} and {c}, making a ten first. How many in all?"
tp.ADD.13.t2.prompt:
  text: "{a} + {b} + {c} = ? The bond shows a ten."
  say: "What is {a} plus {b} plus {c}? The bond shows a ten."
tp.ADD.13.t3.prompt:
  text: "{a} + {b} + {c} = ? Can two make ten?"
  say: "What is {a} plus {b} plus {c}? Can two of them make ten?"
tp.ADD.20.t1.prompt:
  text: "{who|name} has {a} {item|noun:a} and finds {b} more. Show them all."
tp.ADD.20.t2.prompt:
  text: "{who|name} has {a} {item|noun:a} and gives {b} away. Show what is left."
tp.ADD.20.t4.prompt:
  text: "{who|name} has {a} red and {b} white {item|noun:many}. How many in all?"
tp.ADD.21.t1.prompt:
  text: "{who|name} has {a} red {item|noun:a} and {b} white ones. How many more red ones?"
tp.ADD.21.t3.prompt:
  text: "{who|name} has {a} {item|noun:a} and {b} {other|noun:b}. How many fewer {other|noun:many} are there?"
tp.ADD.23.t1.prompt:
  text: "Look at the two groups. Fill in the boxes to match."
tp.ADD.23.t2.prompt:
  text: "{who|name} has {a} {item|noun:a} and gives {b} away. Fill in the boxes."
tp.ADD.23.t3.prompt:
  text: "Which one matches the picture?"
tp.ADD.23.t4.prompt:
  text: "{who|name} has {a} {item|noun:a} and finds {b} more. Fill in the boxes."
tp.ADD.25.t1.prompt:
  text: "{who|name} finds {a} {item|noun:a}, then {b}, then {c} more. How many in all?"
tp.ADD.25.t3.prompt:
  text: "{who|name} has {a} red, {b} white and {c} blue {item|noun:many}. How many in all?"

# ADD.10 authored lesson: 3 + 4 shells against 5 on the balance.
ls.ADD.10.w1.s1:
  text: "This side has {a} and {b}."
  voice: pip
ls.ADD.10.w1.s2:
  text: "This side has {c}. It is up, so it has less."
  voice: pip
ls.ADD.10.w1.s3:
  text: "Count on from {c} to {m}. How many more does it need?"
  voice: pip
ls.ADD.10.w1.s4:
  text: "{n} more makes it level. {a} + {b} = {c} + {n}!"
  say: "{n} more makes it level. {a} plus {b} is the same as {c} plus {n}!"
  voice: pip
  style: excited
ls.ADD.10.outro:
  text: "Both sides are the same. That is what equal is!"
  voice: pip

# ADD.11 authored lesson: 8 + □ = 11 on the balance.
ls.ADD.11.w1.s1:
  text: "This side is {n}."
  voice: pip
ls.ADD.11.w1.s2:
  text: "This side has {a} and a box."
  voice: pip
ls.ADD.11.w1.s3:
  text: "{a} and what make {n}? Count on from {a}."
  voice: pip
ls.ADD.11.w1.s4:
  text: "{b} makes both sides {n}!"
  voice: pip
  style: excited
ls.ADD.11.outro:
  text: "The box can be on any side. Make both sides the same!"
  voice: pip

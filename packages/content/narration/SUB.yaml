# SUB narration (03 §8): skill intros, template prompts and lesson lines owned by the strand.
sk.SUB.01.intro:
  text: "Look fast! Can you see how many without counting?"
sk.SUB.02.intro:
  text: "Dice dots and fingers make shapes you can see at once."
sk.SUB.03.intro:
  text: "A full row is five. Then look for the more!"
sk.SUB.04.intro:
  text: "Two frames hold twenty. See the full ten, then the more."
sk.SUB.05.intro:
  text: "Fingers make shapes too. One full hand is five!"
sk.SUB.06.intro:
  text: "Big groups have small groups inside. See the parts, then put them together."
sk.SUB.07.intro:
  text: "Each row of beads has two fives. See how many fast!"
sk.SUB.08.intro:
  text: "See the tens and the ones fast. No need to count by ones!"

tp.SUB.01.t4.prompt:
  text: "How many do you see?"
tp.SUB.03.t1.prompt:
  text: "Show {n} on the ten-frame. Fill the top row first."
tp.SUB.03.t4.prompt:
  text: "Five and {more} more. How many is that?"
tp.SUB.04.t1.prompt:
  text: "Ten on top and some more below. How many beads?"
tp.SUB.04.t4.prompt:
  text: "How many in all? Look for the full ten first."
tp.SUB.06.t1.prompt:
  text: "Look at the two parts. How many in all?"
tp.SUB.07.t1.prompt:
  text: "How many beads? Look for fives and tens."
tp.SUB.08.t1.prompt:
  text: "Each rod is ten. Look fast: how many?"
tp.SUB.08.t2.prompt:
  text: "Each bundle is ten. Look fast: how many?"
tp.SUB.08.t3.prompt:
  text: "How many sticks? See the bundles of ten first."

ls.SUB.03.w1.s1:
  text: "Five fills the top row."
  voice: guide
ls.SUB.03.w1.s2:
  text: "{more} more go in the next row."
  voice: guide
ls.SUB.03.w1.s3:
  text: "Five and {more} more make {n}!"
  voice: guide
  style: excited

# K02 (#17) slice 3a
sk.SUB.09.intro:
  text: "Look fast! See the groups, then say how many."
tp.SUB.09.t1.prompt:
  text: "Look fast! How many in all?"
tp.SUB.09.t2.prompt:
  text: "Look fast at the rows! How many in all?"
tp.SUB.09.t4.prompt:
  text: "How many in all? Look at the equal rows."

# Shared narration (03 §8.1): prompts (p.*), hints (h.*), feedback (fb.*) and generator steps (gen.*).
# C01 seeds the keys the fixture set needs. K01 extends this file; E01 adds the gen.* keys its
# generators declare.

# ---------- prompts ----------
p.count.how-many:
  text: "How many are there?"
p.count.what-next:
  text: "What number comes next?"
p.count.order:
  text: "Put the numbers in order, starting with the smallest."
p.count.make-n:
  text: "Put {n} in the boat."
p.count.show-fingers:
  text: "Show me {n} fingers."
p.count.find-numeral:
  text: "Which number tells how many?"
p.count.write-numeral:
  text: "Count them. Then tap the number."
p.subitize.how-many:
  text: "Look fast! How many did you see?"
p.subitize.how-many-fingers:
  text: "How many fingers did you see?"
p.bond.split:
  text: "Split {whole} into two parts."
p.bond.split-fingers:
  text: "Show {whole} fingers with two hands."
p.bond.missing-part:
  text: "{whole} is {part} and how many more?"
p.bond.make-ten:
  text: "{part} and what number make ten?"
p.add.add-more:
  text: "You have {start}. Add more to make {n}."
p.add.how-many-in-all:
  text: "{a} and {b} more. How many in all?"
p.add.what-is:
  text: "{a} + {b} = ?"
  say: "What is {a} plus {b}?"

p.geo.which-kind:
  text: "Which one is a {kind|shape:one}?"
p.geo.find-every:
  text: "Find every {kind|shape:one}."
p.geo.fill-outline:
  text: "Fill the outline with the pieces."

# ---------- hints (levels 2–4; replay and show-me are automatic) ----------
h.replay:
  text: "Let's hear it again."
h.show-me:
  text: "Watch me. Then you try."
h.sequence.say-it:
  text: "Say the numbers out loud from the start."
h.sequence.look-chart:
  text: "Find the number on the chart. Look at the next box."
h.sequence.look-path:
  text: "Look at the stones. Which one comes after?"
h.count.touch-each:
  text: "Touch each one as you count."
h.count.last-number:
  text: "The last number you say tells how many."
h.count.show-frame:
  text: "Fill the top row first. A full row is five."
h.subitize.look-again:
  text: "Look again. Do you see a shape you know?"
h.subitize.look-groups:
  text: "Look for small groups. Put them together."
h.subitize.five-fingers:
  text: "One hand has five fingers."
h.subitize.five-and:
  text: "A full row is five. How many more?"
h.bond.use-counters:
  text: "Move the counters into two groups."
h.bond.two-hands:
  text: "Put some fingers up on each hand."
h.bond.slide-beads:
  text: "Slide some beads over. Count both parts."
h.bond.partners:
  text: "Count the empty spaces. They make ten."
h.add.join:
  text: "Put the two groups together. Then count them all."
h.add.fingers:
  text: "Show the first number on one hand. Add more fingers."
h.add.count-on:
  text: "Say the first number. Then count on."
h.add.start-big:
  text: "Start with the bigger number."

# geometry (K01: GEO, PUZ.03) and measurable attributes (MEA.15)
h.geo.count-sides:
  text: "Count the straight sides. Touch each one."
h.geo.count-corners:
  text: "Count the corners. Touch each one."
h.geo.any-turn:
  text: "Turned, big, little: it is the same shape."
h.geo.closed:
  text: "A shape has no gaps. Look at every corner."
h.geo.flat-solid:
  text: "Flat is like a picture. You can pick up a solid."
h.geo.rolls:
  text: "Can it roll? Look for a curved part."
h.geo.like-what:
  text: "Does it look like a ball, a can, a box?"
h.geo.compare-count:
  text: "Count for each shape. Which number is bigger?"
h.geo.side-lengths:
  text: "Run a finger along each side. Is one side longer?"
h.geo.bins:
  text: "Look at each bin. What goes in it?"
h.geo.where-word:
  text: "Listen for where it goes. Then look at the {anchor|noun:one}."
h.geo.flip:
  text: "Think of the picture. Now look from the {anchor|noun:one}."
h.geo.sticks:
  text: "Put two sticks at each corner. Close every gap."
h.geo.dots:
  text: "Go from dot to dot with straight lines."
h.geo.outline-edges:
  text: "Match a straight edge of a piece to the outline."
h.geo.turn-piece:
  text: "Try turning a piece to make it fit."
h.geo.pieces-inside:
  text: "Picture the pieces inside the shape."
h.geo.grid-rects:
  text: "Put the rectangles in first. Then fill in the squares."
h.mea.both:
  text: "Think of holding it in your hands."
h.mea.is-it:
  text: "Look at each thing. Is it {attr|word}?"

# length, measuring with units and weight (K01: MEA.01, 02, 07, 16, 22)
h.length.line-up:
  text: "Line up the ends on one side."
h.length.look-ends:
  text: "Now look at where each one ends."
h.length.longer-goes-past:
  text: "The longer one goes on when the shorter one stops."
h.length.shorter-stops:
  text: "The shorter one stops first."
h.length.ruler-start:
  text: "They both start at the same line."
h.length.ruler-ends:
  text: "Look where each one ends. Which goes farther?"
h.length.string:
  text: "Lay the string along this one. Then hold it by that one."
h.length.string-past:
  text: "Does that one go on after the string ends?"
h.length.order-shortest:
  text: "Find the shortest one. It goes first."
h.length.order-next:
  text: "Then find the shortest one that is left."
h.length.order-numbers:
  text: "The smallest number is the shortest. It goes first."
h.measure.start-at-end:
  text: "Put the first one right at the end."
h.measure.no-gaps:
  text: "Put each one right next to the last, with no gaps."
h.measure.count-each:
  text: "Count each one as you go."
h.measure.last-number:
  text: "The last number you say tells how long."
h.measure.both-units:
  text: "Measure with the big ones. Then measure again with the small ones."
h.measure.bigger-fewer:
  text: "Bigger ones cover more, so you need fewer of them."
h.measure.which-bigger:
  text: "Look at the two kinds. Which one is bigger?"
h.weight.goes-down:
  text: "The heavier side goes down."
h.weight.level:
  text: "When it does not tip, they weigh the same."
h.weight.more-things:
  text: "More things can be lighter. Watch the balance."
h.weight.lift:
  text: "Think of how heavy each one is. Which one is heavier?"


h.bond.two-hands:
  text: "Put some fingers up on each hand."
h.bond.slide-beads:
  text: "Slide some beads over. Count both parts."
h.bond.partners:
  text: "Count the empty spaces. They make ten."
# CPS (K01) hints. Free splits name no number that could be a part (03 §9.4 step 7).
h.bond.split-any:
  text: "Put some in each part. Both parts make the whole."
h.bond.count-on:
  text: "Start at the part you know. Count up to the whole."
h.bond.fingers:
  text: "Show the whole on your fingers. Put down the part you know."
h.bond.new-way:
  text: "Make one part bigger by one. Is that a new way?"
h.bond.through-ten:
  text: "Count up to ten first. Then count on to the whole."
h.bond.fill-ten:
  text: "Move counters over to fill the first frame."

  text: "The long hand shows the minutes."
gen.time.clock.short-hand:
  text: "The short hand shows the hour."
gen.time.clock.turn-long:
  text: "Turn the long hand to the minutes."
gen.time.clock.turn-short:
  text: "Turn the short hand to the hour. Now it is {time|time}."
gen.time.clock.reads:
  text: "It is {time|time}."
gen.time.clock.between:
  text: "Look at the short hand. It is between two numbers."
gen.time.clock.after:
  text: "It is just after {hour}, so the hour is {hour}."
gen.time.sequence.think:
  text: "Think about your day. What do we do first?"

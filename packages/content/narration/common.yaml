gen.count.set.take-away:
  text: "Take some out. Stop when {n} are left."
gen.count.set.bundle:
  text: "Put each ten together."
gen.count.set.count-picture:
  text: "Let's count them together."
gen.count.set.pick:
  text: "We counted {n}. Tap {n}."
gen.count.set.type:
  text: "We counted {n}. Now tap {n}."
gen.count.set.fill-frame:
  text: "Fill the frame one at a time, up to {n}."
gen.count.set.add-to:
  text: "There are {start}. Put in more, up to {n}."
gen.count.set.none:
  text: "Look closely. There are none here."
gen.count.set.zero:
  text: "None is the number zero."
gen.count.sequence.say-from:
  text: "Let's count from {start}."
gen.count.sequence.next-is:
  text: "Next comes {n}."
gen.count.sequence.hop:
  text: "Hop to {n}."
gen.count.sequence.order-start:
  text: "Find where the numbers start."
gen.count.sequence.say-back:
  text: "Let's count back from {start}."
gen.count.ordinal.start-left:
  text: "Start at the left. Count each one."
gen.count.ordinal.start-right:
  text: "Start at the right. Count each one."
gen.count.ordinal.this-one:
  text: "This one is {k|ord}."
gen.subitize.flash.look:
  text: "Look at the dots again."
gen.subitize.flash.see-groups:
  text: "I see small groups. Put them together."
gen.subitize.flash.parts:
  text: "I see {a} and {b}."
gen.subitize.flash.total:
  text: "That makes {n}."
gen.subitize.flash.show:
  text: "Let's show {n}."
gen.bond.parts.whole-is:
  text: "The whole is {whole}."
gen.bond.parts.count-on:
  text: "Start at {part}. Count on to {whole}."
gen.bond.parts.missing-is:
  text: "The missing part is {n}."
gen.bond.parts.split:
  text: "{a} and {b} make the whole."
gen.bond.parts.together:
  text: "Put {a} and {b} together."
gen.addsub.facts.start-at:
  text: "Start at {a}. Then count on {b}."
gen.addsub.facts.start-back:
  text: "Start at {a}. Then count back {b}."
gen.addsub.facts.take-away:
  text: "Start with {a}. Take away {b}."
gen.addsub.facts.count-on:
  text: "Now {n}."
gen.addsub.facts.answer:
  text: "The answer is {n}."
gen.addsub.facts.join:
  text: "Put {a} and {b} together."

# ---------- feedback ----------
fb.correct.1:
  text: "You did it!"
  style: excited
fb.correct.2:
  text: "Yes! You counted carefully."
  style: excited
fb.correct.3:
  text: "That's it! Great thinking."
  style: excited
fb.correct.4:
  text: "Yes! You kept trying."
  style: excited
fb.correct.5:
  text: "You got it! Nice work."
  style: excited
fb.correct.6:
  text: "Hooray! That's right."
  style: excited
fb.retry:
  text: "Let's look at it one more time."
fb.reveal:
  text: "Here is how it goes. Watch!"
fb.skip:
  text: "That's okay. We can learn this one together."
  style: calm
fb.testout.to-lesson:
  text: "Let me show you a trick!"
  style: playful
fb.tap-count.retry:
  text: "Let's count again. Touch each one once."
fb.make-set.retry:
  text: "Let's count what is in the boat."
fb.dot-flash.retry:
  text: "Let's look again. Watch closely."
fb.numeral-pick.retry:
  text: "Let's look again. Count, then pick."
fb.number-pad.retry:
  text: "Let's look again. Then tap the number."
fb.order.retry:
  text: "Find the smallest one first."
fb.tenframe-fill.retry:
  text: "Let's count the frame again. Start at the top."
fb.number-bond.retry:
  text: "Look at the two parts and the whole."
fb.rekenrek.retry:
  text: "Let's count the beads on the left."
fb.number-line-jump.retry:
  text: "Let's hop again. Count each hop."
fb.hundred-chart.retry:
  text: "Look at the row. Which box comes next?"
fb.mc.off-by-one-counting:
  text: "Touch each one once. Count again with me."
fb.mc.count-start-number:
  text: "Start with the first number. Count the hops after it."
fb.mc.count-all-instead:
  text: "Start at the bigger number. Then count on."
fb.mc.recount-from-one:
  text: "You counted them all. The last number you said tells how many!"
fb.mc.decade-transition:
  text: "Look at the tens. After nine ones, a new ten starts."
fb.mc.teen-reversal:
  text: "Look at the tens. The ten comes first, then the ones."

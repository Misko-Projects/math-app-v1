# K02 slice 2a (#17): hints for the grade-2 rows within 100.
h.mda.ones-new-ten:
  text: "Add the ones. Ten of them make one more ten."
h.mda.split-a-ten:
  text: "Need more ones? Split a ten into ten ones."
h.mda.take-the-ones:
  text: "Now you have more ones. Take them away."
h.mda.jump-back-to-ten:
  text: "Jump back to the ten first. Then jump back the ones left."
h.mda.back-to-ten-first:
  text: "How many ones take you back to the ten? Take those first."
h.mda.then-take-rest:
  text: "Then take away the ones that are left."
h.mda.take-cubes:
  text: "Take away cubes. Each cube is one."
h.mda.take-away-tens:
  text: "Take away the tens."
h.mda.take-away-ones:
  text: "Take away the ones."
h.mda.take-ones-then-tens:
  text: "Take away the ones. Then take away the tens."
h.mda.jump-back-ones:
  text: "Then jump back the ones."
h.mda.ten-moved-to-ones:
  text: "One ten went over to the ones. Take the ones from there."
h.mda.one-ten-less:
  text: "You split a ten, so there is one less ten."
h.mda.picture-line:
  text: "Picture a number line. Start at the first number."
h.mda.tens-then-ones:
  text: "Jump the tens first. Then jump the ones."
h.mda.up-to-next-ten:
  text: "Start at the smaller number. Jump up to the next ten."
h.mda.add-the-jumps:
  text: "Add up all your jumps."
h.mda.friendly-ten:
  text: "The first number is close to a ten. Give it some ones."
h.mda.add-what-is-left:
  text: "Now add what is left of the second number."
h.mda.give-and-take:
  text: "One number went up to a ten. The box is less by the same."
h.mda.parts-make-whole:
  text: "Add the two parts. Do they make the whole?"
h.mda.check-with-plus:
  text: "Add your answer and the number you take away. Do you get the first number?"
h.mda.think-plus:
  text: "Think: the number you take away plus what makes the first number?"
h.mda.count-up-between:
  text: "Count up from the smaller number to the bigger one."
h.mda.add-all-tens:
  text: "Add all the tens first."
h.mda.all-ones:
  text: "Then add all the ones. Do they make a new ten?"
fb.mc.forgot-to-regroup-add:
  text: "Did a place make ten or more? That is one more for the next place."
fb.mc.smaller-from-larger:
  text: "Need more to take away in a place? Split one from the next place first."
fb.mc.borrow-no-decrement:
  text: "You split one from a place, so that place has one less now."
fb.mc.borrow-across-zero:
  text: "A zero has none to split. Take one from the place next to it first."

# K02 slice 2b (#17): hints for addition and subtraction within 1000, and estimating (PV.19).
h.mda.put-in-b:
  text: "Put in hundreds, tens and ones that make {b}."
h.mda.take-b:
  text: "Take away hundreds, tens and ones that make {b}."
h.mda.disk-values:
  text: "Each disk shows what it is worth. Look at the number on it."
h.mda.same-places-add:
  text: "Add hundreds to hundreds, tens to tens and ones to ones."
h.mda.each-place-under-ten:
  text: "Each place adds up to less than ten, so there is no trade."
h.mda.same-places-take:
  text: "Take hundreds from hundreds, tens from tens and ones from ones."
h.mda.each-place-enough:
  text: "In each place you can take away without a split."
h.mda.ten-for-next-place:
  text: "Ten in one place? Trade them for one of the next place."
h.mda.count-the-trade:
  text: "Each trade puts one more in the next place. Count it too."
h.mda.place-ten-or-more:
  text: "If a place adds up to ten or more, that makes one more of the next place."
h.mda.line-up-places:
  text: "Think of one number under the other: ones under ones, tens under tens."
h.mda.carry-shows:
  text: "A trade shows as a small 1 above the next place."
h.mda.split-when-short:
  text: "Need more to take away in a place? Split one from a bigger place."
h.mda.no-tens-split-hundred:
  text: "No tens to split? Split a hundred into ten tens first."
h.mda.then-split-ten:
  text: "Then split one ten into ten ones."
h.mda.crossed-digits:
  text: "A split shows as a crossed-out digit with the new number above it."
h.mda.zero-tens-hundred:
  text: "There are no tens. Take one hundred: that is ten tens."
h.mda.nine-tens-left:
  text: "Split one of those tens into ten ones. Then nine tens are left."
h.mda.count-landing:
  text: "Count your jumps. Do they make {b}?"
h.est.closer-hundred:
  text: "Which hundred is each number closer to?"
h.est.round-each-hundred:
  text: "Round each number to the nearest hundred."
h.est.round-first:
  text: "Round each number first, the way the question says."
h.est.then-add-take:
  text: "Then add or take away the rounded numbers."

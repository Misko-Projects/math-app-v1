# Shared narration (03 §8.1): prompts (p.*), hints (h.*), feedback (fb.*) and generator steps (gen.*).
# C01 seeds the keys the fixture set needs. K01 extends this file; E01 adds the gen.* keys its
# generators declare.

# ---------- prompts ----------
p.count.how-many:
  text: "How many are there?"
p.count.what-next:
  text: "What number comes next?"
p.count.order:
  text: "Put the numbers in order, starting with the smallest."
p.count.make-n:
  text: "Put {n} in the boat."
p.count.show-fingers:
  text: "Show me {n} fingers."
p.count.find-numeral:
  text: "Which number tells how many?"
p.count.write-numeral:
  text: "Count them. Then tap the number."
# CNT (K01): counting on and back, missing numbers, one more.
p.count.on-to:
  text: "Start at {start}. Count on to {last}."
p.count.back-to:
  text: "Start at {start}. Count back to {last}."
p.count.next-back:
  text: "Count back from {start}. What number comes next?"
p.count.fill-on:
  text: "Count on from {start}. Fill in the missing numbers."
p.count.fill-back:
  text: "Count back from {start}. Fill in the missing numbers."
p.count.fill-tens:
  text: "Count by tens from {start}. Fill in the missing numbers."
p.count.box-on:
  text: "Count on. What number goes in each box?"
p.count.box-back:
  text: "Count back. What number goes in each box?"
p.count.missing:
  text: "Some numbers are missing. Fill them in."
p.count.one-more:
  text: "What number is one more than {start}?"
p.subitize.how-many:
  text: "Look fast! How many did you see?"
p.subitize.how-many-fingers:
  text: "How many fingers did you see?"
p.bond.split:
  text: "Split {whole} into two parts."
p.bond.split-fingers:
  text: "Show {whole} fingers with two hands."
p.bond.missing-part:
  text: "{whole} is {part} and how many more?"
p.bond.make-ten:
  text: "{part} and what number make ten?"
p.add.add-more:
  text: "You have {start}. Add more to make {n}."
p.add.how-many-in-all:
  text: "{a} and {b} more. How many in all?"
p.add.what-is:
  text: "{a} + {b} = ?"
  say: "What is {a} plus {b}?"

# ---------- hints (levels 2–4; replay and show-me are automatic) ----------
h.replay:
  text: "Let's hear it again."
h.show-me:
  text: "Watch me. Then you try."
h.sequence.say-it:
  text: "Say the numbers out loud from the start."
h.sequence.look-chart:
  text: "Find the number on the chart. Look at the next box."
h.sequence.look-path:
  text: "Look at the stones. Which one comes after?"
h.count.touch-each:
  text: "Touch each one as you count."
h.count.last-number:
  text: "The last number you say tells how many."
h.count.show-frame:
  text: "Fill the top row first. A full row is five."
# CNT (K01) hints. Counting words are written in letters, so no line names an answer.
h.count.anything:
  text: "Look closely. Is there any to count?"
h.count.full-boxes:
  text: "Count the full boxes. Empty boxes do not count."
h.count.one-more:
  text: "Put in just one. Then count them all."
h.count.one-more-next:
  text: "One more is the next number when you count."
h.sequence.count-back:
  text: "Say the numbers going down, one at a time."
h.sequence.look-path-back:
  text: "Look at the stones. Which one comes just before?"
h.sequence.new-ten:
  text: "After a number that ends in nine, a new ten starts."
h.sequence.back-ten:
  text: "Counting back from a new ten, the ones start again at nine."
h.sequence.chart-steps:
  text: "Go box by box. At the end, go to the next row."
h.sequence.chart-back:
  text: "One less is the box before. At the start of a row, go up a row."
h.sequence.tens-down:
  text: "Counting by tens, go down one row each time."
h.sequence.say-tens:
  text: "Say each ten out loud as you go down the chart."
h.ordinal.first-end:
  text: "Start at the {from|word}. That one is first."
h.ordinal.say-places:
  text: "Say first, second, third as you touch each one."
h.ordinal.stones:
  text: "Start at the first stone. Say first, second, third."
h.subitize.look-again:
  text: "Look again. Do you see a shape you know?"
h.subitize.look-groups:
  text: "Look for small groups. Put them together."
h.subitize.five-fingers:
  text: "One hand has five fingers."
h.subitize.five-and:
  text: "A full row is five. How many more?"
h.subitize.five-frame:
  text: "A full frame has five. Are any boxes empty?"
h.subitize.full-hand:
  text: "One full hand is five. Then look at the next hand."
h.subitize.full-hand-first:
  text: "Put up one full hand first."
h.subitize.think-hand:
  text: "Think of one full hand. Then add the more."
h.subitize.each-part:
  text: "How many in each part? See them without counting."
h.subitize.parts-together:
  text: "{a} and {b}. Put the parts together."
h.bond.use-counters:
  text: "Move the counters into two groups."
h.bond.two-hands:
  text: "Put some fingers up on each hand."
h.bond.slide-beads:
  text: "Slide some beads over. Count both parts."
h.bond.partners:
  text: "Count the empty spaces. They make ten."
h.add.join:
  text: "Put the two groups together. Then count them all."
h.add.fingers:
  text: "Show the first number on one hand. Add more fingers."
h.add.count-on:
  text: "Say the first number. Then count on."
h.add.start-big:
  text: "Start with the bigger number."

# ---------- generator solution steps (E01: gen.<generatorId>.<step>, 03 §6.4) ----------

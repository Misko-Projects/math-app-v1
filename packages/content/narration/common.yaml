  text: "We do this first."
gen.time.sequence.then:
  text: "Then we do this."
gen.time.sequence.sort-look:
  text: "Do we do this in the morning? At night?"
gen.time.sequence.sort-morning:
  text: "This is a morning thing."
gen.time.sequence.sort-night:
  text: "This is a night thing."
fb.clock-set.retry:

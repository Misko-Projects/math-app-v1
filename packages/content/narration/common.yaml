  text: "The two corners together are one part of the side."
h.puzzle.bond-middle:
  text: "The side is the whole. What goes with the corners to make it?"
h.bond.ways-in-order:
  text: "Look at the ways in order. Which one is not there?"
h.puzzle.ways-fewest:
  text: "Find the one with the fewest in the first group."
h.puzzle.ways-one-more:
  text: "Each next one has one more in the first group."
h.puzzle.ways-start:
  text: "Start with the smallest part you can."
h.puzzle.ways-turn:
  text: "A turn-around is the same way. Try a new one."
gen.pattern.repeat.say-it:
  text: "Let's say the pattern together."
gen.pattern.repeat.next:
  text: "This one comes next."
gen.pattern.repeat.core:
  text: "Here is where the pattern starts."
gen.pattern.repeat.bracket:
  text: "This is the part that repeats."
gen.pattern.grow.look:
  text: "Look at how the numbers grow."
gen.pattern.grow.rule:
  text: "It grows by {step} each time."
gen.pattern.grow.next:
  text: "Next comes {n}."
gen.pattern.grow.land:
  text: "We land on {n}."

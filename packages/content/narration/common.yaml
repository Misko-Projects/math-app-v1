# Shared narration (03 §8.1): prompts (p.*), hints (h.*), feedback (fb.*) and generator steps (gen.*).
# C01 seeds the keys the fixture set needs. K01 extends this file; E01 adds the gen.* keys its
# generators declare.

# ---------- prompts ----------
p.count.how-many:
  text: "How many are there?"
p.count.what-next:
  text: "What number comes next?"
p.count.order:
  text: "Put the numbers in order, starting with the smallest."
p.count.make-n:
  text: "Put {n} in the boat."
p.count.show-fingers:
  text: "Show me {n} fingers."
p.count.find-numeral:
  text: "Which number tells how many?"
p.count.write-numeral:
  text: "Count them. Then tap the number."
# CNT (K01): counting on and back, missing numbers, one more.
p.count.on-to:
  text: "Start at {start}. Count on to {last}."
p.count.back-to:
  text: "Start at {start}. Count back to {last}."
p.count.next-back:
  text: "Count back from {start}. What number comes next?"
p.count.fill-on:
  text: "Count on from {start}. Fill in the missing numbers."
p.count.fill-back:
  text: "Count back from {start}. Fill in the missing numbers."
p.count.fill-tens:
  text: "Count by tens from {start}. Fill in the missing numbers."
p.count.box-on:
  text: "Count on. What number goes in each box?"
p.count.box-back:
  text: "Count back. What number goes in each box?"
p.count.missing:
  text: "Some numbers are missing. Fill them in."
p.count.one-more:
  text: "What number is one more than {start}?"
p.subitize.how-many:
  text: "Look fast! How many did you see?"
p.subitize.how-many-fingers:
  text: "How many fingers did you see?"
p.bond.split:
  text: "Split {whole} into two parts."
p.bond.split-fingers:
  text: "Show {whole} fingers with two hands."
p.bond.missing-part:
  text: "{whole} is {part} and how many more?"
p.bond.make-ten:
  text: "{part} and what number make ten?"
p.bond.new-way:
  text: "Find a new way to split {whole}."
p.add.add-more:
  text: "You have {start}. Add more to make {n}."
p.add.how-many-in-all:
  text: "{a} and {b} more. How many in all?"
p.add.what-is:
  text: "{a} + {b} = ?"
  say: "What is {a} plus {b}?"

p.geo.which-kind:
  text: "Which one is a {kind|shape:one}?"
p.geo.find-every:
  text: "Find every {kind|shape:one}."
p.geo.fill-outline:
  text: "Fill the outline with the pieces."

# ---------- hints (levels 2–4; replay and show-me are automatic) ----------

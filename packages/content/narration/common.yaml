  text: "Ten more is one more rod. Ten less is one rod less."
h.pv.ones-stay:
  text: "The ones are the same. Just the tens move."
h.pv.chart-row:
  text: "Ten more is one row down. Ten less is one row up."
h.pv.tens-change:
  text: "Think of the tens. One ten more goes up, one ten less goes down."
h.pv.bundle-ten:
  text: "Count out ten. Make them one bundle."
h.pv.rest-ones:
  text: "When fewer than ten are left, they are ones."
h.pv.split-rod:
  text: "Split one rod. It is ten small blocks."
h.pv.same-number:
  text: "Split a ten. How many in all is the same."
h.pv.ten-of-the-ones:
  text: "Ten of the ones make one more ten."
h.pv.bundles-by-ten:
  text: "Each bundle is ten. Count by tens."

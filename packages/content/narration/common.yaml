fb.mc.hour-minute-swap:
  text: "The short hand shows the hour. The long hand shows the minutes."
fb.mc.hour-hand-next:
  text: "The short hand is not at the next number. Look at the number it is after."

# ---------- K01 (#11) patterns, puzzles and all the ways (ALG.01, ALG.02, ALG.04, PUZ.01, PUZ.02,
# CPS.06): shared prompts, hints, solution steps and feedback. Puzzle and split hints name no
# number that could be an answer (03 §9.4 step 7). ----------
p.pattern.find-core:
  text: "Find the part that repeats. Mark it from the start."
p.puzzle.sum-triangle:
  text: "Every side must make {sum}. Fill in the missing numbers."
h.pattern.say-it:
  text: "Say the pattern out loud. Listen for the part that repeats."
# Not "what came after the last one before?": in AAB or ABB that unit has been followed by two
# different units (PR #84 review).
h.pattern.keep-going:
  text: "Find where the pattern starts again. What comes next from there?"
h.pattern.find-core:
  text: "Find where the pattern starts again."
h.pattern.core-same:
  text: "The part that repeats comes back the same, again and again."
h.pattern.grow-look:
  text: "Look at how the numbers grow each time."
h.pattern.grow-rule:
  text: "Count up from one number to the next."
h.pattern.grow-same:
  text: "It grows the same way each time. Do it again and again."
h.puzzle.path-given:
  text: "Start next to a number you can see."
h.puzzle.path-step:
  text: "Each number is one more than the one before it."
h.puzzle.chart-next:
  text: "One box to the right is one more."
h.puzzle.chart-down:
  text: "One row down is ten more."
h.puzzle.side-one:
  text: "Find a side with just one empty box."
h.puzzle.side-add:
  text: "Add the numbers you see on that side. What more makes the side?"

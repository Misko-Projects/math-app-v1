  text: "Let's count each kind again, one by one."
fb.story-problem.retry:
  text: "Let's listen to the story again. Show it with counters."
fb.mc.off-by-one-counting:
  text: "Touch each one once. Count again with me."
fb.mc.count-start-number:
  text: "Start with the first number. Count the hops after it."
fb.mc.count-all-instead:
  text: "Start at the bigger number. Then count on."
fb.mc.forgot-the-ten:
  text: "There is a full ten. Count the ten too!"
  level: K
fb.mc.wrong-operation:
  text: "Look again. Is it plus, is it take away?"
fb.mc.unit-gaps:
  text: "Put each one right at the end of the last one."
fb.mc.bigger-unit-more:
  text: "Look at the size. Bigger ones fit fewer times."
fb.mc.recount-from-one:
  text: "You counted them all. The last number you said tells how many!"
fb.mc.decade-transition:
  text: "Look at the tens. After nine ones, a new ten starts."
fb.mc.teen-reversal:
  text: "Look at the tens. The ten comes first, then the ones."
fb.mc.place-swap:
  text: "Look at the tens. The tens come first, then the ones."
fb.mc.face-value:
  text: "Each bundle is ten, not one. Count the tens by tens."
fb.mc.write-as-spoken:
  text: "Each place gets just one number. Say it again: hundreds, tens, ones."
fb.mc.perceptual-size:
  text: "Size can trick our eyes. Match them up, one and one."

# ---------- K01 (#11) time: time.clock and time.sequence (TIM.01, TIM.04, TIM.08, TIM.09) ----------
p.time.set:
  text: "Make the clock show {time|time}."
p.time.match-digital:
  text: "Make the clock match this time."
p.time.read:
  text: "What time does the clock show?"
h.time.short-hand-set:

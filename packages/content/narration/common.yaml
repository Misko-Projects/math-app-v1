# Shared narration (03 §8.1): prompts (p.*), hints (h.*), feedback (fb.*) and generator steps (gen.*).
# C01 seeds the keys the fixture set needs. K01 extends this file; E01 adds the gen.* keys its
# generators declare.

# ---------- prompts ----------
p.count.how-many:
  text: "How many are there?"
p.count.what-next:
  text: "What number comes next?"
p.count.order:
  text: "Put the numbers in order, starting with the smallest."
p.count.make-n:
  text: "Put {n} in the boat."
p.count.show-fingers:
  text: "Show me {n} fingers."
p.count.find-numeral:
  text: "Which number tells how many?"
p.count.write-numeral:
  text: "Count them. Then tap the number."
# CNT (K01): counting on and back, missing numbers, one more.
p.count.on-to:
  text: "Start at {start}. Count on to {last}."
p.count.back-to:
  text: "Start at {start}. Count back to {last}."
p.count.next-back:
  text: "Count back from {start}. What number comes next?"
p.count.fill-on:
  text: "Count on from {start}. Fill in the missing numbers."
p.count.fill-back:
  text: "Count back from {start}. Fill in the missing numbers."
p.count.fill-tens:
  text: "Count by tens from {start}. Fill in the missing numbers."
p.count.box-on:
  text: "Count on. What number goes in each box?"
p.count.box-back:
  text: "Count back. What number goes in each box?"
p.count.missing:
  text: "Some numbers are missing. Fill them in."
p.count.one-more:
  text: "What number is one more than {start}?"
p.subitize.how-many:
  text: "Look fast! How many did you see?"
p.subitize.how-many-fingers:
  text: "How many fingers did you see?"
p.bond.split:
  text: "Split {whole} into two parts."
p.bond.split-fingers:
  text: "Show {whole} fingers with two hands."
p.bond.missing-part:
  text: "{whole} is {part} and how many more?"
p.bond.make-ten:
  text: "{part} and what number make ten?"
p.bond.new-way:
  text: "Find a new way to split {whole}."
p.add.add-more:
  text: "You have {start}. Add more to make {n}."
p.add.how-many-in-all:
  text: "{a} and {b} more. How many in all?"
p.add.what-is:
  text: "{a} + {b} = ?"
  say: "What is {a} plus {b}?"
# ADD (K01): take away, hops and jumps, the second frame.
p.sub.what-is:
  text: "{a} − {b} = ?"
  say: "What is {a} take away {b}?"
p.sub.take-from:
  text: "Take {b} away from {a}. How many are left?"
p.add.next-frame:
  text: "Put {b} in the next frame. How many in all?"
p.add.hop-on:
  text: "Start on {a} and hop {b} more. Where do you land?"
p.sub.hop-back:
  text: "Start on {a} and hop back {b}. Where do you land?"
p.add.jump-on:
  text: "Start at {a} and jump {b} more. Where do you land?"
p.sub.jump-back:
  text: "Start at {a} and jump back {b}. Where do you land?"

p.geo.which-kind:
  text: "Which one is a {kind|shape:one}?"
p.geo.find-every:
  text: "Find every {kind|shape:one}."
p.geo.fill-outline:
  text: "Fill the outline with the pieces."
# K01 equality (equality.eq) and story problems (story.addsub).
p.eq.box:
  text: "What number goes in the box?"
p.eq.pick:
  text: "Which number goes in the box?"
p.story.listen:
  text: "Listen to the story."
# Story lines (story.addsub `lines`, 03 §4.6): {who} is the resident the TaskRunner names, {item}
# and {other} are contexts.yaml nouns, and {many} is 2, so a noun slot that counts "many" is
# plural. Each context speaks its own verbs (p.story.<context>.*).
p.story.has:
  text: "{who|name} has {a} {item|noun:a}."
p.story.has-some:
  text: "{who|name} has some {item|noun:many}."
p.story.now-has:
  text: "Now {who|name} has {n} {item|noun:n}."
p.story.q.now:
  text: "How many {item|noun:many} does {who|name} have now?"
p.story.q.left:
  text: "How many {item|noun:many} are left?"
p.story.q.start:
  text: "How many {item|noun:many} did {who|name} have at the start?"
p.story.q.all:
  text: "How many {item|noun:many} does {who|name} have in all?"
p.story.q.white:
  text: "How many white ones does {who|name} have?"
p.story.q.both:
  text: "How many could be red, and how many white?"
p.story.pt.two:
  text: "{who|name} has {a} red {item|noun:a} and {b} white {item|noun:b}."
p.story.pt.three:
  text: "{who|name} has {a} red, {b} white and {c} blue {item|noun:many}."
p.story.pt.total:
  text: "{who|name} has {a} {item|noun:a}. Some are red and some are white."
p.story.pt.red:
  text: "{who|name} has {b} red ones."
p.story.cmp.two:
  text: "{who|name} has {a} {item|noun:a} and {b} {other|noun:b}."
p.story.cmp.has-other:
  text: "{who|name} has {a} {other|noun:a}."
p.story.cmp.more:
  text: "{who|name} has {b} more {item|noun:many} than {other|noun:many}."
p.story.cmp.fewer:
  text: "{who|name} has {b} fewer {other|noun:many} than {item|noun:many}."
p.story.cmp.q-more:
  text: "How many more {item|noun:many} than {other|noun:many} does {who|name} have?"
p.story.cmp.q-fewer:
  text: "How many fewer {other|noun:many} than {item|noun:many} does {who|name} have?"
p.story.cmp.q-item:
  text: "How many {item|noun:many} does {who|name} have?"
p.story.cmp.q-other:
  text: "How many {other|noun:many} does {who|name} have?"
p.story.beach-shells.add:
  text: "{who|name} finds {b} more {item|noun:b}."
p.story.beach-shells.add-some:
  text: "{who|name} finds some more."
p.story.beach-shells.take:
  text: "{who|name} gives away {b} {item|noun:b}."
p.story.beach-shells.take-some:
  text: "{who|name} gives some away."
p.story.beach-shells.q-add:
  text: "How many {item|noun:many} did {who|name} find?"
p.story.beach-shells.q-take:
  text: "How many {item|noun:many} did {who|name} give away?"
p.story.lighthouse-lanterns.add:
  text: "{who|name} lights {b} more {item|noun:b}."
p.story.lighthouse-lanterns.add-some:
  text: "{who|name} lights some more."
p.story.lighthouse-lanterns.take:
  text: "{who|name} lets {b} {item|noun:b} go."
p.story.lighthouse-lanterns.take-some:
  text: "{who|name} lets some go."
p.story.lighthouse-lanterns.q-add:
  text: "How many {item|noun:many} did {who|name} light?"
p.story.lighthouse-lanterns.q-take:
  text: "How many {item|noun:many} did {who|name} let go?"
# Equation options (ADD.23 numeral-pick) and the equation a number pad story finishes.
p.story.eq-plus:
  text: "{x} + {y} = {z}"
  say: "{x} plus {y} equals {z}"
p.story.eq-minus:
  text: "{x} − {y} = {z}"
  say: "{x} take away {y} equals {z}"


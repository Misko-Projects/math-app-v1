h.time.day-first:
  text: "Think about your day. What do you do first?"
h.time.day-next:
  text: "What comes next? What comes last?"
h.time.day-strip:
  text: "Look at the one in its place. What goes next to it?"
h.time.morning-or-night:
  text: "Is the sun up? Is it time for bed?"

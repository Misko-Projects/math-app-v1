h.geo.side-lengths:
  text: "Run a finger along each side. Is one side longer?"
h.geo.bins:
  text: "Look at each bin. What goes in it?"
h.geo.where-word:
  text: "Listen for where it goes. Then look at the {anchor|noun:one}."
h.geo.flip:
  text: "Think of the picture. Now look from the {anchor|noun:one}."
h.geo.sticks:
  text: "Put two sticks at each corner. Close every gap."
h.geo.dots:
  text: "Go from dot to dot with straight lines."
h.geo.outline-edges:
  text: "Match a straight edge of a piece to the outline."
h.geo.turn-piece:
  text: "Try turning a piece to make it fit."
h.geo.pieces-inside:
  text: "Picture the pieces inside the shape."
h.geo.grid-rects:
  text: "Put the rectangles in first. Then fill in the squares."
h.mea.both:
  text: "Think of holding it in your hands."
h.mea.is-it:
  text: "Look at each thing. Is it {attr|word}?"

# length, measuring with units and weight (K01: MEA.01, 02, 07, 16, 22)
h.length.line-up:
  text: "Line up the ends on one side."
h.length.look-ends:
  text: "Now look at where each one ends."
h.length.longer-goes-past:
  text: "The longer one goes on when the shorter one stops."
h.length.shorter-stops:
  text: "The shorter one stops first."
h.length.ruler-start:
  text: "They both start at the same line."
h.length.ruler-ends:
  text: "Look where each one ends. Which goes farther?"
h.length.string:
  text: "Lay the string along this one. Then hold it by that one."
h.length.string-past:
  text: "Does that one go on after the string ends?"
h.length.order-shortest:
  text: "Find the shortest one. It goes first."
h.length.order-next:
  text: "Then find the shortest one that is left."
h.length.order-longest:
  text: "Find the longest one. It goes first."
h.length.order-next-long:
  text: "Then find the longest one that is left."
h.length.order-numbers:
  text: "The smallest number is the shortest. It goes first."
h.measure.start-at-end:
  text: "Put the first one right at the end."
h.measure.no-gaps:
  text: "Put each one right next to the last, with no gaps."
h.measure.count-each:
  text: "Count each one as you go."
h.measure.last-number:
  text: "The last number you say tells how long."
h.measure.both-units:
  text: "Measure with the big ones. Then measure again with the small ones."
h.measure.bigger-fewer:
  text: "Bigger ones cover more, so you need fewer of them."
h.measure.which-bigger:
  text: "Look at the two kinds. Which one is bigger?"
h.weight.goes-down:
  text: "The heavier side goes down."
h.weight.level:
  text: "When it does not tip, they weigh the same."
h.weight.more-things:
  text: "More things can be lighter. Watch the balance."
h.weight.lift:
  text: "Think of how heavy each one is. Which one is heavier?"
h.weight.order-heavy:
  text: "The one that is most heavy goes first."

# comparing, ordering, number lines and estimating (K01: CMP)
h.compare.match:
  text: "Match one from each side. Is any left over?"
h.compare.left-over:
  text: "The side with some left over has more."
h.compare.count-each:
  text: "Count each group. Then compare the two numbers."
h.compare.not-size:
  text: "Big ones may not be more. Count them to see."
h.compare.frames:
  text: "Look at the empty boxes in each frame."
h.compare.count-yours:
  text: "Count what you have first."
h.compare.make-same:
  text: "Make them match. Count again after each one."
# {end} follows the ask (compare.numbers): last for greater, first for less.
h.compare.path:
  text: "Find both numbers on the path. Which one comes {end|word}?"
h.compare.count-up:
  text: "Count up from one. Which number do you say {end|word}?"
h.compare.full-frames:
  text: "A full frame is ten. Then count the dots left."
h.compare.tens:
  text: "Look at the tens first. Then look at the ones."
h.compare.line:
  text: "Numbers to the right on the line are greater."
h.compare.one-less:
  text: "Take just one away. Then count them all."
h.compare.one-less-before:
  text: "One less is the number just before it when you count."
h.order.smallest:
  text: "Find the smallest number first."
h.order.path:
  text: "Look where each number is on the path."
h.order.count-up:
  text: "Count up. Which number do you say first?"
h.order.tens:
  text: "Look at the tens first. Which ten comes first?"
h.order.greatest:
  text: "Find the greatest number first."
h.order.count-groups:
  text: "Count each group. Which one has the fewest?"
h.order.fewest-first:
  text: "Put the one with the fewest first. Then the next."
h.numberline.ends:
  text: "Look at the numbers at the two ends."
h.numberline.count-ticks:
  text: "Start at a number you know. Count the ticks."
h.numberline.tens:
  text: "Find the ten just before it. Then think of the ones."
h.numberline.marked:
  text: "Look at the two numbers you see. Compare it to each one."
h.numberline.middle:
  text: "Find the middle of the line first."
h.numberline.near-end:
  text: "Small numbers are near the start. Big ones are near the end."
h.estimate.no-count:
  text: "No need to count each one. Make a good guess."
h.estimate.ten:
  text: "Picture a group of ten. How many groups could fit?"
h.estimate.line:
  text: "Small groups are near the start. Big ones are near the end."
# K01 equality, three addends and story problems. No hint names a number from the item.
h.eq.turn-around:
  text: "Add the numbers in any order. The total is the same."
h.eq.same-both:
  text: "Both sides must make the same number."
h.eq.count-picture:
  text: "Count the two groups in the picture."
h.eq.work-out:
  text: "Work out one side. Then make both sides match."
h.eq.think-parts:
  text: "Think about the parts and the whole."
h.add3.find-ten:
  text: "Look for two numbers that make ten."
h.add3.ten-and:
  text: "Make the ten first. Then add the last number."
h.add3.can-ten:
  text: "Can two of the numbers make ten? Add them first."
h.add3.two-then-one:
  text: "Add two of the numbers. Then add the last one."
h.bar.find-missing:
  text: "Find the box. Is it a part, is it the whole?"
h.bond.join-parts:
  text: "Put both parts together. That makes the whole."
h.numberline.from-mark:
  text: "Start at a number on the line. Then count the jumps."
# CMP.08 symbol picks can show the same number twice (7 _ 7), so their hints cover =.
h.cmp.same-or-greater:
  text: "Are the two numbers the same? Is one greater?"
h.cmp.mark-fits:
  text: "Same numbers get =. For < and >, the open side is next to the greater number."
  say: "Same numbers get equals. For less than and greater than, the open side is next to the greater number."
h.balance.add-one:
  text: "Add one at a time. Watch the balance."
h.cmp.open-side:
  text: "The open side of the mark is next to the greater number."
h.cmp.between:
  text: "Count on from the smaller number. Which number comes next?"
h.story.act-out:
  text: "Show the story with counters."
h.story.which-part:
  text: "Do you know the whole? Do you know the parts?"
h.story.who-has-more:
  text: "Who has more? Who has fewer?"
h.story.check:
  text: "Say the story again with your answer. Does it fit?"
h.story.plus-or-take:
  text: "Do they get more? Do some go away?"
h.story.extra-ones:
  text: "Match them up. Count the ones left over."
h.story.count-groups:
  text: "Count each group. Then count them all."


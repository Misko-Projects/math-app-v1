sk.MDA.05.intro:
  text: "Ten ones make a ten. Ten tens make a hundred!"
sk.MDA.07.intro:
  text: "Add place by place, starting with the ones."
sk.MDA.17.intro:
  text: "Need more to take away? Split one from a bigger place."
sk.MDA.18.intro:
  text: "No tens? Split a hundred into ten tens first."
sk.MDA.21.intro:
  text: "Take away place by place, starting with the ones."


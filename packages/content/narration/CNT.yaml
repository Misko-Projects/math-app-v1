# CNT narration (03 §8): skill intros, template prompts and lesson lines owned by the strand.
sk.CNT.01.intro:
  text: "Let's count up the stones and find what comes next!"
sk.CNT.02.intro:
  text: "Touch each one as you count it."
sk.CNT.03.intro:
  text: "The last number you say tells how many there are."
sk.CNT.04.intro:
  text: "Let's make a group with just the right number."
sk.CNT.05.intro:
  text: "Every number has a look. Let's match them up!"
sk.CNT.06.intro:
  text: "Now let's count big groups, all the way to twenty!"
sk.CNT.07.intro:
  text: "You can start counting from any number."
sk.CNT.08.intro:
  text: "Let's count back, all the way down to zero!"
sk.CNT.09.intro:
  text: "Let's count to one hundred, by ones and by tens!"
sk.CNT.10.intro:
  text: "Let's count on after one hundred, all the way to one hundred twenty!"
sk.CNT.13.intro:
  text: "When there are none, that has a number too!"
sk.CNT.14.intro:
  text: "Each new number is just one more than the one before."
sk.CNT.15.intro:
  text: "Who is first in line, and who is next? Let's find out!"
sk.CNT.16.intro:
  text: "Let's count back from big numbers, one at a time."
sk.CNT.18.intro:
  text: "Some numbers are missing from the road. Let's find them!"
sk.CNT.19.intro:
  text: "So many to count! Make groups of ten first."
sk.CNT.20.intro:
  text: "Count on by tens, then by ones."

tp.CNT.07.t1.prompt:
  text: "Start on {start}. Hop to the next stone."
tp.CNT.14.t1.prompt:
  text: "There are {start} in the boat. Put in one more."
tp.CNT.14.t2.prompt:
  text: "The frame shows {start}. Put in one more, then say how many."
tp.CNT.15.t1.prompt:
  text: "Start at the {from|word}. Tap the {k|ord} one."
tp.CNT.15.t2.prompt:
  text: "Pip hops on the stones. Tap the {k|ord} stone."
tp.CNT.15.t3.prompt:
  text: "Start at the {from|word}. What place is the different one?"
tp.CNT.15.t4.prompt:
  text: "Start at the {from|word}. The different one is in which place?"
tp.CNT.15.t5.prompt:
  text: "What place comes just after {k|ord}?"
tp.CNT.19.t1.prompt:
  text: "Put in {n}. Make a bundle for each ten."
tp.CNT.19.t2.prompt:
  text: "How many? Count the groups of ten, then the ones left."
tp.CNT.19.t3.prompt:
  text: "Show {n} with bundles of ten and some sticks."
tp.CNT.19.t4.prompt:
  text: "How many? A full frame is ten."
tp.CNT.20.t1.prompt:
  text: "Start at {n}. Go {by} more, then {ones} more."
tp.CNT.20.t2.prompt:
  text: "Start at {n}. Jump back {by}, then back {ones}."
tp.CNT.20.t3.prompt:
  text: "Count on {tens} tens, then count on by ones. Fill in the numbers."

ls.CNT.03.w1.s1:
  text: "Watch me touch each shell as I count."
  voice: pip
ls.CNT.03.w1.s2:
  text: "I count each one once. I stop at {n}."
  voice: pip
ls.CNT.03.w1.s3:
  text: "The last number was {n}, so there are {n}!"
  voice: pip
  style: excited
ls.CNT.03.outro:
  text: "Now you count them!"
  voice: pip

ls.CNT.14.w1.s1:
  text: "Here are {start} in the boat. Let's count them."
  voice: pip
ls.CNT.14.w1.s2:
  text: "Now I put in just one more."
  voice: pip
ls.CNT.14.w1.s3:
  text: "{start} and one more is {n}. The next number!"
  voice: pip
  style: excited
ls.CNT.14.f1.s1:
  text: "Here are {start} in the boat."
  voice: pip
ls.CNT.14.f1.s2:
  text: "Now you put in one more."
  voice: pip
ls.CNT.14.f2.s1:
  text: "The frame shows {start}."
  voice: pip
ls.CNT.14.f2.s2:
  text: "Put in one more counter."
  voice: pip
ls.CNT.14.f2.s3:
  text: "How many are there now?"
  voice: pip
ls.CNT.14.outro:
  text: "Your turn. Put in one more!"
  voice: pip
# K02 (#17) slice 1b
sk.CNT.11.intro:
  text: "Let's skip-count by twos and fives, all the way to one hundred!"
sk.CNT.12.intro:
  text: "Let's count by tens and by hundreds, from any number."
sk.CNT.17.intro:
  text: "Let's count on by ones past a new hundred."
tp.CNT.11.t1.prompt:
  text: "Count by {step} from {start}. Fill in the missing numbers."
tp.CNT.11.t3.prompt:
  text: "Each plate has {step} shells. How many shells are there in all?"

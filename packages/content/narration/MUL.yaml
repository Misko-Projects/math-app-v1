# MUL narration (03 §8): skill intros and template prompts owned by the strand.
sk.MUL.12.intro:
  text: "Let's share! One for you, one for you, again and again."

tp.MUL.12.t1.prompt:
  text: "Share the {sprite|noun:items} so each friend gets the same. How many does each get?"
tp.MUL.12.t2.prompt:
  text: "Share them so each friend gets the same. The seagull gets the ones left over."
tp.MUL.12.t3.prompt:
  text: "Pip shares them with {recipients} friends. How many does each friend get?"

# K02 (#17) slice 3a
sk.MUL.01.intro:
  text: "Even or odd? Let's see if everyone has a partner!"
sk.MUL.02.intro:
  text: "Equal groups! Every group has the same number."
sk.MUL.03.intro:
  text: "An array has equal rows. Count them by rows!"
sk.MUL.04.intro:
  text: "Groups of the same number, again and again. That is times!"
sk.MUL.05.intro:
  text: "Share them equally, so every group gets the same."
sk.MUL.22.intro:
  text: "How many groups can we make?"
tp.MUL.01.t1.prompt:
  text: "Share the {sprite|noun:n} between two friends. Is {n} even or odd?"
tp.MUL.01.t2.prompt:
  text: "Share them between two friends. How many are left with no partner?"
tp.MUL.01.t3.prompt:
  text: "Pair them up, two by two. How many are left with no partner?"
tp.MUL.01.t4.prompt:
  text: "Find every even number."
tp.MUL.02.t1.prompt:
  text: "There are {groups} groups of {perGroup}. How many in all?"
tp.MUL.02.t2.prompt:
  text: "Make {groups} groups of {perGroup}. How many in all?"
tp.MUL.02.t3.prompt:
  text: "Start at 0. Here are {groups} jumps of {perGroup}. Where do they land?"
tp.MUL.02.t4.prompt:
  text: "How many {sprite|noun:total} are there in all?"
tp.MUL.03.t1.prompt:
  text: "Make {groups} rows of {perGroup}."
tp.MUL.03.t2.prompt:
  text: "How many in all? Use the equal rows."
tp.MUL.03.t3.prompt:
  text: "Add the equal rows. What is the total?"
tp.MUL.04.t1.prompt:
  text: "Make {groups} groups of {perGroup}. That is {groups} times {perGroup}. How many in all?"
tp.MUL.04.t2.prompt:
  text: "There are {groups} rows of {perGroup}. How much is {groups} times {perGroup}?"
tp.MUL.04.t3.prompt:
  text: "From 0, {groups} jumps of {perGroup}. How much is {groups} times {perGroup}?"
tp.MUL.04.t4.prompt:
  text: "Think of equal groups. What is the total?"
tp.MUL.05.t1.prompt:
  text: "Share the {sprite|noun:items} equally among {recipients} friends. How many does each friend get?"
tp.MUL.05.t2.prompt:
  text: "Share {total} {sprite|noun:total} equally into {groups} groups. How many in each group?"
tp.MUL.05.t3.prompt:
  text: "The {sprite|noun:total} are shared equally into {groups} rows. How many in each row?"
tp.MUL.05.t4.prompt:
  text: "Share {total} equally into {groups} groups. How many in each group?"
tp.MUL.22.t1.prompt:
  text: "Put {total} {sprite|noun:total} into groups of {perGroup}. How many groups can you make?"
tp.MUL.22.t2.prompt:
  text: "Hop from 0 to {total} in jumps of {perGroup}."
tp.MUL.22.t3.prompt:
  text: "Make groups of {perGroup}. How many groups can you make?"
ls.MUL.04.outro:
  text: "Times means groups of. Three times four is three groups of four!"
ls.MUL.05.outro:
  text: "Share equally, and every group gets the same. That is dividing!"

# K02 (#17) slice 3b
sk.MUL.06.intro:
  text: "Turn a fact around and the answer stays the same. Let's times by 0 and 1!"
sk.MUL.07.intro:
  text: "A big fact can break into two smaller facts. Add the parts!"
sk.MUL.11.intro:
  text: "Times tens! Find the tens, then say them as a number."
sk.MUL.13.intro:
  text: "Count by 2s, 5s and 10s to times fast!"
sk.MUL.14.intro:
  text: "Times 4 is a double of a double. Let's double!"
sk.MUL.15.intro:
  text: "Use a fact you know, then add or take away a group."
sk.MUL.16.intro:
  text: "Three numbers to times? Pick two to start. Any order works!"
tp.MUL.06.t1.prompt:
  text: "How many in all? Look at the groups."
tp.MUL.06.t2.prompt:
  text: "What number makes it true?"
tp.MUL.06.t3.prompt:
  text: "Turn the array around. What number makes it true?"
tp.MUL.06.t4.prompt:
  text: "Turn it around. What number makes it true?"
tp.MUL.13.t1.prompt:
  text: "Count by {b}s. How many in all?"
tp.MUL.13.t2.prompt:
  text: "Count the jumps by {f}s. How much is {a} times {b}?"
tp.MUL.13.t3.prompt:
  text: "Skip-count to find the answer."
tp.MUL.14.t1.prompt:
  text: "Split the array in half. Find one half, then double it. How many in all?"
tp.MUL.14.t2.prompt:
  text: "Find half first, then double it. Fill in each box."
tp.MUL.14.t3.prompt:
  text: "Use doubles. Fill in each box."
tp.MUL.14.t4.prompt:
  text: "Use doubles to find the answer."
tp.MUL.15.t1.prompt:
  text: "{k} groups of {o} make {known}. Here is one more group. How many in all?"
tp.MUL.15.t2.prompt:
  text: "Use a fact you know, then add or take away a group. Fill in each box."
tp.MUL.15.t3.prompt:
  text: "Start with a fact you know. Fill in each box."
tp.MUL.15.t4.prompt:
  text: "Use a fact you know to find the answer."
tp.MUL.16.t1.prompt:
  text: "Times {x} and {y} first: that is one group. How many in all?"
tp.MUL.16.t2.prompt:
  text: "Each group is {x} times {y}. Fill in each box."
tp.MUL.16.t3.prompt:
  text: "Times two numbers first, then the last one. Fill in each box."
tp.MUL.07.t1.prompt:
  text: "Break it into 5 and the rest. Find each part, then the total."
tp.MUL.07.t2.prompt:
  text: "Draw a line to split the array into two parts. How many in all?"
tp.MUL.07.t3.prompt:
  text: "Break it apart. Find each part, then the total."
tp.MUL.11.t1.prompt:
  text: "Here are {a} groups of {t} tens. How much is {a} times {b}?"
tp.MUL.11.t2.prompt:
  text: "One group is {t} tens. How much is {a} times {b}?"
tp.MUL.11.t3.prompt:
  text: "Think in tens. Fill in each box."
tp.MUL.11.t4.prompt:
  text: "Think in tens to find the answer."
ls.MUL.07.outro:
  text: "Break a fact into parts you know, then add the parts. That is breaking apart!"

# ALG narration (03 §8): skill intros and template prompts owned by the strand.
sk.ALG.01.intro:
  text: "Patterns repeat. Let's make a pattern go on!"
sk.ALG.02.intro:
  text: "Some number patterns grow the same way each time."
sk.ALG.04.intro:
  text: "A pattern has a part that repeats. Let's find it!"

tp.ALG.01.t1.prompt:
  text: "Make the pattern go on. Put on what comes next."
tp.ALG.01.t2.prompt:
  text: "Fill each empty box so the pattern goes on."
tp.ALG.01.t3.prompt:
  text: "Put the last cards in order so the pattern goes on."
tp.ALG.02.t1.prompt:
  text: "The chart shows {a}, {b}, {c}. Tap the next {ask} numbers in the pattern."
tp.ALG.02.t2.prompt:
  text: "Jump to the next number in the pattern {a}, {b}, {c}. Where do you land?"
tp.ALG.02.t3.prompt:
  text: "What comes after {a}, {b}, {c}? Fill in each empty box."
tp.ALG.02.t4.prompt:
  text: "{a}, {b}, {c}. How much does it grow each time?"
tp.ALG.04.t3.prompt:
  text: "Make the next repeat. Put the cards in order."

sk.ALG.05.intro:
  text: "When both sides are the same, the balance is level."
tp.ALG.05.t1.prompt:
  text: "Add some to the light side. Make it balance!"
tp.ALG.05.t2.prompt:
  text: "Do both groups have the same number?"
tp.ALG.05.t3.prompt:
  text: "Does it balance? Do both sides have the same?"
tp.ALG.05.t4.prompt:
  text: "Count each side. Add some to make it balance!"

# K02 slice 4e (#17): grade 2 equality and growing shapes.
sk.ALG.06.intro:
  text: "When one number goes up, the other can go down. Both sides stay the same."
  level: "2"
sk.ALG.07.intro:
  text: "Find the number in the box that makes both sides the same."
  level: "2"
sk.ALG.10.intro:
  text: "Some shape patterns grow by the same number of squares each step."
  level: "2"
tp.ALG.06.t1.prompt:
  text: "Don't add it all up. What number in the box makes it balance?"
  level: "2"
tp.ALG.06.t2.prompt:
  text: "Does it balance? Compare the numbers. Don't add them all up."
  level: "2"
tp.ALG.07.t1.prompt:
  text: "What number in the box makes it balance?"
  level: "2"
tp.ALG.10.t1.prompt:
  text: "The pattern grows. Build the next step with squares."
  level: "2"
tp.ALG.10.t2.prompt:
  text: "These are the squares in each step. How many squares go in each empty step?"
  level: "2"
tp.ALG.10.t3.prompt:
  text: "Step 1 has {a} squares, step 2 has {b}, step 3 has {c}. How many squares are in step {k}?"
  level: "2"

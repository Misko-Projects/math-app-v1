    constraints: ["carries == 0", "result <= 99"]
    difficulty: { base: -0.45 }
    narration: { prompt: tp.MDA.09.t1.prompt, hints: [h.mda.tens-with-tens, h.mda.ones-with-ones] }

  - id: MDA.09.t2
    skillId: MDA.09
    format: expanded-form
    tier: pictorial

    tier: pictorial
    representation: ten-frame
    generator: addsub.facts
    params: { a: { int: [1, 5] }, b: { int: [0, 5] }, op: "-", unknown: result, maxSum: 5 }
    difficulty: { base: 0.25 }
    narration: { prompt: p.sub.what-is, hints: [h.addsub.know-it, h.addsub.picture] }

  - id: ADD.02.t3
    skillId: ADD.02
    format: number-pad
    tier: abstract
    representation: symbols
    generator: addsub.facts
    params: { a: { int: [0, 5] }, b: { int: [0, 5] }, op: "+", unknown: result, maxSum: 5 }
    difficulty: { base: 0.6 }
    narration: { prompt: p.add.what-is, hints: [h.addsub.know-it, h.add.fingers] }

  - id: ADD.02.t4
    skillId: ADD.02
    format: number-pad
    tier: abstract
    representation: symbols
    generator: addsub.facts

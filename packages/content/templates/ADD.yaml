    difficulty: { base: 0.25 }
    narration: { prompt: p.sub.what-is, hints: [h.addsub.know-it, h.sub.fingers-down] }

  - id: ADD.02.t5
    skillId: ADD.02
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: addsub.facts
    params: { a: { int: [0, 5] }, b: { int: [0, 5] }, op: "+", unknown: result, maxSum: 5 }
    difficulty: { base: 0.6 }
    narration: { prompt: p.add.what-is, hints: [h.addsub.know-it] }


# ADD templates (K01) on count.set and addsub.facts (03 §5.6). ADD.01 and ADD.03 keep the ids,
# formats, tiers and representations they shipped with in C01 (03 §4.3). One template per catalog
# format at least, every catalog representation used, ordered concrete → pictorial → abstract.
# Every skill has a constructed-answer template; numeral-pick templates are diagnostic extras.
# Prompts name the operation, so a template keeps one `op` (except ADD.26, whose ten-and-ones
# prompt fits both). Bases are tuned from template-stats so each median sits near d = 0.
strand: ADD
templates:
  # ---------- ADD.01: join within 10 with objects (K) ----------
  - id: ADD.01.t1
    skillId: ADD.01
    format: make-set
    tier: concrete
    generator: count.set
    params: { start: { int: [1, 6] }, n: { int: [2, 10] }, mode: add-more }
    constraints: ["start < n"]
    difficulty: { base: -0.6 }
    narration: { prompt: p.add.add-more, hints: [h.add.join, h.count.touch-each] }

  - id: ADD.01.t2
    skillId: ADD.01
    format: make-set
    tier: concrete
    representation: fingers
    generator: count.set
    params: { start: { int: [1, 5] }, n: { int: [2, 10] }, mode: add-more }
    constraints: ["start < n"]
    difficulty: { base: -0.6 }
    narration: { prompt: tp.ADD.01.t2.prompt, hints: [h.add.fingers] }

  - id: ADD.01.t3
    skillId: ADD.01
    format: tenframe-fill
    tier: concrete
    generator: addsub.facts
    params: { a: { int: [1, 9] }, b: { int: [1, 9] }, op: "+", unknown: result, family: any }
    constraints: ["a + b <= 10"]
    difficulty: { base: -0.6 }
    narration: { prompt: p.add.how-many-in-all, hints: [h.add.join, h.count.show-frame] }

  - id: ADD.01.t4
    skillId: ADD.01
    format: number-pad
    tier: abstract
    generator: addsub.facts
    params: { a: { int: [0, 9] }, b: { int: [0, 9] }, op: "+", unknown: result, family: any }
    constraints: ["a + b <= 10"]
    difficulty: { base: 0.0 }
    narration: { prompt: p.add.what-is, hints: [h.add.join, h.add.fingers] }


# ALG templates (K01, #11): repeating patterns on pattern.repeat (ALG.01, ALG.04) and growing number
# patterns on pattern.grow (ALG.02). Shown lengths often end inside a core, so MC.pattern-restart
# (starting again from the first token) gives a wrong answer that the check can name. ALG.05 is on
# compare.sets (03 §5.6): making the pans balance (make-equal, balance.equal) is the constructed
# practice at the concrete and pictorial tiers (V27); "do they balance?" and "are they the same?"
# are choice extras.
strand: ALG
templates:
  # ---------- ALG.01: copy and extend a repeating pattern ----------
  - id: ALG.01.t1
    skillId: ALG.01
    format: pattern-extend
    tier: concrete
    representation: objects
    generator: pattern.repeat
    params:
      mode: extend
      core: { choice: [AB, AAB, ABB, ABC] }
      shown: { int: [4, 7] }
      ask: { int: [1, 2] }
    difficulty: { base: -0.7 }
    narration:
      prompt: tp.ALG.01.t1.prompt
      hints: [h.pattern.say-it, h.pattern.keep-going]

  - id: ALG.01.t2
    skillId: ALG.01
    format: pattern-extend
    tier: pictorial
    representation: shapes
    generator: pattern.repeat
    params:
      mode: { choice: [extend, fill] }
      core: { choice: [AB, AAB, ABB, ABC, AABB] }
      shown: { int: [5, 8] }
      ask: { int: [1, 2] }
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.ALG.01.t2.prompt
      hints: [h.pattern.say-it, h.pattern.core-same]

  # The whole pattern as cards, the first ones fixed: put the next ones (all different) in order.
  - id: ALG.01.t3
    skillId: ALG.01
    format: order
    tier: pictorial
    representation: objects
    generator: pattern.repeat
    params:
      core: { choice: [AB, AAB, ABB, ABC] }
      shown: { int: [3, 7] }
      ask: { int: [2, 3] }
    difficulty: { base: -0.8 }
    narration:
      prompt: tp.ALG.01.t3.prompt
      hints: [h.pattern.say-it, h.pattern.keep-going]

  # ---------- ALG.02: growing number patterns ----------
  # The chart shades the three given terms (`patternShown`), and the prompt says so.
  - id: ALG.02.t1
    skillId: ALG.02
    format: hundred-chart
    tier: pictorial
    representation: hundred-chart
    generator: pattern.grow
    params:
      start: { int: [1, 40] }
      step: { choice: [1, 2, 10] }
      ask: { int: [2, 3] }
    # The chart's own pattern.step weight is for skip counts; +1 is the easy rule here.
    difficulty: { base: -0.8, features: { pattern.step: 0 } }
    narration:
      prompt: tp.ALG.02.t1.prompt
      hints: [h.pattern.grow-look, h.pattern.grow-rule, h.pattern.grow-same]

  - id: ALG.02.t2
    skillId: ALG.02
    format: number-line-jump
    tier: pictorial
    representation: number-line
    generator: pattern.grow
    params:
      start: { int: [1, 40] }
      step: { choice: [1, 2, 10] }
      ask: 1
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.ALG.02.t2.prompt
      hints: [h.pattern.grow-look, h.pattern.grow-rule, h.pattern.grow-same]

  - id: ALG.02.t3
    skillId: ALG.02
    format: pattern-extend
    tier: abstract
    representation: symbols
    generator: pattern.grow
    params:
      mode: extend
      start: { int: [1, 60] }
      step: { choice: [1, 2, 10] }
      ask: { int: [1, 2] }
    difficulty: { base: -0.5 }
    narration:
      prompt: tp.ALG.02.t3.prompt
      hints: [h.pattern.grow-look, h.pattern.grow-rule, h.pattern.grow-same]

  - id: ALG.02.t4
    skillId: ALG.02
    format: pattern-extend
    tier: abstract
    representation: symbols
    generator: pattern.grow
    params:
      mode: rule
      start: { int: [1, 80] }
      step: { choice: [1, 2, 10] }
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.ALG.02.t4.prompt
      hints: [h.pattern.grow-look, h.pattern.grow-rule]

  # ---------- ALG.04: find the core ----------
  # AAB and AABB weigh more: on them, stopping where the first unit comes back is a wrong core.
  - id: ALG.04.t1
    skillId: ALG.04
    format: pattern-extend
    tier: concrete
    representation: objects
    generator: pattern.repeat
    params:
      mode: core
      core: { choice: [AB, AAB, ABB, ABC, AABB], weights: [1, 2, 1, 1, 2] }
      shown: { int: [6, 9] }
    difficulty: { base: -0.7 }
    narration:
      prompt: p.pattern.find-core
      hints: [h.pattern.find-core, h.pattern.core-same]

  - id: ALG.04.t2
    skillId: ALG.04
    format: pattern-extend
    tier: pictorial
    representation: shapes
    generator: pattern.repeat
    params:
      mode: core
      core: { choice: [AB, AAB, ABB, ABC, AABB], weights: [1, 2, 1, 1, 2] }
      shown: { int: [6, 10] }
    difficulty: { base: -0.7 }
    narration:
      prompt: p.pattern.find-core
      hints: [h.pattern.find-core, h.pattern.core-same]

  # Make the next repeat: whole cores are fixed and the free cards are exactly one more core
  # (mode core: ask = core length, shown a multiple of it, PR #84 review). The free cards must all
  # be different units, so the core repeats none (AB, ABC).
  - id: ALG.04.t3
    skillId: ALG.04
    format: order
    tier: pictorial
    representation: objects
    generator: pattern.repeat
    params:
      mode: core
      core: { choice: [AB, ABC] }
      shown: { choice: [4, 6] }
      ask: { choice: [2, 3] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.ALG.04.t3.prompt
      hints: [h.pattern.find-core, h.pattern.core-same]

  # ---------- ALG.05: balanced means the same amount on both sides (K) ----------
  - id: ALG.05.t1
    skillId: ALG.05
    format: balance
    tier: concrete
    representation: balance
    generator: compare.sets
    params: { a: { int: [1, 8] }, b: { int: [1, 8] }, ask: make }
    constraints: ["a != b"]
    difficulty: { base: -0.2 }
    narration: { prompt: tp.ALG.05.t1.prompt, hints: [h.weight.goes-down, h.balance.add-one] }

  - id: ALG.05.t2
    skillId: ALG.05
    format: compare
    tier: concrete
    representation: objects
    generator: compare.sets
    params: { a: { int: [1, 8] }, b: { int: [1, 8] }, ask: same }
    difficulty: { base: -0.65 }
    narration: { prompt: tp.ALG.05.t2.prompt, hints: [h.compare.match, h.compare.left-over] }

  - id: ALG.05.t3
    skillId: ALG.05
    format: balance
    tier: pictorial
    representation: balance
    generator: compare.sets
    params: { a: { int: [1, 8] }, b: { int: [1, 8] }, ask: same }
    difficulty: { base: -1.35 }
    narration: { prompt: tp.ALG.05.t3.prompt, hints: [h.weight.level, h.compare.count-each] }

  - id: ALG.05.t4
    skillId: ALG.05
    format: balance
    tier: pictorial
    representation: balance
    generator: compare.sets
    params: { a: { int: [1, 8] }, b: { int: [1, 8] }, ask: make }
    constraints: ["a != b"]
    difficulty: { base: -0.6 }
    narration: { prompt: tp.ALG.05.t4.prompt, hints: [h.compare.count-each, h.balance.add-one] }

  # ---------- K02 slice 4e (#17): grade 2 equality and growing shapes ----------
  # ALG.06: the shown number c sits 1 to 3 from its partner (`near`), so comparing beats adding up:
  # 7 + 5 = 8 + ?, the 8 went up by 1, so the box goes down by 1. The abstract hint says it with the
  # item's own numbers, both directions (c above or below its partner).
  - id: ALG.06.t1
    skillId: ALG.06
    format: balance
    tier: pictorial
    representation: balance
    generator: equality.eq
    params:
      form: { choice: [a+b=c+_, a+b=_+c] }
      near: 3
      a: { int: [6, 48] }
      b: { int: [6, 48] }
      c: { int: [1, 60] }
      maxN: 99
    difficulty: { base: -4.27 }
    narration: { prompt: tp.ALG.06.t1.prompt, hints: [h.eq.compare-not-add, h.eq.compensate] }

  - id: ALG.06.t2
    skillId: ALG.06
    format: balance
    tier: pictorial
    representation: balance
    generator: equality.eq
    params:
      form: { choice: [a+b=c+_, a+b=_+c] }
      mode: judge
      near: 3
      off: { choice: [-2, -1, 1, 2] }
      a: { int: [6, 48] }
      b: { int: [6, 48] }
      c: { int: [1, 60] }
      maxN: 99
    difficulty: { base: -4.4 }
    narration: { prompt: tp.ALG.06.t2.prompt, hints: [h.eq.compare-not-add, h.eq.same-both] }

  - id: ALG.06.t3
    skillId: ALG.06
    format: number-pad
    tier: abstract
    representation: symbols
    generator: equality.eq
    params:
      form: { choice: [a+b=c+_, a+b=_+c] }
      near: 3
      a: { int: [11, 59] }
      b: { int: [11, 39] }
      c: { int: [1, 70] }
      maxN: 99
    difficulty: { base: -4.4 }
    narration: { prompt: p.eq.box, hints: [h.eq.compare-not-add, h.eq.compensate] }

  # ALG.07: the box anywhere in a balance puzzle, first too (? + 4 = 6 + 3).
  - id: ALG.07.t1
    skillId: ALG.07
    format: balance
    tier: pictorial
    representation: balance
    generator: equality.eq
    params:
      form: { choice: [_+c=a+b, a+b=_+c, a+b=c+_], weights: [2, 1, 1] }
      a: { int: [2, 30] }
      b: { int: [2, 30] }
      c: { int: [1, 30] }
      maxN: 60
    difficulty: { base: -3.3 }
    narration: { prompt: tp.ALG.07.t1.prompt, hints: [h.eq.work-out, h.eq.same-both] }

  - id: ALG.07.t2
    skillId: ALG.07
    format: number-pad
    tier: abstract
    representation: symbols
    generator: equality.eq
    params:
      form: { choice: [_+c=a+b, a+b=_+c, a+b=c+_], weights: [2, 1, 1] }
      op: { choice: ["+", "-"], weights: [2, 1] }
      a: { int: [2, 40] }
      b: { int: [2, 30] }
      c: { int: [1, 40] }
      maxN: 80
    difficulty: { base: -3.2 }
    narration: { prompt: p.eq.box, hints: [h.eq.work-out, h.eq.same-both] }

  # ALG.10: squares in each step grow by 1 to 3. Build the next stack (tiles), or type how many
  # squares the empty steps have (the counts in a row).
  # K02 slice 4c-2 (#17): input–output machines (alg.function). The table shows the pairs out of
  # order and unevenly spaced (the Out row read as a pattern is never right); about one add item in
  # three has a first pair that also doubles (2 → 4 under add 2), and doubling the asked number is
  # wrong. The number-pad prompt names the direction (adds / takes away), one template each.
  - id: ALG.09.t1
    skillId: ALG.09
    format: pattern-extend
    tier: pictorial
    representation: table
    generator: alg.function
    params:
      op: add
      n: { int: [1, 5] }
      max: 20
      rows: 4
      blanks: 1
      lure: { choice: [1, 0, 0] }
      arrange: { int: [0, 9999] }
    difficulty: { base: -0.5, features: { answer.over10: 0.4 } }
    narration:
      prompt: tp.ALG.09.t1.prompt
      hints: [h.machine.one-pair, h.machine.check-pair, h.machine.do-same]

  - id: ALG.09.t2
    skillId: ALG.09
    format: pattern-extend
    tier: abstract
    representation: table
    generator: alg.function
    params:
      op: { choice: [add, sub] }
      n: { int: [2, 9] }
      max: 60
      rows: 4
      blanks: 2
      lure: { choice: [1, 0, 0] }
      arrange: { int: [0, 9999] }
    difficulty: { base: -1.0 }
    narration:
      prompt: tp.ALG.09.t2.prompt
      hints: [h.machine.bigger-smaller, h.machine.one-pair, h.machine.check-pair]

  - id: ALG.09.t3
    skillId: ALG.09
    format: number-pad
    tier: abstract
    representation: symbols
    generator: alg.function
    params:
      op: add
      n: { int: [2, 9] }
      max: 40
      rows: 2
      blanks: 0
      lure: 0
      arrange: { int: [0, 9999] }
    difficulty: { base: -0.5 }
    narration:
      prompt: tp.ALG.09.t3.prompt
      hints: [h.machine.count-up, h.machine.check-pair]

  - id: ALG.09.t4
    skillId: ALG.09
    format: number-pad
    tier: abstract
    representation: symbols
    generator: alg.function
    params:
      op: sub
      n: { int: [2, 9] }
      max: 40
      rows: 2
      blanks: 0
      lure: 0
      arrange: { int: [0, 9999] }
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.ALG.09.t4.prompt
      hints: [h.machine.count-back, h.machine.check-pair]

  - id: ALG.10.t1
    skillId: ALG.10
    format: pattern-extend
    tier: pictorial
    representation: tiles
    generator: pattern.grow
    params:
      kind: shape
      mode: extend
      start: { int: [2, 4] }
      step: { int: [1, 3] }
      ask: 1
    difficulty: { base: -0.7 }
    narration: { prompt: tp.ALG.10.t1.prompt, hints: [h.grow.count-steps, h.grow.add-same] }

  - id: ALG.10.t2
    skillId: ALG.10
    format: pattern-extend
    tier: abstract
    representation: table
    generator: pattern.grow
    params:
      kind: shape
      mode: extend
      start: { int: [2, 6] }
      step: { int: [1, 3] }
      ask: { int: [1, 2] }
    difficulty: { base: -0.7 }
    narration: { prompt: tp.ALG.10.t2.prompt, hints: [h.grow.count-steps, h.grow.add-same] }

  - id: ALG.10.t3
    skillId: ALG.10
    format: number-pad
    tier: abstract
    representation: table
    generator: pattern.grow
    params:
      kind: shape
      mode: extend
      start: { int: [2, 6] }
      step: { int: [1, 3] }
      ask: { int: [1, 2] }
    difficulty: { base: -0.8 }
    narration: { prompt: tp.ALG.10.t3.prompt, hints: [h.grow.add-same, h.grow.keep-adding] }

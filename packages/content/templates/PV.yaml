# PV templates (03 §4.3). K01: the grade-1 place-value rows; K02 slice 1a: the grade-2 rows to
# 1000 (PV.04–PV.07, PV.12, PV.14–PV.17, PV.24). The place-value chart (pv-chart) is the
# base-ten-trade mat with its columns, as in PV.01.t4. Base-ten pieces follow the U04 models
# (engine README, "Conventions the U04 formats fix"): a build answers with the mat, checked by
# baseten.value (any pieces worth the number) or baseten.exact.
strand: PV
templates:
  # ---------- PV.01 two-digit numbers are tens and ones (gateway) ----------
  - id: PV.01.t1
    skillId: PV.01
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.number
    params: { n: { int: [21, 99] }, mode: build }
    difficulty: { base: -0.7 }
    narration: { prompt: tp.PV.01.t1.prompt, hints: [h.pv.tens-first, h.pv.ones-last] }

  - id: PV.01.t2
    skillId: PV.01
    format: base-ten-build
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params: { n: { int: [21, 99] }, mode: read }
    difficulty: { base: -0.5 }
    narration: { prompt: tp.PV.01.t2.prompt, hints: [h.pv.rod-is-ten, h.pv.count-tens-ones] }

  # A full ten-frame is a ten (ten-frame pictures hold at most 20).
  - id: PV.01.t3
    skillId: PV.01
    format: number-pad
    tier: pictorial
    representation: ten-frame
    generator: count.set
    params: { n: { int: [11, 20] }, layout: ten-frame, mode: how-many }
    difficulty: { base: -1.7 }
    narration: { prompt: tp.PV.01.t3.prompt, hints: [h.subitize.full-ten, h.pv.ten-and-more] }

  # The place-value chart: ten ones in the ones column become one more ten.
  - id: PV.01.t4
    skillId: PV.01
    format: base-ten-trade
    tier: pictorial
    representation: pv-chart
    generator: pv.regroup
    params: { n: { int: [21, 99] }, from: regrouped, to: canonical }
    difficulty: { base: -0.8 }
    narration: { prompt: tp.PV.01.t4.prompt, hints: [h.pv.ten-ones-bundle, h.pv.ones-under-ten] }

  - id: PV.01.t5
    skillId: PV.01
    format: expanded-form
    tier: pictorial
    representation: expanded
    generator: pv.number
    params: { n: { int: [21, 99] }, mode: build }
    difficulty: { base: -0.7 }
    narration: { prompt: tp.PV.01.t5.prompt, hints: [h.pv.tens-card, h.pv.ones-card] }

  - id: PV.01.t6
    skillId: PV.01
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.number
    params: { n: { int: [21, 99] }, mode: write }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.PV.01.t6.prompt, hints: [h.pv.tens-first-digit, h.pv.ones-last] }

  # ---------- PV.02 compare two-digit numbers ----------
  - id: PV.02.t1
    skillId: PV.02
    format: compare
    tier: pictorial
    representation: base-ten
    generator: compare.numbers
    params:
      a: { int: [10, 99] }
      b: { int: [10, 99] }
      extra: 0
      min: 10
      max: 99
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -0.92 }
    narration: { prompt: tp.PV.02.t1.prompt, hints: [h.compare.tens, h.compare.same-tens] }

  # Constructed practice (V27): two-digit numbers as base-ten pictures, no numerals.
  - id: PV.02.t2
    skillId: PV.02
    format: order
    tier: pictorial
    representation: base-ten
    generator: compare.numbers
    params: { a: { int: [10, 99] }, b: { int: [10, 99] }, extra: 1, min: 10, max: 99, ask: fewer }
    difficulty: { base: -0.3, features: { closeness: 0.5 } }
    narration: { prompt: tp.PV.02.t2.prompt, hints: [h.compare.tens, h.order.fewest-first] }

  - id: PV.02.t3
    skillId: PV.02
    format: compare
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      a: { int: [10, 99] }
      b: { int: [10, 99] }
      extra: 0
      min: 0
      max: 100
      ask: { choice: [more, fewer], weights: [1, 1] }
    difficulty: { base: -1.07 }
    narration: { prompt: tp.PV.02.t3.prompt, hints: [h.compare.line, h.compare.tens] }

  - id: PV.02.t4
    skillId: PV.02
    format: compare
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params: { a: { int: [10, 99] }, b: { int: [10, 99] }, extra: 0, min: 10, max: 99, ask: symbol }
    difficulty: { base: -1.31 }
    # 10–99 on both sides can draw the same number twice (42 _ 42), so the mark hint covers =.
    narration: { prompt: tp.PV.02.t4.prompt, hints: [h.compare.tens, h.cmp.mark-fits] }

  - id: PV.02.t5
    skillId: PV.02
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [10, 99] },
        b: { int: [10, 99] },
        extra: { int: [1, 2] },
        min: 10,
        max: 99,
        ask: fewer,
      }
    difficulty: { base: -0.6, features: { closeness: 0.5 } }
    narration: { prompt: tp.PV.02.t5.prompt, hints: [h.order.smallest, h.compare.tens] }

  # ---------- PV.03 ten more and ten less ----------
  - id: PV.03.t1
    skillId: PV.03
    format: base-ten-build
    tier: concrete
    representation: base-ten
    generator: pv.tenmore
    params: { n: { int: [11, 89] }, delta: { choice: [10, -10] } }
    difficulty: { base: -0.5 }
    narration: { prompt: tp.PV.03.t1.prompt, hints: [h.pv.one-rod, h.pv.ones-stay] }

  - id: PV.03.t2
    skillId: PV.03
    format: hundred-chart
    tier: pictorial
    generator: pv.tenmore
    params: { n: { int: [11, 89] }, delta: { choice: [10, -10] } }
    difficulty: { base: -0.55 }
    narration: { prompt: tp.PV.03.t2.prompt, hints: [h.pv.chart-row, h.pv.ones-stay] }

  - id: PV.03.t3
    skillId: PV.03
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.tenmore
    params: { n: { int: [11, 89] }, delta: { choice: [10, -10] } }
    difficulty: { base: -0.3 }
    narration: { prompt: tp.PV.03.t3.prompt, hints: [h.pv.ones-stay, h.pv.tens-change] }

  # ---------- PV.04 a hundred is ten tens (gateway, K02) ----------
  # Ten bundles of ten are tied into one hundred: n is 100–900, shown with one hundred as ten tens.
  - id: PV.04.t1
    skillId: PV.04
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.regroup
    params: { n: { int: [100, 900], step: 100 }, from: regrouped, to: canonical, places: 3 }
    difficulty: { base: -3.4 }
    narration:
      { prompt: tp.PV.04.t1.prompt, hints: [h.pv.ten-tens-hundred, h.pv.count-by-hundreds] }

  # Unbundle: one hundred becomes ten tens.
  - id: PV.04.t2
    skillId: PV.04
    format: base-ten-trade
    tier: pictorial
    representation: base-ten
    generator: pv.regroup
    params: { n: { int: [100, 900], step: 100 }, from: canonical, to: regrouped, places: 3 }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.PV.04.t2.prompt, hints: [h.pv.split-flat, h.pv.same-number] }

  # Count by tens down the chart to the last box: ten rows of ten are one hundred.
  - id: PV.04.t3
    skillId: PV.04
    format: hundred-chart
    tier: pictorial
    generator: pv.tenmore
    params: { n: { int: [10, 80], step: 10 }, delta: 10, moves: { int: [2, 9] } }
    constraints: ["n + 10 * moves == 100"]
    difficulty: { base: -3.0 }
    narration: { prompt: tp.PV.04.t3.prompt, hints: [h.pv.chart-row, h.pv.ten-rows] }

  - id: PV.04.t4
    skillId: PV.04
    format: number-pad
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params: { n: { int: [100, 900], step: 100 }, mode: read }
    difficulty: { base: -1.6 }
    narration: { prompt: tp.PV.04.t4.prompt, hints: [h.pv.flat-is-hundred, h.pv.count-by-hundreds] }

  # A picture with real proportions: ten rods side by side are as big as one flat. (On the mats a
  # number with hundreds is drawn as place-value disks, 03 §5.5; here the sizes carry the meaning.)
  - id: PV.04.t5
    skillId: PV.04
    format: number-pad
    tier: pictorial
    representation: base-ten
    generator: pv.regroup
    params: { n: { int: [100, 900], step: 100 }, from: regrouped, places: 3 }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.PV.04.t5.prompt, hints: [h.pv.flat-is-hundred, h.pv.ten-tens-hundred] }

  - id: PV.04.t6
    skillId: PV.04
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.regroup
    params: { n: { int: [100, 900], step: 100 }, from: regrouped, places: 3 }
    difficulty: { base: -1.0 }
    narration:
      { prompt: tp.PV.04.t6.prompt, hints: [h.pv.ten-tens-hundred, h.pv.count-by-hundreds] }

  # ---------- PV.05 read and write numbers to 1000 (K02) ----------
  # Read the mat (place-value disks, 03 §5.5): a proportional picture of a number to 999 would
  # draw rods and cubes too small to count.
  - id: PV.05.t1
    skillId: PV.05
    format: base-ten-build
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params:
      { n: { int: [100, 999] }, zeros: { choice: [any, internal], weights: [3, 1] }, mode: read }
    difficulty: { base: -1.3 }
    narration: { prompt: tp.PV.05.t1.prompt, hints: [h.pv.flat-is-hundred, h.pv.count-hundreds] }

  - id: PV.05.t2
    skillId: PV.05
    format: expanded-form
    tier: pictorial
    representation: expanded
    generator: pv.number
    params:
      {
        n: { int: [100, 999] },
        zeros: { choice: [any, internal], weights: [3, 1] },
        mode: expanded,
      }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.PV.05.t2.prompt, hints: [h.pv.hundreds-first, h.pv.zero-holds] }

  # Hear the number name, enter the numeral.
  - id: PV.05.t3
    skillId: PV.05
    format: expanded-form
    tier: abstract
    representation: words
    generator: pv.number
    params:
      { n: { int: [100, 999] }, zeros: { choice: [any, internal], weights: [3, 1] }, mode: words }
    difficulty: { base: -1.6 }
    narration: { prompt: tp.PV.05.t3.prompt, hints: [h.pv.listen-hundreds, h.pv.zero-holds] }

  - id: PV.05.t4
    skillId: PV.05
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: pv.number
    params:
      {
        n: { int: [100, 999] },
        zeros: { choice: [any, internal], weights: [3, 1] },
        mode: expanded,
      }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.PV.05.t4.prompt, hints: [h.pv.hundreds-first, h.pv.zero-holds] }
    distractors:
      - { rule: MC.zero-placeholder }
      - { rule: MC.place-swap }

  # The parts are given smallest first: 5 + 300 + 40.
  - id: PV.05.t5
    skillId: PV.05
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.number
    params:
      {
        n: { int: [100, 999] },
        zeros: { choice: [any, internal], weights: [3, 1] },
        mode: expanded,
        unusualOrder: true,
      }
    difficulty: { base: -1.7 }
    narration: { prompt: tp.PV.05.t5.prompt, hints: [h.pv.find-hundreds-part, h.pv.zero-holds] }

  # ---------- PV.06 compare three-digit numbers (K02) ----------
  # Whole hundreds as flats: a picture of proportional pieces is countable only while the flats
  # are what is counted (rods and cubes of a number to 999 would be a few pixels wide).
  - id: PV.06.t1
    skillId: PV.06
    format: compare
    tier: pictorial
    representation: base-ten
    generator: compare.numbers
    params:
      a: { int: [100, 900], step: 100 }
      b: { int: [100, 900], step: 100 }
      extra: 0
      min: 100
      max: 900
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.PV.06.t1.prompt, hints: [h.pv.flat-is-hundred, h.pv.count-by-hundreds] }

  - id: PV.06.t2
    skillId: PV.06
    format: compare
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      a: { int: [100, 999] }
      b: { int: [100, 999] }
      extra: 0
      min: 0
      max: 1000
      ask: { choice: [more, fewer], weights: [1, 1] }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.PV.06.t2.prompt, hints: [h.compare.line, h.compare.hundreds] }

  # Constructed practice (V27): three numbers, each marked on a 0–1000 line.
  - id: PV.06.t3
    skillId: PV.06
    format: order
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      { a: { int: [100, 999] }, b: { int: [100, 999] }, extra: 1, min: 0, max: 1000, ask: fewer }
    difficulty: { base: -0.9, features: { closeness: 0.5 } }
    narration: { prompt: tp.PV.06.t3.prompt, hints: [h.compare.line, h.order.smallest] }

  - id: PV.06.t4
    skillId: PV.06
    format: compare
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      { a: { int: [100, 999] }, b: { int: [100, 999] }, extra: 0, min: 100, max: 999, ask: symbol }
    difficulty: { base: -1.6 }
    # Both sides can draw the same number (420 _ 420), so the mark hint covers =.
    narration: { prompt: tp.PV.06.t4.prompt, hints: [h.compare.hundreds, h.cmp.mark-fits] }

  # Two digits against three (89 and 102): the numbers around one hundred, where
  # MC.compare-first-digit shows.
  - id: PV.06.t5
    skillId: PV.06
    format: compare
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      a: { int: [60, 140] }
      b: { int: [60, 140] }
      extra: 0
      min: 60
      max: 140
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -0.9 }
    narration: { prompt: tp.PV.06.t5.prompt, hints: [h.compare.more-digits, h.compare.hundreds] }

  - id: PV.06.t6
    skillId: PV.06
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [100, 999] },
        b: { int: [100, 999] },
        extra: { int: [1, 2] },
        min: 100,
        max: 999,
        ask: fewer,
      }
    difficulty: { base: -1.1, features: { closeness: 0.5 } }
    narration: { prompt: tp.PV.06.t6.prompt, hints: [h.order.smallest, h.compare.hundreds] }

  # ---------- PV.07 add or subtract 10 or 100 in your head (K02) ----------
  - id: PV.07.t1
    skillId: PV.07
    format: base-ten-build
    tier: concrete
    representation: base-ten
    generator: pv.tenmore
    params: { n: { int: [110, 889] }, delta: { choice: [10, -10, 100, -100] } }
    difficulty: { base: -1.9 }
    narration: { prompt: tp.PV.07.t1.prompt, hints: [h.pv.rod-or-flat, h.pv.one-place-changes] }

  - id: PV.07.t2
    skillId: PV.07
    format: number-line-jump
    tier: pictorial
    representation: open-number-line
    generator: pv.tenmore
    params: { n: { int: [110, 889] }, delta: { choice: [10, -10, 100, -100] } }
    difficulty: { base: -2.3 }
    narration: { prompt: tp.PV.07.t2.prompt, hints: [h.pv.one-jump, h.pv.one-place-changes] }

  - id: PV.07.t3
    skillId: PV.07
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.tenmore
    params: { n: { int: [110, 889] }, delta: { choice: [10, -10, 100, -100] } }
    difficulty: { base: -1.4 }
    narration:
      { prompt: tp.PV.07.t3.prompt, hints: [h.pv.one-place-changes, h.pv.tens-or-hundreds] }

  # ---------- PV.08 round to the nearest ten ----------
  # pv.round first: MC.round-down-always examples run on PV.08's first template. A number in the
  # middle rounds up (45 → 50); the line (closer) never draws the middle.
  - id: PV.08.t1
    skillId: PV.08
    format: number-pad
    tier: pictorial
    representation: number-line
    generator: pv.round
    params: { n: { int: [11, 99] }, place: 10 }
    difficulty: { base: -0.9 }
    narration: { prompt: tp.PV.08.t1.prompt, hints: [h.round.ones-digit, h.round.middle-up] }

  - id: PV.08.t2
    skillId: PV.08
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      min: 0
      max: 100
      target: { int: [1, 99] }
      ticksEvery: 5
      labelsEvery: 10
      mode: closer
      benchmarks: 10
    difficulty: { base: -0.8 }
    narration: { prompt: tp.PV.08.t2.prompt, hints: [h.closer.how-far, h.closer.middle] }

  - id: PV.08.t3
    skillId: PV.08
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: pv.round
    params: { n: { int: [11, 99] }, place: 10 }
    difficulty: { base: -0.6 }
    narration: { prompt: tp.PV.08.t1.prompt, hints: [h.round.which-tens, h.round.ones-digit] }

  - id: PV.08.t4
    skillId: PV.08
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.round
    params: { n: { int: [101, 999] }, place: 10 }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.PV.08.t1.prompt, hints: [h.round.which-tens, h.round.ones-digit] }

  # ---------- PV.09 ten ones make one ten (gateway) ----------
  - id: PV.09.t1
    skillId: PV.09
    format: make-set
    tier: concrete
    representation: objects
    generator: pv.regroup
    params: { n: { int: [11, 39] }, from: ones }
    difficulty: { base: -3.2 }
    narration: { prompt: tp.PV.09.t1.prompt, hints: [h.pv.bundle-ten, h.pv.rest-ones] }

  - id: PV.09.t2
    skillId: PV.09
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.regroup
    params: { n: { int: [11, 39] }, from: ones, to: canonical }
    # No rods in the tray (tens limit 0) adds limits.tight (0.5): only fusing makes the tens.
    difficulty: { base: -2.9 }
    narration: { prompt: tp.PV.09.t2.prompt, hints: [h.pv.bundle-ten, h.pv.rest-ones] }

  # Unbundle: one ten becomes ten ones.
  - id: PV.09.t3
    skillId: PV.09
    format: base-ten-trade
    tier: pictorial
    representation: base-ten
    generator: pv.regroup
    params: { n: { int: [11, 49] }, from: canonical, to: regrouped }
    difficulty: { base: -0.6 }
    narration: { prompt: tp.PV.09.t3.prompt, hints: [h.pv.split-rod, h.pv.same-number] }

  - id: PV.09.t4
    skillId: PV.09
    format: number-pad
    tier: pictorial
    representation: ten-frame
    generator: pv.regroup
    params: { n: { int: [11, 19] }, from: canonical }
    difficulty: { base: -0.3 }
    narration: { prompt: tp.PV.09.t4.prompt, hints: [h.subitize.full-ten, h.pv.ten-and-more] }

  - id: PV.09.t5
    skillId: PV.09
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.regroup
    params: { n: { int: [21, 59] }, from: regrouped }
    difficulty: { base: -0.9 }
    narration: { prompt: tp.PV.09.t5.prompt, hints: [h.pv.ten-of-the-ones, h.pv.count-tens-ones] }

  # ---------- PV.10 decade numbers ----------
  - id: PV.10.t1
    skillId: PV.10
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.number
    params: { n: { int: [20, 90], step: 10 }, mode: build }
    difficulty: { base: -0.7 }
    narration: { prompt: tp.PV.10.t1.prompt, hints: [h.pv.bundles-by-ten, h.pv.no-ones] }

  - id: PV.10.t2
    skillId: PV.10
    format: number-pad
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params: { n: { int: [20, 90], step: 10 }, mode: read }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.PV.10.t2.prompt, hints: [h.pv.bundles-by-ten, h.pv.no-ones] }

  - id: PV.10.t3
    skillId: PV.10
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.number
    params: { n: { int: [20, 90], step: 10 }, mode: write }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.PV.10.t3.prompt, hints: [h.pv.bundles-by-ten, h.pv.no-ones] }

  # ---------- PV.11 teen numbers are one ten and some ones ----------
  - id: PV.11.t1
    skillId: PV.11
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: exact }
    difficulty: { base: -1.5 }
    narration: { prompt: tp.PV.11.t1.prompt, hints: [h.pv.bundle-first, h.pv.count-ones] }

  - id: PV.11.t2
    skillId: PV.11
    format: base-ten-build
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: read }
    difficulty: { base: -0.6 }
    narration: { prompt: tp.PV.11.t2.prompt, hints: [h.pv.rod-is-ten, h.pv.teen-order] }

  - id: PV.11.t3
    skillId: PV.11
    format: number-pad
    tier: pictorial
    representation: double-ten-frame
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: read }
    difficulty: { base: -1.1 }
    narration: { prompt: tp.PV.11.t3.prompt, hints: [h.subitize.full-ten, h.pv.ten-and-more] }


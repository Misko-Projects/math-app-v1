# K01 (#11): templates for the K–1 DAT rows on data.sort (DAT.01, DAT.10) and data.chart (DAT.02,
# DAT.09), 03 §5.6. Graphs use scale 1 and at most three categories at grade 1.
strand: DAT
templates:
  # ---------- DAT.01: sort by one attribute ----------
  - id: DAT.01.t1
    skillId: DAT.01
    format: shape-sort
    tier: concrete
    representation: objects
    generator: data.sort
    params:
      cardSet: objects
      attribute: kind
      bins: { choice: [2, 3], weights: [2, 1] }
      a: { int: [1, 3] }
      b: { int: [1, 3] }
      c: { int: [1, 3] }
    difficulty: { base: -0.1 }
    narration:
      prompt: tp.DAT.01.t1.prompt
      hints: [h.data.same-kind, h.data.one-group]

  - id: DAT.01.t2
    skillId: DAT.01
    format: shape-sort
    tier: pictorial
    representation: shapes
    generator: data.sort
    params:
      cardSet: shapes
      attribute: { choice: [color, shape, size] }
      bins: { choice: [2, 3], weights: [2, 1] }
      a: { int: [1, 3] }
      b: { int: [1, 3] }
      c: { int: [1, 3] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.DAT.01.t2.prompt
      hints: [h.data.what-same, h.data.one-group]

  - id: DAT.01.t3
    skillId: DAT.01
    format: number-pad
    tier: pictorial
    representation: objects
    generator: data.sort
    params:
      attribute: kind
      bins: 2
      a: { int: [1, 8] }
      b: { int: [1, 5] }
    difficulty: { base: -0.24 }
    narration:
      prompt: tp.DAT.01.t3.prompt
      hints: [h.data.find-kind, h.data.count-once]

  # ---------- DAT.02: read picture and bar graphs ----------
  - id: DAT.02.t1
    skillId: DAT.02
    format: bar-graph-read
    tier: pictorial
    representation: picture-graph
    generator: data.chart
    params:
      kind: picture
      question: how-many
      categories: { choice: [2, 3] }
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      c: { int: [1, 10] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.DAT.02.t1.prompt
      hints: [h.data.find-row, h.data.count-once]

  - id: DAT.02.t2
    skillId: DAT.02
    format: bar-graph-read
    tier: pictorial
    representation: bar-graph
    generator: data.chart
    params:
      kind: bar
      question: difference
      categories: { choice: [2, 3] }
      a: { int: [2, 10] }
      b: { int: [1, 9] }
      c: { int: [1, 10] }
    difficulty: { base: -0.6, features: { count.over5: 0.8 } }
    narration:
      prompt: tp.DAT.02.t2.prompt
      hints: [h.data.bar-top, h.data.count-up]

  - id: DAT.02.t3
    skillId: DAT.02
    format: bar-graph-read
    tier: pictorial
    representation: bar-graph
    generator: data.chart
    params:
      kind: bar
      question: { choice: [most, least] }
      categories: { choice: [2, 3], weights: [1, 2] }
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      c: { int: [1, 10] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.DAT.02.t3.prompt
      hints: [h.data.bar-tops, h.data.compare-groups]

  - id: DAT.02.t4
    skillId: DAT.02
    format: compare
    tier: pictorial
    representation: bar-graph
    generator: data.chart
    params:
      kind: bar
      question: { choice: [more, fewer] }
      categories: 2
      a: { int: [1, 10] }
      b: { int: [1, 10] }
    # The compare format model (#89) weights "which has fewer" at 0.3: half the items ask it, so
    # the base sits 0.3 lower and the median stays at 0 (rule 8).
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.DAT.02.t4.prompt
      hints: [h.data.bar-tops]

  - id: DAT.02.t5
    skillId: DAT.02
    format: number-pad
    tier: pictorial
    representation: picture-graph
    generator: data.chart
    params:
      kind: picture
      question: total
      categories: { choice: [2, 3] }
      a: { int: [1, 8] }
      b: { int: [1, 8] }
      c: { int: [1, 6] }
    difficulty: { base: -0.74, features: { count.over5: 0.2 } }
    narration:
      prompt: tp.DAT.02.t5.prompt
      hints: [h.data.count-all, h.data.count-on-groups]


  - id: DAT.09.t4
    skillId: DAT.09
    format: bar-graph-build
    tier: pictorial
    representation: table
    generator: data.chart
    params:
      kind: tally
      data: table
      question: how-many
      mode: tally
      categories: { choice: [2, 3] }
      a: { int: [1, 9] }
      b: { int: [1, 9] }
      c: { int: [1, 9] }
    difficulty: { base: -0.38 }
    narration:
      prompt: tp.DAT.09.t4.prompt
      hints: [h.data.table-read, h.data.tally-five]

  # ---------- DAT.10: count each group and order the groups ----------
  # Every constructed template counts a group (t1) or orders the groups by count (t3). There is no
  # sort-only template: sorting is DAT.01, and a sort.byRule answer would be DAT.10 evidence
  # without any counting or ordering (PR #84 review round 2).
  - id: DAT.10.t1
    skillId: DAT.10
    format: bar-graph-read
    tier: pictorial
    representation: picture-graph
    generator: data.sort
    params:
      attribute: kind
      ask: how-many
      bins: { choice: [2, 3] }
      a: { int: [1, 9] }
      b: { int: [1, 9] }
      c: { int: [1, 9] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.DAT.10.t1.prompt
      hints: [h.data.find-row, h.data.count-once]

  - id: DAT.10.t2
    skillId: DAT.10
    format: bar-graph-read
    tier: pictorial
    representation: picture-graph
    generator: data.sort
    params:
      attribute: kind
      ask: { choice: [most, least] }
      bins: { choice: [2, 3], weights: [1, 2] }
      a: { int: [1, 8] }
      b: { int: [1, 8] }
      c: { int: [1, 8] }
    difficulty: { base: -0.2 }
    narration:
      prompt: tp.DAT.10.t2.prompt
      hints: [h.data.compare-groups, h.data.row-lengths]

  - id: DAT.10.t3
    skillId: DAT.10
    format: order
    tier: pictorial
    representation: objects
    generator: data.sort
    params:
      attribute: kind
      bins: { choice: [2, 3], weights: [1, 3] }
      a: { int: [1, 8] }
      b: { int: [1, 8] }
      c: { int: [1, 8] }
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.DAT.10.t3.prompt
      hints: [h.data.count-each-group, h.data.fewest-first]

  # ---------- K02 slice 4b (#17): DAT.04 build picture and bar graphs (3 categories: the graph
  # widgets draw at most 3 rows or columns; the catalog row says up to 4) ----------
  - id: DAT.04.t1
    skillId: DAT.04
    format: bar-graph-build
    tier: concrete
    representation: tally
    generator: data.chart
    params:
      kind: bar
      data: tally
      mode: bars
      categories: 3
      a: { int: [1, 8] }
      b: { int: [1, 8] }
      c: { int: [1, 8] }
    difficulty: { base: -0.5 }
    expectedLatencyMs: 30000
    narration:
      prompt: tp.DAT.04.t1.prompt
      hints: [h.data.tally-five, h.data.bar-reach]


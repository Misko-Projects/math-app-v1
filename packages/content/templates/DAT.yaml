  # K02 slice 4c-1 (#17): DAT.03 line plots (data.lineplot). Stacks hold at most 5 Xs, so an X is
  # at least 22 px at 960 × 600 (rules.test.ts checks the cap). Plank lengths in whole inches.
  - id: DAT.03.t1
    skillId: DAT.03
    format: bar-graph-read
    tier: pictorial
    representation: line-plot
    generator: data.lineplot
    params:
      question: how-many
      min: { int: [2, 15] }
      positions: 5
      precision: 1
      x1: { int: [1, 5] }
      x2: { int: [0, 5] }
      x3: { int: [0, 5] }
      x4: { int: [0, 5] }
      x5: { int: [1, 5] }
      at: { int: [1, 5] }
    difficulty: { base: -1.95 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.DAT.03.t1.prompt
      hints: [h.lineplot.find-length, h.lineplot.xs-above, h.lineplot.number-is-length]

  - id: DAT.03.t2
    skillId: DAT.03
    format: bar-graph-build
    tier: pictorial
    representation: line-plot
    generator: data.lineplot
    params:
      question: build
      min: { int: [2, 15] }
      positions: 4
      precision: 1
      x1: { int: [1, 3] }
      x2: { int: [0, 4] }
      x3: { int: [0, 4] }
      x4: { int: [1, 3] }
    difficulty: { base: -1.1 }
    expectedLatencyMs: 40000
    narration:
      prompt: tp.DAT.03.t2.prompt
      hints: [h.lineplot.find-length, h.lineplot.one-each, h.lineplot.check-count]

  - id: DAT.03.t3
    skillId: DAT.03
    format: bar-graph-read
    tier: pictorial
    representation: line-plot
    generator: data.lineplot
    params:
      question: difference
      min: { int: [2, 15] }
      positions: 5
      precision: 1
      x1: { int: [1, 5] }
      x2: { int: [0, 5] }
      x3: { int: [0, 5] }
      x4: { int: [0, 5] }
      x5: { int: [1, 5] }
      at: { int: [1, 5] }
      at2: { int: [1, 5] }
    difficulty: { base: -2.35 }
    expectedLatencyMs: 20000
    narration:
      prompt: tp.DAT.03.t3.prompt
      hints: [h.lineplot.two-stacks, h.lineplot.number-is-length, h.data.take-smaller]

# K01 (#11): the grade-1 FRA rows on frac.partition, frac.compare and div.share (03 §5.6).
# Pictures carry no fraction numerals: grade 1 names halves and fourths in words only (1.G.A.3).
strand: FRA
templates:
  # ---------- FRA.01: halves and fourths ----------
  - id: FRA.01.t1
    skillId: FRA.01
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect, square] }
      den: { choice: [2, 4] }
      num: 1
    difficulty: { base: -0.3 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.FRA.01.t1.prompt
      hints: [h.frac.same-size, h.frac.cut-middle, h.frac.fill-one]

  - id: FRA.01.t2
    skillId: FRA.01
    format: fraction-cut
    tier: concrete
    representation: fraction-strip
    generator: frac.partition
    params:
      mode: cut
      shape: bar
      den: { choice: [2, 4], weights: [3, 2] }
      num: 1
    difficulty: { base: 0.0 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.FRA.01.t2.prompt
      hints: [h.frac.same-size, h.frac.cut-middle, h.frac.fill-one]

  # Halves, fourths and a whole cut into parts that are not the same size; each picture is the
  # answer of some item (03 §5.5 fraction-pick, engine README). The unequal picture's part count
  # is its own param, so the three pictures are the same whatever the key (PR #84 review).
  - id: FRA.01.t3
    skillId: FRA.01
    format: fraction-pick
    tier: pictorial
    representation: words
    generator: frac.partition
    params:
      mode: pick
      shape: { choice: [circle, rect] }
      den: { choice: [2, 4] }
      ask: { choice: [name, unequal], weights: [2, 1] }
      unequalParts: { choice: [2, 4] }
    difficulty: { base: -0.6 }
    narration:
      prompt: tp.FRA.01.t3.prompt
      hints: [h.frac.look-each, h.frac.same-size]

  - id: FRA.01.t4
    skillId: FRA.01
    format: fraction-line
    tier: pictorial
    representation: fraction-strip
    generator: frac.partition
    params:
      mode: partition
      shape: bar
      den: { choice: [2, 4], weights: [3, 2] }
      num: 0
    difficulty: { base: -0.4 } # fraction-line's mode.partition feature (03 §6.3) adds 0.4
    narration:
      prompt: tp.FRA.01.t4.prompt
      hints: [h.frac.mark-middle, h.frac.same-size]

  # ---------- FRA.02: halves, thirds and fourths (K02 slice 4a, #17) ----------
  # Thirds have no middle cut, so no FRA.02 line says "middle".
  - id: FRA.02.t1
    skillId: FRA.02
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect, square] }
      den: { choice: [2, 3, 4], weights: [1, 2, 2] }
      num: 1
    difficulty: { base: -0.6 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.FRA.01.t1.prompt
      hints: [h.frac.same-size, h.frac.count-parts, h.frac.fill-one]

  # Four fourths make a whole: cut into fourths and fill every part.
  - id: FRA.02.t2
    skillId: FRA.02
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect, square] }
      den: 4
      num: 4
    difficulty: { base: -1.0 }
    expectedLatencyMs: 18000
    narration:
      prompt: tp.FRA.02.t2.prompt
      hints: [h.frac.same-size, h.frac.whole-fourths]

  - id: FRA.02.t3
    skillId: FRA.02
    format: fraction-pick
    tier: pictorial
    representation: words
    generator: frac.partition
    params:
      mode: pick
      thirds: true
      shape: { choice: [circle, rect] }
      den: { choice: [2, 3, 4], weights: [1, 2, 2] }
      ask: { choice: [name, unequal], weights: [3, 1] }
      unequalParts: { choice: [2, 3, 4] }
    difficulty: { base: -0.8 }
    narration:
      prompt: tp.FRA.01.t3.prompt
      hints: [h.frac.look-each, h.frac.same-size]
    distractors:
      - { rule: MC.fraction-unequal-parts }

  - id: FRA.02.t4
    skillId: FRA.02
    format: fraction-line
    tier: pictorial
    representation: fraction-strip
    generator: frac.partition
    params:
      mode: partition
      shape: bar
      den: { choice: [2, 3, 4], weights: [1, 2, 2] }
      num: 0
    difficulty: { base: -0.6 }
    narration:
      prompt: tp.FRA.01.t4.prompt
      hints: [h.frac.same-size, h.frac.count-parts]

  # ---------- FRA.07: equal parts or not ----------
  - id: FRA.07.t1
    skillId: FRA.07
    format: equal-share
    tier: concrete
    representation: objects
    generator: div.share
    params:
      ask: fair-or-not
      items: { int: [4, 12] }
      recipients: { choice: [2, 3], weights: [2, 1] }
      fair: { bool: 0.5 }
      shift: { int: [1, 2] }
    difficulty: { base: -0.05 }
    narration:
      prompt: tp.FRA.07.t1.prompt
      hints: [h.share.look-each, h.share.same-for-all]

  - id: FRA.07.t2
    skillId: FRA.07
    format: equal-share
    tier: concrete
    representation: objects
    generator: div.share
    params:
      ask: fix
      items: { int: [4, 12] }
      recipients: 2
      shift: { int: [1, 3] }
    difficulty: { base: -0.25 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.FRA.07.t2.prompt
      hints: [h.share.move-one, h.share.same-for-all]

  - id: FRA.07.t3
    skillId: FRA.07
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect, square] }
      den: { choice: [2, 4] }
      num: 0
    difficulty: { base: -0.3 }
    expectedLatencyMs: 15000
    narration:
      prompt: tp.FRA.07.t3.prompt
      hints: [h.frac.same-size, h.frac.cut-middle]

  - id: FRA.07.t4
    skillId: FRA.07
    format: fraction-pick
    tier: pictorial
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: fair-or-not
      shape: { choice: [circle, rect] }
      den: { int: [2, 4] }
      num: 0
      equalParts: { bool: 0.5 }
    difficulty: { base: -0.35 }
    narration:
      prompt: tp.FRA.07.t4.prompt
      hints: [h.frac.same-size, h.frac.look-parts]

  - id: FRA.07.t5
    skillId: FRA.07
    format: number-pad
    tier: pictorial
    representation: objects
    generator: div.share
    params:
      ask: moves
      items: { int: [4, 12] }
      recipients: 2
      shift: { int: [1, 3] }
    difficulty: { base: -0.45 }
    narration:
      prompt: tp.FRA.07.t5.prompt
      hints: [h.share.move-one, h.share.same-for-all]

  # ---------- FRA.08: more equal parts, smaller parts ----------
  # The wholes are the same size, so one piece of each can be compared by looking. The compares
  # (t1, t2) are choices; the constructed practice (04 §7a, V27) is the two orders, pictures (t3)
  # and part counts (t4). There is no fraction-cut: cutting one shape compares nothing (PR #84
  # review round 2).
  - id: FRA.08.t1
    skillId: FRA.08
    format: compare
    tier: concrete
    representation: fraction-strip
    generator: frac.compare
    params:
      shape: bar
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.FRA.08.t1.prompt
      hints: [h.frac.look-one-piece, h.frac.more-parts]

  - id: FRA.08.t2
    skillId: FRA.08
    format: compare
    tier: pictorial
    representation: fraction-shape
    generator: frac.compare
    params:
      shape: circle
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.FRA.08.t2.prompt
      hints: [h.frac.look-one-piece, h.frac.more-parts]

  # Two or three strips, one piece of each filled; the closest pair sets the difficulty.
  - id: FRA.08.t3
    skillId: FRA.08
    format: order
    tier: pictorial
    representation: fraction-strip
    generator: frac.compare
    params:
      shape: bar
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
      den3: { choice: [0, 2, 3, 4, 6, 8] }
    difficulty: { base: -2.0, features: { ratio: 1.6 } }
    narration:
      prompt: tp.FRA.08.t3.prompt
      hints: [h.frac.more-parts, h.frac.order-biggest]

  # The same order with no pictures: each card is the number of equal parts a strip is cut into,
  # so the child orders by "more parts, smaller pieces" alone (MC.fraction-bigger-denominator
  # orders by the bigger number).
  - id: FRA.08.t4
    skillId: FRA.08
    format: order
    tier: abstract
    representation: symbols
    generator: frac.compare
    params:
      shape: bar
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
      den3: { choice: [0, 2, 3, 4, 6, 8] }
    difficulty: { base: -2.0, features: { ratio: 1.6 } }
    narration:
      prompt: tp.FRA.08.t4.prompt
      hints: [h.frac.more-parts, h.frac.order-biggest]

  # K02 slice 4c-2 (#17): equal shares that look different. t1 is the free grid cut (the grids
  # worked solutions cut squares and bars of one size); t2 and t3 draw a grid-parts picture: equal
  # parts of different shapes (count the squares in each), or equal or unequal parts to judge.
  - id: FRA.16.t1
    skillId: FRA.16
    format: fraction-cut
    tier: concrete
    representation: area-grid
    generator: frac.partition
    params:
      mode: cut
      shape: grid
      acceptNonCongruent: true
      den: { choice: [3, 4] }
      cols: { choice: [4, 6, 8] }
      rows: { choice: [2, 4] }
      num: 0
    difficulty: { base: -1.4, features: { parts.hard: 0.6 } }
    expectedLatencyMs: 20000
    narration:
      prompt: tp.FRA.16.t1.prompt
      hints: [h.shares.same-squares, h.shares.count-all]

  - id: FRA.16.t2
    skillId: FRA.16
    format: number-pad
    tier: pictorial
    representation: area-grid
    generator: frac.shares
    params:
      cut: { int: [0, 7] }
      mirror: { choice: [true, false] }
    difficulty: { base: 0.0 }
    narration:
      prompt: tp.FRA.16.t2.prompt
      hints: [h.shares.count-one, h.shares.check-another]

  - id: FRA.16.t3
    skillId: FRA.16
    format: fraction-pick
    tier: pictorial
    representation: fraction-shape
    generator: frac.shares
    params:
      cut: { int: [0, 7] }
      mirror: { choice: [true, false] }
      equalParts: { choice: [true, false] }
    difficulty: { base: -0.1, features: { lookDifferent: 0.2 } }
    narration:
      prompt: tp.FRA.16.t3.prompt
      hints: [h.shares.count-each, h.shares.shape-ok]

  # ---------- K02 slice 5a (#17): grade 3 fractions as parts of a whole ----------
  # FRA.03 (gateway): cut a shape or a strip into b equal parts and fill one; name one shaded part
  # on two stacked pads; name one part of a pie from a story (abstract: no picture). b is 2, 3, 4,
  # 6 or 8 (the grade 3 limit).
  - id: FRA.03.t1
    skillId: FRA.03
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect] }
      den: { choice: [2, 3, 4, 6, 8], weights: [1, 2, 2, 2, 1] }
      num: 1
    difficulty: { base: -0.7 }
    expectedLatencyMs: 18000
    narration:
      prompt: tp.FRA.03.t1.prompt
      hints: [h.frac.same-size, h.frac.count-parts, h.frac.fill-one]

  - id: FRA.03.t2
    skillId: FRA.03
    format: fraction-cut
    tier: concrete
    representation: fraction-strip
    generator: frac.partition
    params:
      mode: cut
      shape: bar
      den: { choice: [2, 3, 4, 6, 8], weights: [1, 2, 2, 2, 1] }
      num: 1
    difficulty: { base: -0.6 }
    expectedLatencyMs: 18000
    narration:
      prompt: tp.FRA.03.t2.prompt
      hints: [h.frac.same-size, h.frac.count-parts, h.frac.fill-one]

  - id: FRA.03.t3
    skillId: FRA.03
    format: fraction-pick
    tier: pictorial
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: name
      shape: { choice: [circle, rect] }
      den: { choice: [2, 3, 4, 6, 8], weights: [1, 2, 2, 2, 1] }
      num: 1
    difficulty: { base: -0.5 }
    narration:
      prompt: tp.FRA.03.t3.prompt
      hints: [h.frac.name-bottom, h.frac.name-top]

  - id: FRA.03.t4
    skillId: FRA.03
    format: fraction-pick
    tier: abstract
    representation: symbols
    generator: frac.partition
    params:
      mode: name
      words: true
      shape: circle
      den: { choice: [2, 3, 4, 6, 8], weights: [1, 2, 2, 2, 1] }
      num: 1
    difficulty: { base: -0.7 }
    narration:
      prompt: tp.FRA.03.t4.prompt
      hints: [h.frac.story-bottom, h.frac.story-top]

  # FRA.09: a/b is a copies of 1/b. Fill more than one part; name a shaded strip or shape; name a
  # story's eaten parts. a = b (the whole) is drawn only where a picture shows it (t1–t3).
  - id: FRA.09.t1
    skillId: FRA.09
    format: fraction-cut
    tier: concrete
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: cut
      shape: { choice: [circle, rect] }
      den: { choice: [3, 4, 6, 8], weights: [2, 2, 2, 1] }
      num: { int: [2, 8] }
    constraints: ["num <= den"]
    difficulty: { base: -1.8 }
    expectedLatencyMs: 22000
    narration:
      prompt: tp.FRA.09.t1.prompt
      hints: [h.frac.same-size, h.frac.count-parts, h.frac.count-filled]

  - id: FRA.09.t2
    skillId: FRA.09
    format: fraction-pick
    tier: pictorial
    representation: fraction-strip
    generator: frac.partition
    params:
      mode: name
      shape: bar
      den: { choice: [3, 4, 6, 8], weights: [2, 2, 2, 1] }
      num: { int: [2, 8] }
    constraints: ["num <= den"]
    difficulty: { base: -1.1 }
    narration:
      prompt: tp.FRA.09.t2.prompt
      hints: [h.frac.name-bottom, h.frac.name-top, h.frac.count-units]

  - id: FRA.09.t3
    skillId: FRA.09
    format: fraction-pick
    tier: pictorial
    representation: fraction-shape
    generator: frac.partition
    params:
      mode: name
      shape: { choice: [circle, rect] }
      den: { choice: [3, 4, 6, 8], weights: [2, 2, 2, 1] }
      num: { int: [2, 8] }
    constraints: ["num <= den"]
    difficulty: { base: -1.1 }
    narration:
      prompt: tp.FRA.03.t3.prompt
      hints: [h.frac.name-bottom, h.frac.name-top, h.frac.count-units]

  - id: FRA.09.t4
    skillId: FRA.09
    format: fraction-pick
    tier: abstract
    representation: symbols
    generator: frac.partition
    params:
      mode: name
      words: true
      shape: circle
      den: { choice: [3, 4, 6, 8], weights: [2, 2, 2, 1] }
      num: { int: [2, 7] }
    constraints: ["num < den"]
    difficulty: { base: -1.4 }
    narration:
      prompt: tp.FRA.09.t4.prompt
      hints: [h.frac.story-bottom, h.frac.story-top]

  # FRA.06: same denominator. Two strips of one whole (which shows more?), two strips with their
  # fractions in order, biggest first, a/b ? c/b with a sign, and three fractions in order. The
  # strip order has two cards: three strip cards beside Check leave a strip in sixths 20 px a part
  # at 960 × 600, two leave eighths about 30 px (K02 slice 5a measurement).

  - id: FRA.06.t1
    skillId: FRA.06
    format: compare
    tier: pictorial
    representation: fraction-strip
    generator: frac.compare
    params:
      kind: sameDen
      symbols: true
      shape: bar
      den: { choice: [3, 4, 6, 8] }
      num: { int: [1, 7] }
      num2: { int: [1, 7] }
    constraints: ["num < den", "num2 < den"]
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.FRA.06.t1.prompt
      hints: [h.frac.same-parts, h.frac.count-filled]

  - id: FRA.06.t2
    skillId: FRA.06
    format: order
    tier: pictorial
    representation: fraction-strip
    generator: frac.compare
    params:
      kind: sameDen
      symbols: true
      shape: bar
      den: { choice: [3, 4, 6, 8] }
      num: { int: [1, 7] }
      num2: { int: [1, 7] }
    constraints: ["num < den", "num2 < den", "num != num2"]
    difficulty: { base: -1.2, features: { ratio: 1.5 } }
    narration:
      prompt: tp.FRA.06.t2.prompt
      hints: [h.frac.same-parts, h.frac.most-filled]

  - id: FRA.06.t3
    skillId: FRA.06
    format: compare
    tier: abstract
    representation: symbols
    generator: frac.compare
    params:
      kind: sameDen
      symbols: true
      shape: bar
      den: { choice: [3, 4, 6, 8] }
      num: { int: [1, 7] }
      num2: { int: [1, 7] }
    constraints: ["num < den", "num2 < den"]
    difficulty: { base: -0.76 }
    narration:
      prompt: tp.FRA.06.t3.prompt
      hints: [h.frac.same-bottom, h.frac.sign-open]

  - id: FRA.06.t4
    skillId: FRA.06
    format: order
    tier: abstract
    representation: symbols
    generator: frac.compare
    params:
      kind: sameDen
      symbols: true
      shape: bar
      den: { choice: [4, 6, 8] }
      num: { int: [1, 7] }
      num2: { int: [1, 7] }
      num3: { int: [1, 7] }
    constraints:
      ["num < den", "num2 < den", "num3 < den", "num != num2", "num != num3", "num2 != num3"]
    difficulty: { base: -1.37, features: { ratio: 1.5 } }
    narration:
      prompt: tp.FRA.06.t4.prompt
      hints: [h.frac.same-bottom, h.frac.biggest-top]

  # FRA.13: same numerator. The wholes are the same size, so fewer parts means bigger parts.
  - id: FRA.13.t1
    skillId: FRA.13
    format: compare
    tier: pictorial
    representation: fraction-strip
    generator: frac.compare
    params:
      kind: sameNum
      symbols: true
      shape: bar
      num: { choice: [1, 2, 3] }
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
    constraints: ["num < den", "num < den2"]
    difficulty: { base: -0.9 }
    narration:
      prompt: tp.FRA.13.t1.prompt
      hints: [h.frac.same-filled, h.frac.more-parts]

  - id: FRA.13.t2
    skillId: FRA.13
    format: order
    tier: pictorial
    representation: fraction-strip
    generator: frac.compare
    params:
      kind: sameNum
      symbols: true
      shape: bar
      num: { choice: [1, 2, 3] }
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
    constraints: ["num < den", "num < den2", "den != den2"]
    difficulty: { base: -1.97, features: { ratio: 1.6 } }
    narration:
      prompt: tp.FRA.06.t2.prompt
      hints: [h.frac.same-filled, h.frac.order-biggest]

  - id: FRA.13.t3
    skillId: FRA.13
    format: compare
    tier: abstract
    representation: symbols
    generator: frac.compare
    params:
      kind: sameNum
      symbols: true
      shape: bar
      num: { choice: [1, 2, 3] }
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
    constraints: ["num < den", "num < den2"]
    difficulty: { base: -1.3 }
    narration:
      prompt: tp.FRA.06.t3.prompt
      hints: [h.frac.same-top, h.frac.sign-open]

  - id: FRA.13.t4
    skillId: FRA.13
    format: order
    tier: abstract
    representation: symbols
    generator: frac.compare
    params:
      kind: sameNum
      symbols: true
      shape: bar
      num: { choice: [1, 2, 3] }
      den: { choice: [2, 3, 4, 6, 8] }
      den2: { choice: [2, 3, 4, 6, 8] }
      den3: { choice: [2, 3, 4, 6, 8] }
    constraints:
      ["num < den", "num < den2", "num < den3", "den != den2", "den != den3", "den2 != den3"]
    difficulty: { base: -2.2, features: { ratio: 1.6 } }
    narration:
      prompt: tp.FRA.06.t4.prompt
      hints: [h.frac.same-top, h.frac.fewest-bottom]

  # ---------- K02 slice 5b (#17): fractions on the number line (frac.line) ----------
  # Bounds at 960 × 600: a line the child taps keeps ticks ≥ 64 px apart (0–1 in any of 2, 3, 4,
  # 6, 8 parts; 0–2 in halves, thirds or fourths; 0–3 in halves); only whole numbers are labelled.
  # FRA.04 (gateway): one jump of 1/b from 0 on a strip, a ruler and a line; a path story names it.
  - id: FRA.04.t1
    skillId: FRA.04
    format: fraction-line
    tier: pictorial
    representation: fraction-strip
    generator: frac.line
    params:
      mode: place
      skin: strip
      den: { choice: [2, 3, 4, 6, 8], weights: [1, 2, 2, 2, 2] }
      num: 1
      max: 1
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.FRA.04.t1.prompt
      hints: [h.frac.line.parts-whole, h.frac.line.one-part, h.frac.line.spaces]

  - id: FRA.04.t2
    skillId: FRA.04
    format: fraction-line
    tier: pictorial
    representation: ruler
    generator: frac.line
    params:
      mode: read
      skin: ruler

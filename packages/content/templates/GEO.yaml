              trapezoid-from-triangles,
              hexagon-from-rhombuses,
              hexagon-from-triangles,
              big-triangle-from-triangles,
              rectangle-from-squares,
              big-square-from-squares,
            ],
        }
    difficulty: { base: -0.7 }
    narration:
      prompt: tp.GEO.11.t3.prompt
      hints: [h.geo.pieces-inside]

  # Pictorial and constructed (04 §7a: t3 answers with a choice): t3's question, typed.
  - id: GEO.11.t4
    skillId: GEO.11
    format: number-pad
    tier: pictorial
    representation: shapes
    generator: geo.compose
    params:
      outline:
        {
          choice:
            [
              trapezoid-from-triangles,

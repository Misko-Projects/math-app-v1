  # K02 (#17) slice 3b: facts and strategies (mul.facts; mul.tens for MUL.11). No factor 0 is
  # pictured; strategy sentences ask each step, then the total.
  # MUL.06: × 1 groups (mul.groups), × 0 and × 1 in symbols, the turn-around with an array and in
  # symbols. The symbols item is the first mul.facts template (the × 0 misconception examples run
  # on it), so the array comes after it (an expected V10 warning, LATE_PICTORIAL).
  - id: MUL.06.t1
    skillId: MUL.06
    format: equal-groups
    tier: concrete
    representation: groups
    generator: mul.groups
    params: { groups: { int: [1, 6] }, perGroup: { int: [1, 10] }, unknown: total, mode: read }
    constraints: ["groups == 1 || perGroup == 1", "groups * perGroup > 1"]
    difficulty: { base: -0.15 }
    narration:
      prompt: tp.MUL.06.t1.prompt
      hints: [h.mul.zero-one, h.mul.count-all]


    representation: array
    generator: mul.groups
    params: { groups: { int: [2, 6] }, perGroup: { int: [2, 6] }, unknown: total, mode: read }
    difficulty: { base: -1.0 }
    narration:
      prompt: tp.MUL.04.t2.prompt
      hints: [h.mul.times-rows, h.mul.count-by-rows]

  - id: MUL.04.t3
    skillId: MUL.04

# K01 (#11): MUL.12 on div.share (03 §5.6). Deal one at a time until the pile is gone (t1), with
# the rest going to the seagull (t2); make one fair share in a basket (t3); a picture of the pile,
# then type how many each friend gets (t4).
strand: MUL
templates:
  - id: MUL.12.t1
    skillId: MUL.12
    format: equal-share
    tier: concrete
    representation: objects
    generator: div.share
    params:
      ask: each
      items: { int: [4, 16] }
      recipients: { choice: [2, 3], weights: [2, 1] }
    difficulty: { base: -0.25 }
    expectedLatencyMs: 20000
    narration:
      prompt: tp.MUL.12.t1.prompt
      hints: [h.share.one-each, h.share.same-for-all, h.share.count-one]

  - id: MUL.12.t2
    skillId: MUL.12
    format: equal-share
    tier: concrete
    representation: objects
    generator: div.share
    params:
      ask: each
      leftover: true
      items: { int: [5, 17] }
      recipients: { choice: [2, 3], weights: [2, 1] }
    difficulty: { base: -0.75 }
    expectedLatencyMs: 20000
    narration:
      prompt: tp.MUL.12.t2.prompt
      hints: [h.share.one-each, h.share.seagull, h.share.count-one]

  - id: MUL.12.t3
    skillId: MUL.12
    format: make-set
    tier: concrete
    representation: groups
    generator: div.share
    params:
      ask: each
      items: { int: [4, 12] }
      recipients: { choice: [2, 3], weights: [2, 1] }
    difficulty: { base: -0.85 }
    narration:
      prompt: tp.MUL.12.t3.prompt
      hints: [h.share.one-each, h.share.count-one]

  - id: MUL.12.t4
    skillId: MUL.12
    format: number-pad
    tier: pictorial
    representation: objects
    generator: div.share
    params:
      ask: each
      items: { int: [4, 16] }
      recipients: { choice: [2, 3], weights: [2, 1] }
    difficulty: { base: -0.25 }
    narration:
      prompt: tp.MUL.12.t4.prompt
      hints: [h.share.one-each, h.share.count-one]

# K01 (#11): MUL.12 on div.share (03 §5.6). Deal one at a time until the pile is gone (t1), with
# the rest going to the seagull (t2); a picture of the pile, then type how many each friend gets
# (t3). There is no one-basket make-set template: its count check never needs the dealing the skill
# teaches (PR #84 review), and t1 and t2 already assess the deal.
# K02 (#17) slice 3a adds MUL.01–05 and MUL.22 on parity.evenodd, mul.groups and div.share.
strand: MUL
templates:
  # ---------- K02 (#17) slice 3a ----------
  # MUL.01 even and odd on parity.evenodd: share between two (say even or odd; type how many are
  # left without a partner), the same on ten-frames, then find every even number card.
  - id: MUL.01.t1
    skillId: MUL.01
    format: equal-share
    tier: concrete
    representation: objects
    generator: parity.evenodd
    params: { n: { int: [2, 16] }, ask: even-odd }
    difficulty: { base: -0.6 }
    narration:
      prompt: tp.MUL.01.t1.prompt
      hints: [h.parity.pairs, h.parity.partner]

  - id: MUL.01.t2
    skillId: MUL.01
    format: equal-share
    tier: concrete
    representation: groups
    generator: parity.evenodd
    params: { n: { int: [3, 20] }, ask: leftover }
    difficulty: { base: -0.7 }
    narration:
      prompt: tp.MUL.01.t2.prompt
      hints: [h.parity.pairs, h.parity.left]

  - id: MUL.01.t3
    skillId: MUL.01
    format: number-pad
    tier: pictorial
    representation: ten-frame
    generator: parity.evenodd
    params: { n: { int: [2, 20] } }
    difficulty: { base: -0.4 }
    narration:
      prompt: tp.MUL.01.t3.prompt
      hints: [h.parity.two-by-two, h.parity.left]

  - id: MUL.01.t4
    skillId: MUL.01
    format: shape-sort
    tier: pictorial
    representation: symbols
    generator: parity.evenodd
    params: { n: { int: [8, 20] }, cards: { int: [4, 6] }, find: even }
    difficulty: { base: -0.5 }
    narration:
      prompt: tp.MUL.01.t4.prompt
      hints: [h.parity.ends-in, h.parity.partner]

  # MUL.02 equal groups on mul.groups: read the groups, build them, find where drawn jumps land

# CPS templates (K01). CPS.01–CPS.03 keep the ids, formats, tiers and representations they shipped
# with in C01 (03 §4.3); K01 tunes their params, difficulty and narration and adds templates with
# the next free number. Bases are set from template-stats so each template's median sits near 0.
# Size inside a small whole comes from whole.upTo5, a big missing part from missing.over4, and on
# frames and racks from the format's size feature (03 §5.5, §5.6).
strand: CPS
templates:
  # ---------- CPS.01: numbers to 5, two parts, every way ----------
  - id: CPS.01.t1
    skillId: CPS.01
    format: make-set
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [2, 5] }, unknown: split }
    difficulty: { base: -1.0 }
    narration: { prompt: p.bond.split, hints: [h.bond.use-counters, h.bond.split-any] }

  - id: CPS.01.t2
    skillId: CPS.01
    format: make-set
    tier: concrete
    representation: fingers
    generator: bond.parts
    params: { whole: { int: [2, 5] }, unknown: split }
    difficulty: { base: -0.75 }
    narration: { prompt: p.bond.split-fingers, hints: [h.bond.two-hands] }

  - id: CPS.01.t3
    skillId: CPS.01
    format: tenframe-fill
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [2, 5] }, part: { int: [0, 5] }, unknown: part }
    constraints: ["part <= whole"]
    difficulty: { base: -0.35 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.use-counters, h.bond.count-on] }

  - id: CPS.01.t4
    skillId: CPS.01
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [2, 5] }, part: { int: [0, 5] }, unknown: part }
    constraints: ["part <= whole"]
    difficulty: { base: -0.85 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.count-on, h.bond.fingers] }

  - id: CPS.01.t5
    skillId: CPS.01
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [2, 5] }, unknown: split }
    difficulty: { base: -0.45 }
    narration: { prompt: p.bond.split, hints: [h.bond.split-any] }

  # ---------- CPS.02: numbers to 10, two parts (gateway) ----------
  - id: CPS.02.t1
    skillId: CPS.02
    format: tenframe-fill
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [6, 10] }, unknown: split }
    # Every counter of a split is placed and checked, so size weighs more than the tenframe-fill
    # default (0.3 per 5).
    difficulty: { base: -1.15, features: { n.over5: 0.5 } }
    narration: { prompt: p.bond.split, hints: [h.bond.use-counters, h.bond.split-any] }

  - id: CPS.02.t2
    skillId: CPS.02
    format: rekenrek
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [6, 10] }, unknown: split }
    difficulty: { base: -0.7 }
    narration: { prompt: p.bond.split, hints: [h.bond.slide-beads] }

  - id: CPS.02.t3
    skillId: CPS.02
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [6, 10] }, part: { int: [1, 9] }, unknown: part }
    constraints: ["part < whole"]
    difficulty: { base: -1.45 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.count-on, h.bond.fingers] }

  - id: CPS.02.t4
    skillId: CPS.02
    format: number-pad
    tier: abstract
    generator: bond.parts
    params: { whole: { int: [6, 10] }, part: { int: [1, 9] }, unknown: part }
    constraints: ["part < whole"]
    difficulty: { base: -0.75 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.count-on, h.bond.fingers] }

  # ---------- CPS.03: partners of 10 ----------
  - id: CPS.03.t1
    skillId: CPS.03
    format: tenframe-fill
    tier: concrete
    generator: bond.parts
    params: { whole: 10, part: { int: [1, 9] }, unknown: part }
    difficulty: { base: -1.35 }
    narration: { prompt: p.bond.make-ten, hints: [h.bond.partners, h.count.show-frame] }

  - id: CPS.03.t2
    skillId: CPS.03
    format: rekenrek
    tier: concrete
    generator: bond.parts
    params: { whole: 10, part: { int: [1, 9] }, unknown: part }
    difficulty: { base: -1.35 }
    narration: { prompt: p.bond.make-ten, hints: [h.bond.slide-beads, h.bond.beads-ten] }

  - id: CPS.03.t3
    skillId: CPS.03
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: 10, part: { int: [0, 10] }, unknown: part }
    difficulty: { base: -1.7 }
    narration: { prompt: p.bond.make-ten, hints: [h.bond.partners, h.bond.fingers] }

  - id: CPS.03.t4
    skillId: CPS.03
    format: number-pad
    tier: abstract
    generator: bond.parts
    params: { whole: 10, part: { int: [0, 10] }, unknown: part }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.CPS.03.t4.prompt, hints: [h.bond.partners, h.bond.fingers] }

  # ---------- CPS.04: teen numbers are ten ones and some more (gateway) ----------
  # pv.number with n 11–19. Each template asks for the teen number itself (the typed total after
  # building, the built value, or the number read), so MC.teen-reversal can tell 14 from 41.
  - id: CPS.04.t1
    skillId: CPS.04
    format: tenframe-fill
    tier: concrete
    representation: double-ten-frame
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: write }
    difficulty: { base: -2.2 }
    narration: { prompt: tp.CPS.04.t1.prompt, hints: [h.pv.full-frame, h.pv.ten-and-more] }

  - id: CPS.04.t2
    skillId: CPS.04
    format: rekenrek
    tier: concrete
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: write }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CPS.04.t2.prompt, hints: [h.pv.ten-on-top, h.pv.ten-and-more] }

  - id: CPS.04.t3
    skillId: CPS.04
    format: base-ten-build
    tier: concrete
    representation: bundles
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: exact }
    difficulty: { base: -1.5 }
    narration: { prompt: tp.CPS.04.t3.prompt, hints: [h.pv.bundle-first, h.pv.count-ones] }

  - id: CPS.04.t4
    skillId: CPS.04
    format: number-pad
    tier: pictorial
    representation: double-ten-frame
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: read }
    difficulty: { base: -1.1 }
    narration: { prompt: tp.CPS.04.t4.prompt, hints: [h.subitize.full-ten, h.pv.ten-and-more] }

  - id: CPS.04.t5
    skillId: CPS.04
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: write }
    difficulty: { base: -1.1 }
    narration: { prompt: tp.CPS.04.t5.prompt, hints: [h.pv.ten-and-more, h.pv.teen-order] }

  # ---------- CPS.05: the missing part, whole up to 10 ----------
  - id: CPS.05.t1
    skillId: CPS.05
    format: tenframe-fill
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [4, 10] }, part: { int: [1, 9] }, unknown: part }
    constraints: ["part < whole"]
    difficulty: { base: -0.85 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.count-on, h.count.show-frame] }

  - id: CPS.05.t2
    skillId: CPS.05
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [4, 10] }, part: { int: [0, 10] }, unknown: part }
    constraints: ["part <= whole"]
    difficulty: { base: -1.3 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.count-on, h.bond.fingers] }

  - id: CPS.05.t3
    skillId: CPS.05
    format: number-pad
    tier: abstract
    generator: bond.parts
    params: { whole: { int: [4, 10] }, part: { int: [1, 9] }, unknown: part }
    constraints: ["part < whole"]
    difficulty: { base: -0.75 }
    narration: { prompt: tp.CPS.05.t3.prompt, hints: [h.bond.count-on, h.bond.fingers] }

  # ---------- CPS.06: all the ways to make a number up to 10 ----------
  # bond.parts `gap`: every way but one is shown found, in order; puzzle.grid all-ways: put every
  # way in order (pictures of two groups), or fill a row for each way.
  - id: CPS.06.t1
    skillId: CPS.06
    format: number-bond
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [4, 10] }, unknown: new-way, gap: { int: [1, 5] } }
    difficulty: { base: -1.5 }
    narration: { prompt: tp.CPS.06.t1.prompt, hints: [h.bond.ways-in-order, h.bond.split-any] }

  - id: CPS.06.t2
    skillId: CPS.06
    format: order
    tier: pictorial
    representation: objects
    generator: puzzle.grid
    params: { variant: all-ways, whole: { int: [4, 7] } }
    difficulty: { base: -0.3 }
    narration:
      prompt: tp.CPS.06.t2.prompt
      hints: [h.puzzle.ways-fewest, h.puzzle.ways-one-more]

  - id: CPS.06.t3
    skillId: CPS.06
    format: puzzle-grid
    tier: pictorial
    representation: number-bond
    generator: puzzle.grid
    params: { variant: all-ways, whole: { int: [4, 10] } }
    difficulty: { base: -0.75, features: { blanks: 0.1 } }
    narration:
      prompt: tp.CPS.06.t3.prompt
      hints: [h.puzzle.ways-start, h.puzzle.ways-turn]

  # ---------- CPS.07: a teen number as 10 plus ones ----------
  - id: CPS.07.t1
    skillId: CPS.07
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [11, 19] }, part: 10, unknown: { choice: [part, whole] } }
    difficulty: { base: -2.3 }
    narration: { prompt: tp.CPS.07.t1.prompt, hints: [h.pv.ten-and-more] }

  - id: CPS.07.t2
    skillId: CPS.07
    format: number-pad
    tier: pictorial
    representation: double-ten-frame
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: expanded }
    # The ones past five are read off the second frame, so they weigh more than the default.
    difficulty: { base: -1.1, features: { ones.over5: 0.5 } }
    narration: { prompt: tp.CPS.07.t2.prompt, hints: [h.subitize.full-ten, h.pv.ten-and-more] }

  - id: CPS.07.t3
    skillId: CPS.07
    format: expanded-form
    tier: pictorial
    representation: expanded
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: build }
    difficulty: { base: -0.8 }
    narration: { prompt: tp.CPS.07.t3.prompt, hints: [h.pv.ten-card, h.pv.teen-order] }

  - id: CPS.07.t4
    skillId: CPS.07
    format: number-pad
    tier: abstract
    representation: symbols
    generator: pv.number
    params: { n: { int: [11, 19] }, mode: expanded }
    difficulty: { base: -1.1 }
    narration: { prompt: tp.CPS.07.t4.prompt, hints: [h.pv.ten-and-more, h.pv.teen-order] }

  # ---------- CPS.08: numbers to 20, several ways (grade 1) ----------
  # A new way: the prompt names one way already found (ten and the rest), the child shows another.
  - id: CPS.08.t1
    skillId: CPS.08
    format: tenframe-fill
    tier: concrete
    representation: double-ten-frame
    generator: bond.parts
    params: { whole: { int: [11, 19] }, unknown: new-way, found: 1 }
    difficulty: { base: -1.45 }
    narration: { prompt: tp.CPS.08.t1.prompt, hints: [h.bond.new-way] }

  - id: CPS.08.t2
    skillId: CPS.08
    format: rekenrek
    tier: concrete
    generator: bond.parts
    params: { whole: { int: [11, 19] }, unknown: new-way, found: 1 }
    difficulty: { base: -1.55 }
    narration: { prompt: tp.CPS.08.t2.prompt, hints: [h.bond.new-way] }

  - id: CPS.08.t3
    skillId: CPS.08
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [11, 20] }, unknown: new-way, found: { int: [1, 2] } }
    difficulty: { base: -2.75 }
    narration: { prompt: p.bond.new-way, hints: [h.bond.new-way] }

  - id: CPS.08.t4
    skillId: CPS.08
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params: { whole: { int: [11, 18] }, part: { int: [5, 9] }, unknown: part }
    constraints: ["whole - part >= 2", "whole - part <= 9"]
    difficulty: { base: -2.55 }
    narration: { prompt: p.bond.missing-part, hints: [h.bond.through-ten, h.bond.count-on] }

  # ---------- CPS.11: split a number to finish a ten (grade 1) ----------
  # addend 6–9 needs part = 10 − addend; the whole (the other addend) keeps the rest.
  - id: CPS.11.t1
    skillId: CPS.11
    format: tenframe-fill
    tier: concrete
    generator: bond.parts
    params:
      addend: { int: [6, 9] }
      whole: { int: [2, 9] }
      part: { int: [1, 4] }
      unknown: part
    constraints: ["addend + part == 10", "whole > part"]
    difficulty: { base: -1.65 }
    narration: { prompt: tp.CPS.11.t1.prompt, hints: [h.bond.fill-ten, h.bond.count-left] }

  - id: CPS.11.t2
    skillId: CPS.11
    format: rekenrek
    tier: concrete
    generator: bond.parts
    params:
      addend: { int: [6, 9] }
      whole: { int: [2, 9] }
      part: { int: [1, 4] }
      unknown: part
    constraints: ["addend + part == 10", "whole > part"]
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CPS.11.t2.prompt, hints: [h.bond.beads-ten] }

  - id: CPS.11.t3
    skillId: CPS.11
    format: number-bond
    tier: pictorial
    generator: bond.parts
    params:
      addend: { int: [6, 9] }
      whole: { int: [2, 9] }
      part: { int: [1, 4] }
      unknown: part
    constraints: ["addend + part == 10", "whole > part"]
    difficulty: { base: -1.3 }
    narration: { prompt: tp.CPS.11.t3.prompt, hints: [h.bond.count-on] }

    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.09.t4.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.09.t3
    skillId: CMP.09
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: numberline.place
    params: { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 0, labelsEvery: 0 }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CMP.09.t3.prompt, hints: [h.numberline.near-end, h.numberline.middle] }

  # ---------- CMP.13 estimate how many in a big group ----------
  # dot-flash weighs each dot above 4 (n.over4); an estimate is not counted, so n.per50 sizes it.
  - id: CMP.13.t1
    skillId: CMP.13
    format: dot-flash
    tier: pictorial
    representation: objects
    generator: estimate.quantity
    params: { n: { int: [20, 100] }, benchmarks: { choice: [0, 10] } }
    difficulty: { base: -0.9, features: { n.over4: 0 } }
    narration: { prompt: tp.CMP.13.t1.prompt, hints: [h.estimate.no-count, h.estimate.ten] }

  - id: CMP.13.t2
    skillId: CMP.13
    format: dot-flash
    tier: pictorial
    representation: dots
    generator: estimate.quantity
    params: { n: { int: [20, 100] }, benchmarks: 0 }
    difficulty: { base: -0.85, features: { n.over4: 0 } }
    narration: { prompt: tp.CMP.13.t2.prompt, hints: [h.estimate.no-count, h.estimate.ten] }

  - id: CMP.13.t3
    skillId: CMP.13
    format: numeral-pick
    tier: pictorial
    representation: dots
    generator: estimate.quantity
    params: { n: { int: [20, 100] }, benchmarks: 0 }
    difficulty: { base: -0.25 }
    narration: { prompt: tp.CMP.13.t3.prompt, hints: [h.estimate.no-count, h.estimate.ten] }

  - id: CMP.13.t4
    skillId: CMP.13
    format: numeral-pick
    tier: pictorial
    representation: number-line
    generator: estimate.quantity
    params: { n: { int: [20, 100] }, benchmarks: 0 }

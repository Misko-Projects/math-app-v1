      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: true
    difficulty: { base: -1.7 }
    expectedLatencyMs: 12000
    narration:
      prompt: tp.CMP.05.t1.prompt
      hints: [h.compare.not-size, h.compare.match, h.compare.left-over]

  - id: CMP.05.t2
    skillId: CMP.05
    format: make-set
    tier: concrete
    representation: objects
    generator: compare.sets
    params: { a: { int: [0, 10] }, b: { int: [1, 10] } }
    difficulty: { base: -0.85 }
    narration: { prompt: tp.CMP.05.t2.prompt, hints: [h.compare.count-yours, h.compare.make-same] }

  - id: CMP.05.t3
    skillId: CMP.05
    format: compare
    tier: pictorial
    representation: dots
    generator: compare.sets
    params:
      a: { int: [2, 10] }
      b: { int: [2, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: true
    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.05.t3.prompt, hints: [h.compare.not-size, h.compare.count-each] }

  # Constructed practice (V27): the fewest group looks biggest, the most is bunched up.
  - id: CMP.05.t4
    skillId: CMP.05
    format: order
    tier: pictorial
    representation: objects
    generator: compare.sets
    params:
      a: { int: [2, 10] }
      b: { int: [2, 10] }
      c: { int: [2, 10] }
      ask: fewer
      conflict: true
    difficulty: { base: -1.05, features: { closeness: 0.5 } }
    narration:
      prompt: tp.CMP.05.t4.prompt
      hints: [h.compare.not-size, h.order.count-groups, h.order.fewest-first]

  # ---------- CMP.06 order three or more numbers to 20 ----------
  - id: CMP.06.t1
    skillId: CMP.06
    format: order
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params:
      {
        a: { int: [0, 20] },
        b: { int: [0, 20] },
        extra: { int: [1, 2] },
        min: 0,
        max: 20,
        ask: fewer,
      }
    # The order model's own `closeness` (smallest gap < 10% of the range) keeps its 03 §5.5 weight;
    # compare.numbers declares `closeness` for the compare format.
    difficulty: { base: -0.2, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.06.t1.prompt, hints: [h.order.smallest, h.order.path] }

  - id: CMP.06.t2
    skillId: CMP.06
    format: number-line-place
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params: { a: { int: [1, 19] }, b: { int: [0, 20] }, extra: 1, min: 0, max: 20, ask: fewer }
    difficulty: { base: -0.1 }
    narration:
      { prompt: tp.CMP.06.t2.prompt, hints: [h.numberline.marked, h.numberline.count-ticks] }

  - id: CMP.06.t3
    skillId: CMP.06
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [0, 20] },
        b: { int: [0, 20] },
        extra: { int: [1, 3] },
        min: 0,
        max: 20,
        ask: fewer,
      }
    difficulty: { base: -0.3, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.06.t3.prompt, hints: [h.order.smallest, h.order.count-up] }

  # ---------- CMP.07 compare numbers 11–20 ----------
  - id: CMP.07.t1
    skillId: CMP.07
    format: compare
    tier: concrete
    representation: double-ten-frame
    generator: compare.numbers
    params:
      a: { int: [11, 20] }
      b: { int: [11, 20] }
      extra: 0
      min: 10
      max: 20
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.07.t1.prompt, hints: [h.compare.full-frames, h.compare.tens] }

  - id: CMP.07.t2
    skillId: CMP.07
    format: compare
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      a: { int: [11, 20] }
      b: { int: [11, 20] }
      extra: 0
      min: 0
      max: 20
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -1.6 }
    narration: { prompt: tp.CMP.07.t2.prompt, hints: [h.compare.line, h.compare.tens] }

  # Constructed practice (V27): three teen numbers as double ten-frames, no numerals.
  - id: CMP.07.t4
    skillId: CMP.07
    format: order
    tier: pictorial
    representation: double-ten-frame
    generator: compare.numbers
    params: { a: { int: [11, 20] }, b: { int: [11, 20] }, extra: 1, min: 11, max: 20, ask: fewer }
    difficulty: { base: -0.8, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.07.t4.prompt, hints: [h.compare.full-frames, h.order.fewest-first] }

  - id: CMP.07.t3
    skillId: CMP.07
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [11, 20] },
        b: { int: [11, 20] },
        extra: { int: [1, 2] },
        min: 11,
        max: 20,
        ask: fewer,
      }
    difficulty: { base: -0.8, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.07.t3.prompt, hints: [h.order.smallest, h.compare.tens] }

  # ---------- CMP.09 estimate on a 0–100 line with only the ends marked ----------
  - id: CMP.09.t1
    skillId: CMP.09
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 0, labelsEvery: 0, mode: place }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CMP.09.t1.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.09.t2
    skillId: CMP.09
    format: numeral-pick
    tier: pictorial
    representation: number-line

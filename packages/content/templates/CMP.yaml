# CMP templates (03 §4.3) on compare.sets, compare.numbers, numberline.place, estimate.quantity and
# addsub.facts (03 §5.6). One template per catalog format at least, every catalog representation
# used, ordered concrete → pictorial → abstract within each skill. Difficulty bases are tuned from
# template-stats.json (03 §5.4) so the median item of each template sits near d = 0.
strand: CMP
templates:
  # ---------- CMP.01 compare two groups up to 10 ----------
  # Some items carry the conflict cue (the fewer group looks bigger), so MC.perceptual-size can show up
  # before CMP.05 teaches matching.
  - id: CMP.01.t1
    skillId: CMP.01
    format: compare
    tier: concrete
    representation: objects
    generator: compare.sets
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: { bool: 0.3 }
    difficulty: { base: -1 }
    expectedLatencyMs: 12000
    narration:
      prompt: tp.CMP.01.t1.prompt
      hints: [h.compare.match, h.compare.left-over, h.compare.count-each]

  - id: CMP.01.t2
    skillId: CMP.01
    format: make-set
    tier: concrete
    representation: ten-frame
    generator: compare.sets
    params: { a: { int: [0, 10] }, b: { int: [1, 10] } }
    difficulty: { base: -0.85 }
    narration: { prompt: tp.CMP.01.t2.prompt, hints: [h.compare.count-yours, h.compare.make-same] }

  - id: CMP.01.t3
    skillId: CMP.01
    format: compare
    tier: pictorial
    representation: ten-frame
    generator: compare.sets
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -0.8 }
    narration: { prompt: tp.CMP.01.t3.prompt, hints: [h.compare.frames, h.compare.count-each] }

  - id: CMP.01.t4
    skillId: CMP.01
    format: compare
    tier: pictorial
    representation: dots
    generator: compare.sets
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: { bool: 0.3 }
    difficulty: { base: -1 }
    narration: { prompt: tp.CMP.01.t4.prompt, hints: [h.compare.count-each, h.compare.not-size] }

  # Constructed practice (V27): three groups to put in order; some carry the conflict cue.
  - id: CMP.01.t5
    skillId: CMP.01
    format: order
    tier: pictorial
    representation: dots
    generator: compare.sets
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      c: { int: [1, 10] }
      ask: fewer
      conflict: { bool: 0.3 }
    # The order model keeps its closeness weight (compare.sets declares closeness for compare).
    difficulty: { base: -0.6, features: { closeness: 0.5 } }
    narration:
      prompt: tp.CMP.01.t5.prompt
      hints: [h.order.count-groups, h.compare.not-size, h.order.fewest-first]

  # ---------- CMP.02 compare two numerals 1–10 ----------
  - id: CMP.02.t1
    skillId: CMP.02
    format: compare
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      extra: 0
      min: 1
      max: 10
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -0.6 }
    narration: { prompt: tp.CMP.02.t1.prompt, hints: [h.compare.path, h.compare.count-up] }

  # Constructed practice (V27): order numbers to 10 on the path, then as numerals.
  - id: CMP.02.t2
    skillId: CMP.02
    format: order
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params:
      {
        a: { int: [1, 10] },
        b: { int: [1, 10] },
        extra: { int: [1, 2] },
        min: 1,
        max: 10,
        ask: fewer,
      }
    difficulty: { base: 0, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.02.t2.prompt, hints: [h.order.path, h.order.smallest] }

  - id: CMP.02.t3
    skillId: CMP.02
    format: compare
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      a: { int: [1, 10] }
      b: { int: [1, 10] }
      extra: 0
      min: 1
      max: 10
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -0.6 }
    narration: { prompt: tp.CMP.02.t3.prompt, hints: [h.compare.count-up, h.compare.path] }

  - id: CMP.02.t4
    skillId: CMP.02
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params: { a: { int: [1, 10] }, b: { int: [1, 10] }, extra: 1, min: 1, max: 10, ask: more }
    difficulty: { base: -0.85 }
    narration: { prompt: tp.CMP.02.t4.prompt, hints: [h.compare.count-up, h.compare.path] }

  - id: CMP.02.t5
    skillId: CMP.02
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [1, 10] },
        b: { int: [1, 10] },
        extra: { int: [1, 2] },
        min: 1,
        max: 10,
        ask: more,
      }
    difficulty: { base: -0.3, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.02.t5.prompt, hints: [h.order.greatest, h.compare.count-up] }

  # ---------- CMP.03 one more and one less to 20 ----------
  - id: CMP.03.t1
    skillId: CMP.03
    format: tenframe-fill
    tier: concrete
    representation: ten-frame
    generator: addsub.facts
    params: { a: { int: [1, 9] }, b: 1, op: "+", unknown: result, family: plus1 }
    difficulty: { base: 0.3 }
    expectedLatencyMs: 12000
    narration: { prompt: tp.CMP.03.t1.prompt, hints: [h.count.one-more, h.count.one-more-next] }

  - id: CMP.03.t2
    skillId: CMP.03
    format: tenframe-fill
    tier: concrete
    representation: ten-frame
    generator: addsub.facts
    params: { a: { int: [2, 10] }, b: 1, op: "-", unknown: result, family: any }
    difficulty: { base: -0.4 }
    expectedLatencyMs: 12000
    narration:
      { prompt: tp.CMP.03.t2.prompt, hints: [h.compare.one-less, h.compare.one-less-before] }

  - id: CMP.03.t3
    skillId: CMP.03
    format: number-line-jump
    tier: concrete
    representation: number-path
    generator: addsub.facts
    params: { a: { int: [1, 19] }, b: 1, op: "+", unknown: result, family: plus1 }
    difficulty: { base: 0.1 }
    expectedLatencyMs: 12000
    narration: { prompt: tp.CMP.03.t3.prompt, hints: [h.sequence.look-path, h.count.one-more-next] }

  - id: CMP.03.t4
    skillId: CMP.03
    format: number-line-jump
    tier: concrete
    representation: number-path
    generator: addsub.facts
    params: { a: { int: [2, 20] }, b: 1, op: "-", unknown: result, family: any }
    difficulty: { base: -0.9 }
    expectedLatencyMs: 12000
    narration:
      prompt: tp.CMP.03.t4.prompt
      hints: [h.sequence.look-path-back, h.compare.one-less-before]

  - id: CMP.03.t5
    skillId: CMP.03
    format: number-pad
    tier: abstract
    representation: symbols
    generator: addsub.facts
    params: { a: { int: [1, 19] }, b: 1, op: "+", unknown: result, family: plus1 }
    difficulty: { base: 0.1 }
    narration: { prompt: tp.CMP.03.t5.prompt, hints: [h.count.one-more-next, h.sequence.say-it] }

  - id: CMP.03.t6
    skillId: CMP.03
    format: number-pad
    tier: abstract
    representation: symbols
    generator: addsub.facts
    params: { a: { int: [2, 20] }, b: 1, op: "-", unknown: result, family: any }
    difficulty: { base: -0.4 }
    narration:
      prompt: tp.CMP.03.t6.prompt
      hints: [h.compare.one-less-before, h.sequence.count-back]

  # ---------- CMP.04 place numbers on 0–20 and 0–100 lines ----------
  - id: CMP.04.t1
    skillId: CMP.04
    format: number-line-place
    tier: pictorial
    representation: number-path
    generator: numberline.place
    params:
      { min: 0, max: 20, target: { int: [1, 19] }, ticksEvery: 1, labelsEvery: 5, mode: place }
    difficulty: { base: -0.5 }
    narration: { prompt: tp.CMP.04.t1.prompt, hints: [h.numberline.ends, h.numberline.count-ticks] }

  - id: CMP.04.t2
    skillId: CMP.04
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 10, labelsEvery: 10, mode: place }
    difficulty: { base: -0.8 }
    narration: { prompt: tp.CMP.04.t2.prompt, hints: [h.numberline.tens, h.numberline.ends] }

  - id: CMP.04.t3
    skillId: CMP.04
    format: order
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      {
        min: 0,
        max: 100,
        target: { int: [1, 99] },
        ticksEvery: 10,
        labelsEvery: 10,
        benchmarks: 10,
      }
    difficulty: { base: -0.3 }
    narration: { prompt: tp.CMP.04.t3.prompt, hints: [h.order.smallest, h.order.tens] }

  # ---------- CMP.05 compare by matching when looks mislead ----------
  - id: CMP.05.t1
    skillId: CMP.05
    format: compare
    tier: concrete
    representation: objects
    generator: compare.sets
    params:
      a: { int: [2, 10] }
      b: { int: [2, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: true
    # The prompt asks which group has more (or fewer) and the looks mislead: the groups differ.
    constraints: ["a != b"]
    difficulty: { base: -1.7 }
    expectedLatencyMs: 12000
    narration:
      prompt: tp.CMP.05.t1.prompt
      hints: [h.compare.not-size, h.compare.match, h.compare.left-over]

  - id: CMP.05.t2
    skillId: CMP.05
    format: make-set
    tier: concrete
    representation: objects
    generator: compare.sets
    params: { a: { int: [0, 10] }, b: { int: [1, 10] } }
    difficulty: { base: -0.85 }
    narration: { prompt: tp.CMP.05.t2.prompt, hints: [h.compare.count-yours, h.compare.make-same] }

  - id: CMP.05.t3
    skillId: CMP.05
    format: compare
    tier: pictorial
    representation: dots
    generator: compare.sets
    params:
      a: { int: [2, 10] }
      b: { int: [2, 10] }
      ask: { choice: [more, fewer], weights: [3, 1] }
      conflict: true
    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.05.t3.prompt, hints: [h.compare.not-size, h.compare.count-each] }

  # Constructed practice (V27): the fewest group looks biggest, the most is bunched up.
  - id: CMP.05.t4
    skillId: CMP.05
    format: order
    tier: pictorial
    representation: objects
    generator: compare.sets
    params:
      a: { int: [2, 10] }
      b: { int: [2, 10] }
      c: { int: [2, 10] }
      ask: fewer
      conflict: true
    difficulty: { base: -1.05, features: { closeness: 0.5 } }
    narration:
      prompt: tp.CMP.05.t4.prompt
      hints: [h.compare.not-size, h.order.count-groups, h.order.fewest-first]

  # ---------- CMP.06 order three or more numbers to 20 ----------
  - id: CMP.06.t1
    skillId: CMP.06
    format: order
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params:
      {
        a: { int: [0, 20] },
        b: { int: [0, 20] },
        extra: { int: [1, 2] },
        min: 0,
        max: 20,
        ask: fewer,
      }
    # The order model's own `closeness` (smallest gap < 10% of the range) keeps its 03 §5.5 weight;
    # compare.numbers declares `closeness` for the compare format.
    difficulty: { base: -0.2, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.06.t1.prompt, hints: [h.order.smallest, h.order.path] }

  - id: CMP.06.t2
    skillId: CMP.06
    format: number-line-place
    tier: pictorial
    representation: number-path
    generator: compare.numbers
    params: { a: { int: [1, 19] }, b: { int: [0, 20] }, extra: 1, min: 0, max: 20, ask: fewer }
    difficulty: { base: -0.1 }
    narration:
      { prompt: tp.CMP.06.t2.prompt, hints: [h.numberline.marked, h.numberline.count-ticks] }

  - id: CMP.06.t3
    skillId: CMP.06
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [0, 20] },
        b: { int: [0, 20] },
        extra: { int: [1, 3] },
        min: 0,
        max: 20,
        ask: fewer,
      }
    difficulty: { base: -0.3, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.06.t3.prompt, hints: [h.order.smallest, h.order.count-up] }

  # ---------- CMP.07 compare numbers 11–20 ----------
  - id: CMP.07.t1
    skillId: CMP.07
    format: compare
    tier: concrete
    representation: double-ten-frame
    generator: compare.numbers
    params:
      a: { int: [11, 20] }
      b: { int: [11, 20] }
      extra: 0
      min: 10
      max: 20
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.07.t1.prompt, hints: [h.compare.full-frames, h.compare.tens] }

  - id: CMP.07.t2
    skillId: CMP.07
    format: compare
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      a: { int: [11, 20] }
      b: { int: [11, 20] }
      extra: 0
      min: 0
      max: 20
      ask: { choice: [more, fewer], weights: [3, 1] }
    difficulty: { base: -1.6 }
    narration: { prompt: tp.CMP.07.t2.prompt, hints: [h.compare.line, h.compare.tens] }

  # Constructed practice (V27): three teen numbers as double ten-frames, no numerals.
  - id: CMP.07.t3
    skillId: CMP.07
    format: order
    tier: pictorial
    representation: double-ten-frame
    generator: compare.numbers
    params: { a: { int: [11, 20] }, b: { int: [11, 20] }, extra: 1, min: 11, max: 20, ask: fewer }
    difficulty: { base: -0.8, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.07.t3.prompt, hints: [h.compare.full-frames, h.order.fewest-first] }

  - id: CMP.07.t4
    skillId: CMP.07
    format: order
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      {
        a: { int: [11, 20] },
        b: { int: [11, 20] },
        extra: { int: [1, 2] },
        min: 11,
        max: 20,
        ask: fewer,
      }
    difficulty: { base: -0.8, features: { closeness: 0.5 } }
    narration: { prompt: tp.CMP.07.t4.prompt, hints: [h.order.smallest, h.compare.tens] }

  # ---------- CMP.08 <, > and = to 20 ----------
  # Constructed practice (V27): make a balance level (equality.eq a = c + _, balance.equal) and the
  # one number between two others (a < _ < a + 2). The symbol templates are choices.
  - id: CMP.08.t1
    skillId: CMP.08
    format: balance
    tier: pictorial
    representation: balance
    generator: equality.eq
    params: { form: a=c+_, mode: make-equal, a: { int: [2, 20] }, b: 0, c: { int: [1, 19] } }
    difficulty: { base: -0.9 }
    narration: { prompt: tp.CMP.08.t1.prompt, hints: [h.weight.goes-down, h.balance.add-one] }

  - id: CMP.08.t2
    skillId: CMP.08
    format: compare
    tier: pictorial
    representation: number-line
    generator: compare.numbers
    params:
      a: { int: [0, 20] }
      b: { int: [0, 20] }
      extra: 0
      min: 0
      max: 20
      ask: symbol
    difficulty: { base: -0.8 }
    narration: { prompt: tp.CMP.08.t2.prompt, hints: [h.compare.line, h.cmp.mark-fits] }

  - id: CMP.08.t3
    skillId: CMP.08
    format: compare
    tier: abstract
    representation: symbols
    generator: compare.numbers
    params:
      a: { int: [0, 20] }
      b: { int: [0, 20] }
      extra: 0
      min: 0
      max: 20
      ask: symbol
    difficulty: { base: -0.85 }
    narration: { prompt: tp.CMP.08.t2.prompt, hints: [h.cmp.same-or-greater, h.cmp.mark-fits] }

  - id: CMP.08.t4
    skillId: CMP.08
    format: number-pad
    tier: abstract
    representation: symbols
    generator: equality.eq
    params: { form: between, rel: { choice: ["<", ">"] }, a: { int: [0, 18] }, b: 0, c: 1 }
    difficulty: { base: -0.5 }
    narration: { prompt: tp.CMP.08.t4.prompt, hints: [h.cmp.between, h.cmp.open-side] }

  # ---------- CMP.09 estimate on a 0–100 line with only the ends marked ----------
  - id: CMP.09.t1
    skillId: CMP.09
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 0, labelsEvery: 0, mode: place }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CMP.09.t1.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.09.t2
    skillId: CMP.09
    format: numeral-pick
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params: { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 0, labelsEvery: 0 }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CMP.09.t2.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  # Constructed practice (V27): read the arrow on a bare line (0 and 100 labelled); an estimate
  # within 10 is right. Targets stay 10 from both ends (the generator also rejects closer ones), so
  # no accepted answer is off the line.
  - id: CMP.09.t3
    skillId: CMP.09
    format: number-pad
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params: { min: 0, max: 100, target: { int: [10, 90] }, ticksEvery: 0, labelsEvery: 0 }
    difficulty: { base: -1.7 }
    narration: { prompt: tp.CMP.09.t3.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.09.t4
    skillId: CMP.09
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: numberline.place
    params: { min: 0, max: 100, target: { int: [1, 99] }, ticksEvery: 0, labelsEvery: 0 }
    difficulty: { base: -1.4 }
    narration: { prompt: tp.CMP.09.t4.prompt, hints: [h.numberline.near-end, h.numberline.middle] }

  # ---------- CMP.10 place and estimate on a 0–1000 line ----------
  - id: CMP.10.t1
    skillId: CMP.10
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      min: 0
      max: 1000
      target: { int: [1, 999], exclude: [100, 200, 300, 400, 500, 600, 700, 800, 900] }
      ticksEvery: 100
      labelsEvery: 100
      mode: place
    difficulty: { base: -1.2 }
    narration: { prompt: tp.CMP.10.t1.prompt, hints: [h.numberline.between-marks, h.numberline.ends] }

  - id: CMP.10.t2
    skillId: CMP.10
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params: { min: 0, max: 1000, target: { int: [1, 999] }, ticksEvery: 0, labelsEvery: 0, mode: place }
    difficulty: { base: -1.8 }
    narration: { prompt: tp.CMP.10.t2.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.10.t3
    skillId: CMP.10
    format: numeral-pick
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params: { min: 0, max: 1000, target: { int: [1, 999] }, ticksEvery: 100, labelsEvery: 500 }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.CMP.10.t3.prompt, hints: [h.numberline.count-hundreds, h.numberline.middle] }

  # Read the arrow on a bare 0–1000 line; an estimate within 100 is right, and targets stay 100
  # from both ends (the generator rejects closer ones), so no accepted answer is off the line.
  - id: CMP.10.t4
    skillId: CMP.10
    format: number-pad
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params: { min: 0, max: 1000, target: { int: [100, 900] }, ticksEvery: 0, labelsEvery: 0 }
    difficulty: { base: -2.4 }
    narration: { prompt: tp.CMP.10.t5.prompt, hints: [h.numberline.middle, h.numberline.near-end] }

  - id: CMP.10.t5
    skillId: CMP.10
    format: numeral-pick
    tier: abstract
    representation: symbols
    generator: numberline.place
    params: { min: 0, max: 1000, target: { int: [1, 999] }, ticksEvery: 100, labelsEvery: 500 }
    difficulty: { base: -1.2 }
    narration: { prompt: tp.CMP.10.t4.prompt, hints: [h.numberline.count-hundreds, h.numberline.middle] }

  # ---------- CMP.11 read a number line marked in 2s, 5s or 10s ----------
  # Each template keeps one marking; the target is a tick without a label.
  - id: CMP.11.t1
    skillId: CMP.11
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      min: 0
      max: 40
      target: { int: [4, 38], step: 2, exclude: [10, 20, 30] }
      ticksEvery: 2
      labelsEvery: 10
      mode: read
    difficulty: { base: -0.84 }
    narration: { prompt: tp.CMP.11.t1.prompt, hints: [h.numberline.skip-ticks, h.numberline.from-label] }

  - id: CMP.11.t2
    skillId: CMP.11
    format: number-line-place
    tier: pictorial
    representation: number-line
    generator: numberline.place
    params:
      min: 0
      max: 100
      target: { int: [10, 95], step: 5, exclude: [20, 40, 60, 80] }
      ticksEvery: 5

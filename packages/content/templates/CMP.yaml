    narration: { prompt: tp.CMP.13.t4.prompt, hints: [h.estimate.ten, h.estimate.line] }

  # Constructed practice (V27): a group of ten is marked; type about how many (within 25%).
  - id: CMP.13.t5
    skillId: CMP.13
    format: number-pad
    tier: pictorial
    representation: dots
    generator: estimate.quantity
    params: { n: { int: [20, 100] }, benchmarks: 10 }
    difficulty: { base: -0.55 }
    narration: { prompt: tp.CMP.13.t5.prompt, hints: [h.estimate.no-count, h.estimate.ten] }

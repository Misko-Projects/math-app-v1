# SUB templates (K01), all on subitize.flash. Bases are tuned from template-stats so each
# template's median sits near 0. Where a template's numbers barely move (1–4, 1–5), the
# spread comes from n.upTo4 (size inside the perceptual range), arrangement (scatter vs. a
# known pattern) and, for groups, group.over3 (03 §5.6).
strand: SUB
templates:
  # ---------- SUB.01: see 1 to 4 at a glance ----------
  - id: SUB.01.t1
    skillId: SUB.01
    format: dot-flash
    tier: pictorial
    generator: subitize.flash
    params: { n: { int: [1, 4] }, arrangement: { choice: [dice, scatter] } }
    difficulty: { base: -0.5 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again] }

  - id: SUB.01.t2
    skillId: SUB.01
    format: dot-flash
    tier: pictorial
    representation: fingers
    generator: subitize.flash
    params: { n: { int: [1, 4] }, arrangement: fingers }
    difficulty: { base: -0.3 }
    narration: { prompt: p.subitize.how-many-fingers, hints: [h.subitize.look-again] }

  - id: SUB.01.t3
    skillId: SUB.01
    format: numeral-pick
    tier: pictorial
    representation: objects
    generator: subitize.flash
    params: { n: { int: [1, 4] }, arrangement: scatter }
    difficulty: { base: -0.6 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again] }

  # Constructed answer in a second format (04 §7a: t1 and t2 are both dot-flash): t3's picture of
  # 1 to 4 things, and the child types how many.
  - id: SUB.01.t4
    skillId: SUB.01
    format: number-pad
    tier: pictorial
    representation: objects
    generator: subitize.flash
    params: { n: { int: [1, 4] }, arrangement: scatter }
    difficulty: { base: -0.15 }
    narration: { prompt: tp.SUB.01.t4.prompt, hints: [h.subitize.look-again] }

  # ---------- SUB.02: up to 5; dice and finger patterns ----------

  - id: SUB.02.t1
    skillId: SUB.02
    format: make-set
    tier: concrete
    representation: fingers
    generator: subitize.flash
    params: { n: { int: [1, 5] }, arrangement: fingers }
    difficulty: { base: -0.9 }
    narration: { prompt: p.count.show-fingers, hints: [h.subitize.five-fingers] }

  - id: SUB.02.t2
    skillId: SUB.02
    format: dot-flash
    tier: pictorial
    representation: five-frame
    generator: subitize.flash
    params: { n: { int: [1, 5] }, arrangement: five-frame }
    difficulty: { base: -0.3 }
    narration:
      { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.five-frame] }

  - id: SUB.02.t3
    skillId: SUB.02
    format: numeral-pick
    tier: pictorial
    representation: dots
    generator: subitize.flash
    params: { n: { int: [1, 5] }, arrangement: dice }
    difficulty: { base: -0.6 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again] }

  # ---------- SUB.03: 6–10 as five and some more (gateway) ----------

  - id: SUB.03.t1
    skillId: SUB.03
    format: tenframe-fill
    tier: concrete
    generator: subitize.flash
    params: { n: { int: [6, 10] }, arrangement: ten-frame }
    # Each counter past the full top row is one more to place and check on a single frame, so
    # size weighs more here than the tenframe-fill default (0.3 per 5).
    difficulty: { base: -1.3, features: { n.over5: 0.6 } }
    narration: { prompt: tp.SUB.03.t1.prompt, hints: [h.subitize.five-and, h.count.show-frame] }

  - id: SUB.03.t2
    skillId: SUB.03
    format: dot-flash
    tier: pictorial
    representation: fingers
    generator: subitize.flash
    params: { n: { int: [6, 10] }, arrangement: fingers }
    difficulty: { base: -1.95 }
    narration: { prompt: p.subitize.how-many-fingers, hints: [h.subitize.full-hand] }

  - id: SUB.03.t3
    skillId: SUB.03
    format: dot-flash
    tier: pictorial
    generator: subitize.flash
    params: { n: { int: [6, 10] }, arrangement: { choice: [ten-frame, groups] } }
    difficulty: { base: -1.95 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-groups, h.subitize.five-and] }

  - id: SUB.03.t4
    skillId: SUB.03
    format: number-pad
    tier: abstract
    representation: symbols
    generator: subitize.flash
    params: { n: { int: [6, 10] }, arrangement: ten-frame }
    difficulty: { base: -0.9 }
    narration: { prompt: tp.SUB.03.t4.prompt, hints: [h.subitize.think-hand, h.subitize.five-and] }

  # Added by K01 after t4 shipped in C01. Template ids are stable (attempts store them), so it takes
  # the next free number; the resulting V10 tier-order warning is expected (03 §4.3).
  - id: SUB.03.t5
    skillId: SUB.03
    format: dot-flash
    tier: pictorial
    representation: five-frame
    generator: subitize.flash
    params: { n: { int: [6, 10] }, arrangement: five-frame }
    difficulty: { base: -1.95 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.five-and] }

  # ---------- SUB.04: 11–20 on double ten-frames as ten and some more (grade 1) ----------
  # On two frames the full ten is seen at once, so each counter past four weighs less than the
  # dot-flash default (0.25 each); the ones past ten carry the size.

  - id: SUB.04.t1
    skillId: SUB.04
    format: rekenrek
    tier: concrete
    generator: subitize.flash
    params: { n: { int: [11, 20] }, arrangement: double-ten-frame }
    difficulty: { base: -2.7 }
    narration: { prompt: tp.SUB.04.t1.prompt, hints: [h.subitize.ten-and] }

  - id: SUB.04.t2
    skillId: SUB.04
    format: dot-flash
    tier: pictorial
    representation: double-ten-frame
    generator: subitize.flash
    params: { n: { int: [11, 20] }, arrangement: double-ten-frame, flashMs: 1000 }
    difficulty: { base: -2.95, features: { n.over4: 0.1 } }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.full-ten] }

  - id: SUB.04.t3
    skillId: SUB.04
    format: dot-flash
    tier: pictorial
    representation: dots
    generator: subitize.flash
    params: { n: { int: [11, 20] }, arrangement: double-ten-frame, flashMs: 1000 }
    difficulty: { base: -2.95, features: { n.over4: 0.1 } }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.full-ten] }

  - id: SUB.04.t4
    skillId: SUB.04
    format: number-pad
    tier: pictorial
    representation: double-ten-frame
    generator: subitize.flash
    params: { n: { int: [11, 20] }, arrangement: double-ten-frame }
    difficulty: { base: -2.6 }
    narration: { prompt: tp.SUB.04.t4.prompt, hints: [h.subitize.full-ten] }

  # ---------- SUB.05: show and read finger patterns to 10 ----------

  - id: SUB.05.t1
    skillId: SUB.05
    format: make-set
    tier: concrete
    representation: fingers
    generator: subitize.flash
    params: { n: { int: [5, 10] }, arrangement: fingers }
    difficulty: { base: -1.35 }
    narration:
      { prompt: p.count.show-fingers, hints: [h.subitize.full-hand-first, h.subitize.five-fingers] }

  - id: SUB.05.t2
    skillId: SUB.05
    format: dot-flash
    tier: pictorial
    representation: fingers
    generator: subitize.flash
    params: { n: { int: [5, 10] }, arrangement: fingers }
    difficulty: { base: -1.8 }
    narration:
      { prompt: p.subitize.how-many-fingers, hints: [h.subitize.look-again, h.subitize.full-hand] }

  - id: SUB.05.t3
    skillId: SUB.05
    format: dot-flash
    tier: pictorial
    representation: five-frame
    generator: subitize.flash
    params: { n: { int: [5, 10] }, arrangement: five-frame }
    difficulty: { base: -1.8 }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.five-and] }

  # ---------- SUB.06: small groups inside a set (grade 1) ----------
  # Two groups, each 1–5 so it can be seen at a glance; the first group's size varies (part).

  - id: SUB.06.t1
    skillId: SUB.06
    format: number-bond
    tier: concrete
    generator: subitize.flash
    params: { n: { int: [4, 10] }, arrangement: groups, groups: 2, part: { int: [1, 5] } }
    constraints: ["n - part >= 1", "n - part <= 5"]
    difficulty: { base: -1.1 }
    narration:
      { prompt: tp.SUB.06.t1.prompt, hints: [h.subitize.each-part, h.subitize.parts-together] }

  - id: SUB.06.t2
    skillId: SUB.06
    format: dot-flash
    tier: pictorial
    representation: objects
    generator: subitize.flash
    params:
      n: { int: [4, 10] }
      arrangement: groups
      groups: 2
      part: { int: [1, 5] }
      flashMs: 1000
    constraints: ["n - part >= 1", "n - part <= 5"]
    difficulty: { base: -1.85 }
    narration:
      { prompt: p.subitize.how-many, hints: [h.subitize.look-groups, h.subitize.parts-together] }

  - id: SUB.06.t3
    skillId: SUB.06
    format: dot-flash
    tier: pictorial
    generator: subitize.flash
    params:
      n: { int: [4, 10] }
      arrangement: groups
      groups: 2
      part: { int: [1, 5] }
      flashMs: 1000
    constraints: ["n - part >= 1", "n - part <= 5"]
    difficulty: { base: -1.85 }
    narration:
      { prompt: p.subitize.how-many, hints: [h.subitize.look-groups, h.subitize.parts-together] }

  # ---------- SUB.07: quick-read beads on a rekenrek to 20 (grade 1) ----------
  # part: beads on the top row (or counters in the first frame). 10 is ten and some more; a part
  # below ten splits the rows (8 and 7), read by fives (split.rows).

  - id: SUB.07.t1
    skillId: SUB.07
    format: rekenrek
    tier: concrete
    generator: subitize.flash
    params: { n: { int: [6, 20] }, arrangement: double-ten-frame, part: { int: [1, 10] } }
    constraints: ["n - part >= 1", "n - part <= 10"]
    difficulty: { base: -2.5 }
    narration: { prompt: tp.SUB.07.t1.prompt, hints: [h.subitize.fives, h.subitize.rows-together] }

  - id: SUB.07.t2
    skillId: SUB.07
    format: dot-flash
    tier: pictorial
    representation: rekenrek
    generator: subitize.flash
    params:
      n: { int: [6, 20] }
      arrangement: double-ten-frame
      part: { int: [1, 10] }
      flashMs: 1000
    constraints: ["n - part >= 1", "n - part <= 10"]
    difficulty: { base: -2.65, features: { n.over4: 0.1 } }
    narration: { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.fives] }

  - id: SUB.07.t3
    skillId: SUB.07
    format: dot-flash
    tier: pictorial
    representation: double-ten-frame
    generator: subitize.flash
    params:
      n: { int: [6, 20] }
      arrangement: double-ten-frame
      part: { int: [1, 10] }
      flashMs: 1000
    constraints: ["n - part >= 1", "n - part <= 10"]
    difficulty: { base: -2.65, features: { n.over4: 0.1 } }
    narration:
      { prompt: p.subitize.how-many, hints: [h.subitize.look-again, h.subitize.frame-fives] }

  # ---------- SUB.08 quick-read tens and ones from a base-ten picture ----------
  - id: SUB.08.t1
    skillId: SUB.08
    format: dot-flash
    tier: pictorial
    representation: base-ten
    generator: pv.number
    params: { n: { int: [21, 59] }, mode: read, flashMs: 2000 }
    difficulty: { base: -1.5, features: { n.over4: 0.02 } }
    narration: { prompt: tp.SUB.08.t1.prompt, hints: [h.pv.rod-is-ten, h.pv.count-tens-ones] }

  - id: SUB.08.t2
    skillId: SUB.08
    format: dot-flash
    tier: pictorial
    representation: bundles
    generator: pv.number
    params: { n: { int: [21, 59] }, mode: read, flashMs: 2000 }
    difficulty: { base: -1.48, features: { n.over4: 0.02 } }
    narration: { prompt: tp.SUB.08.t2.prompt, hints: [h.pv.bundle-is-ten, h.pv.count-tens-ones] }

  - id: SUB.08.t3
    skillId: SUB.08
    format: number-pad
    tier: pictorial
    representation: bundles
    generator: pv.number
    params: { n: { int: [21, 99] }, mode: read }
    difficulty: { base: -1.0 }
    narration: { prompt: tp.SUB.08.t3.prompt, hints: [h.pv.bundle-is-ten, h.pv.count-tens-ones] }

  # SUB.09 (K02 #17 slice 3a) on mul.groups: equal groups, a small array or dots in groups flash;
  # then read an array without a flash. Up to 4 groups of 5 flash; arrays to 5 × 5.
  - id: SUB.09.t1
    skillId: SUB.09
    format: dot-flash
    tier: pictorial
    representation: groups
    generator: mul.groups
    params: { groups: { int: [2, 4] }, perGroup: { int: [2, 5] }, unknown: total }
    difficulty: { base: -2.0 }
    narration:
      prompt: tp.SUB.09.t1.prompt
      hints: [h.mul.see-groups, h.mul.count-by]

  - id: SUB.09.t2
    skillId: SUB.09
    format: dot-flash
    tier: pictorial
    representation: array
    generator: mul.groups
    params: { groups: { int: [2, 4] }, perGroup: { int: [2, 5] }, unknown: total }
    difficulty: { base: -1.8 }
    narration:
      prompt: tp.SUB.09.t2.prompt
      hints: [h.mul.see-rows, h.mul.count-by-rows]

  - id: SUB.09.t3
    skillId: SUB.09
    format: dot-flash
    tier: pictorial
    representation: dots
    generator: mul.groups
    params: { groups: { int: [2, 4] }, perGroup: { int: [2, 5] }, unknown: total }
    difficulty: { base: -2.0 }
    narration:
      prompt: tp.SUB.09.t1.prompt
      hints: [h.mul.see-groups, h.mul.count-by]

  - id: SUB.09.t4
    skillId: SUB.09
    format: number-pad
    tier: pictorial
    representation: array
    generator: mul.groups
    params: { groups: { int: [2, 5] }, perGroup: { int: [2, 5] }, unknown: total }
    difficulty: { base: -0.7 }
    narration:
      prompt: tp.SUB.09.t4.prompt
      hints: [h.mul.see-rows, h.mul.count-by-rows]

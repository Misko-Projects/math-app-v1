# Fraction misconceptions (03 §7.2). K01 (#11) adds the rows its grade-1 skills track. K02 adds
# MC.fraction-part-to-part (FRA.02, FRA.03, FRA.09: FRA.01 names fractions in words and never
# answers [a, b]) and the grade 2–3 skills of these rows.
area: fractions
misconceptions:
  - id: MC.fraction-unequal-parts
    name: Calls unequal pieces halves or fourths, or an unequal share fair
    detect: { kind: answer, rule: fractionUnequalParts }
    appliesTo: { generators: [frac.partition, div.share, frac.shares] }
    skills: [FRA.01, FRA.03, FRA.07, FRA.16]
    remediation: [FRA.07]
    feedback: fb.mc.fraction-unequal-parts
    priority: 50
    parentTip: >-
      When you cut a sandwich or a pizza together, ask whether the pieces are the same size before
      you call them halves or fourths.
    examples:
      - params: { mode: cut, shape: circle, den: 4, num: 1 }
        response: { kind: state, value: { regions: [0.4, 0.2, 0.2, 0.2], shaded: [0] } }
        match: true
      - params: { mode: cut, shape: circle, den: 4, num: 1 }
        response: { kind: state, value: { regions: [0.5, 0.5], shaded: [0] } }
        match: false
      - generator: div.share
        params: { ask: fair-or-not, items: 6, recipients: 2, fair: false, shift: 1 }
        response: { kind: choice, id: "yes" }
        match: true
      - generator: div.share
        params: { ask: fair-or-not, items: 6, recipients: 2, fair: true, shift: 1 }
        response: { kind: choice, id: "no" }
        match: false

  - id: MC.fraction-bigger-denominator
    name: Thinks a whole cut into more parts has bigger parts
    detect: { kind: answer, rule: fractionBiggerDenominator }
    appliesTo: { generators: [frac.compare] }
    # K02 slice 5a: FRA.13 compares a/b with a/c (pictures, a sign, or an order).
    skills: [FRA.08, FRA.13]
    remediation: [FRA.08]
    feedback: fb.mc.fraction-bigger-denominator
    priority: 50
    parentTip: >-
      Cut one apple into two pieces and another into four, and let your child hold one piece of
      each to feel which is bigger.
    examples:
      - params: { shape: bar, den: 2, den2: 4 }
        response: { kind: choice, id: right }
        match: true
      - params: { shape: bar, den: 2, den2: 4 }
        response: { kind: choice, id: same }
        match: false

  # K02 slice 5a (#17): naming a fraction on two pads (frac.partition `name`) and comparing two
  # fractions with the same top number (frac.compare `sameNum` with symbols).
  - id: MC.fraction-part-to-part
    name: Names shaded parts against unshaded ones (3 of 8 as 3/5), or names the unshaded parts
    detect: { kind: answer, rule: fractionPartToPart }
    appliesTo: { generators: [frac.partition] }
    skills: [FRA.03, FRA.09]
    remediation: [FRA.03]
    feedback: fb.mc.fraction-part-to-part
    priority: 50
    parentTip: >-
      Cut a sandwich into four and eat one piece. Ask how many pieces the whole sandwich had: that
      is the bottom number, eaten or not.
    examples:
      - params: { mode: name, shape: rect, den: 8, num: 3 }
        response: { kind: numbers, values: [3, 5] }
        match: true
      - params: { mode: name, shape: rect, den: 8, num: 3 }
        response: { kind: numbers, values: [3, 8] }
        match: false

  - id: MC.fraction-swapped
    name: Puts the number of parts on top (3 of 8 shaded as 8/3)
    detect: { kind: answer, rule: fractionSwapped }
    appliesTo: { generators: [frac.partition] }
    skills: [FRA.03, FRA.09]
    remediation: [FRA.03]
    feedback: fb.mc.fraction-swapped
    priority: 40
    parentTip: >-
      Say a fraction aloud together: "three eighths" means three parts, each one of eight. The
      parts you have go on top.
    examples:
      - params: { mode: name, shape: rect, den: 8, num: 3 }
        response: { kind: numbers, values: [8, 3] }
        match: true
      - params: { mode: name, shape: rect, den: 8, num: 3 }
        response: { kind: numbers, values: [3, 8] }
        match: false

  - id: MC.fraction-compare-tops
    name: Calls two fractions equal because their top numbers match (2/3 = 2/8)
    detect: { kind: answer, rule: fractionCompareTops }
    appliesTo: { generators: [frac.compare] }
    skills: [FRA.13]
    remediation: [FRA.08]
    feedback: fb.mc.fraction-compare-tops
    priority: 40
    parentTip: >-
      Fold two same-size paper strips, one in thirds and one in eighths, and shade two parts of
      each. Same top number, but are they the same size?
    examples:
      - params: { kind: sameNum, symbols: true, shape: bar, num: 2, den: 3, den2: 8 }
        response: { kind: choice, id: same }
        match: true
      - params: { kind: sameNum, symbols: true, shape: bar, num: 2, den: 3, den2: 8 }
        response: { kind: choice, id: left }
        match: false

  # K02 slice 4c-2 (#17): equal shares that look different (FRA.16, frac.shares).

  - id: MC.equal-shares-look-alike
    name: Thinks equal shares must look alike (a longer part looks bigger)
    detect: { kind: answer, rule: equalSharesLookAlike }
    appliesTo: { generators: [frac.shares] }
    skills: [FRA.16, FRA.14]
    remediation: [FRA.02]
    feedback: fb.mc.equal-shares-look-alike
    priority: 50
    parentTip: >-
      Fold one paper square into two long strips and another into two small squares, and ask
      whether a strip and a small square are the same amount of paper.
    examples:
      # A 4 × 4 grid in two 2 × 2 squares and two bars of 4: equal shares, judged not equal.
      - params: { cut: 0, mirror: false, equalParts: true }
        response: { kind: choice, id: no }
        match: true
      - params: { cut: 0, mirror: false, equalParts: true }
        response: { kind: choice, id: yes }
        match: false

  - id: MC.share-counted-whole
    name: Counts every square of the whole for the squares in one share
    detect: { kind: answer, rule: shareCountedWhole }
    appliesTo: { generators: [frac.shares] }
    skills: [FRA.16]
    remediation: [FRA.02]
    feedback: fb.mc.share-counted-whole
    priority: 50
    parentTip: >-
      Cut a small grid of crackers into equal parts, and count the crackers in one part together.
    examples:
      # A 4 × 4 grid in fourths: 4 squares in each part; all 16 counted.
      - params: { cut: 0, mirror: false }
        response: { kind: number, value: 16 }
        match: true
      - params: { cut: 0, mirror: false }
        response: { kind: number, value: 4 }
        match: false

  # K02 slice 5b (#17): fractions on the number line (frac.line).
  - id: MC.fraction-line-ticks
    name: Counts tick marks instead of spaces on a number line
    detect: { kind: answer, rule: fractionLineTicks }
    appliesTo: { generators: [frac.line] }
    skills: [FRA.04, FRA.10, FRA.11]
    remediation: [FRA.04]
    feedback: fb.mc.fraction-line-ticks
    priority: 40
    parentTip: >-
      Draw a line from 0 to 1 and cut it into four equal jumps. Hop a finger along it: each hop is
      one fourth, and you count hops, not tick marks.
    examples:
      - params: { mode: place, skin: strip, den: 4, num: 1, max: 1 }
        response: { kind: placement, value: 0 }
        match: true
      - params: { mode: place, skin: strip, den: 4, num: 1, max: 1 }
        response: { kind: placement, value: 0.25 }
        match: false

  - id: MC.fraction-line-whole
    name: Takes the whole number line as one whole when it runs past 1
    detect: { kind: answer, rule: fractionLineWhole }
    appliesTo: { generators: [frac.line] }
    skills: [FRA.12, FRA.11]
    remediation: [FRA.10]
    feedback: fb.mc.fraction-line-whole
    priority: 40
    parentTip: >-
      On a line from 0 to 2, point to 0 and 1 together: that is one whole. The line holds two of
      them.
    examples:
      - params: { mode: place, skin: strip, den: 4, num: 4, max: 2 }
        response: { kind: placement, value: 2 }
        match: true
      - params: { mode: place, skin: strip, den: 4, num: 4, max: 2 }
        response: { kind: placement, value: 1 }
        match: false

  - id: MC.fraction-line-at-whole
    name: Puts a fraction at its top number (2/3 at 2) or a fraction less than 1 at 1
    detect: { kind: answer, rule: fractionLineAtWhole }
    appliesTo: { generators: [frac.line] }
    skills: [FRA.04, FRA.10, FRA.11]
    remediation: [FRA.04]
    feedback: fb.mc.fraction-line-at-whole
    priority: 30
    parentTip: >-
      Say the fraction as hops: "two thirds" is two hops, each one third, from 0. It never reaches
      2.
    examples:
      - params: { mode: place, skin: strip, den: 4, num: 1, max: 1 }
        response: { kind: placement, value: 1 }
        match: true
      - params: { mode: place, skin: strip, den: 4, num: 1, max: 1 }
        response: { kind: placement, value: 0.25 }
        match: false

  - id: MC.fraction-over-one
    name: Thinks a fraction cannot be more than 1 (puts 5/4 at 1/4)
    detect: { kind: answer, rule: fractionOverOne }
    appliesTo: { generators: [frac.line] }
    skills: [FRA.11]
    remediation: [FRA.10]
    feedback: fb.mc.fraction-over-one
    priority: 40
    parentTip: >-
      Count fourths out loud along a line past 1: one fourth, two fourths, three, four, five
      fourths. Five fourths is past the 1.
    examples:
      - params: { mode: place, skin: strip, den: 4, num: 5, max: 2 }
        response: { kind: placement, value: 0.25 }
        match: true
      - params: { mode: place, skin: strip, den: 4, num: 5, max: 2 }
        response: { kind: placement, value: 1.25 }
        match: false

  - id: MC.fraction-whole-count
    name: Takes four fourths for four (counts the parts, not the wholes)
    detect: { kind: answer, rule: fractionWholeCount }
    appliesTo: { generators: [frac.line] }
    skills: [FRA.12]
    remediation: [FRA.02]
    feedback: fb.mc.fraction-whole-count
    priority: 40
    parentTip: >-
      Cut a paper strip into four equal parts and put them back together: four fourths are one
      strip, one whole.
    examples:
      - params: { mode: place, skin: strip, den: 2, num: 2, max: 3 }
        response: { kind: placement, value: 2 }
        match: true
      - params: { mode: place, skin: strip, den: 2, num: 2, max: 3 }
        response: { kind: placement, value: 1 }
        match: false

  # K02 slice 5c (#17): two names for one amount (frac.equiv) and benchmarks (frac.compare).

  - id: MC.fraction-equiv-add
    name: Adds the same number to top and bottom (1/2 = 3/4)
    detect: { kind: answer, rule: fractionEquivAdd }
    appliesTo: { generators: [frac.equiv] }
    skills: [FRA.05, FRA.17]
    remediation: [FRA.09]
    feedback: fb.mc.fraction-equiv-add
    priority: 40
    parentTip: >-
      Fold a paper strip in half, shade one half, then fold it again. Count the fourths that are
      shaded: the amount did not change, but the parts did.
    examples:
      - params: { mode: pad, missing: num, picture: true, num: 1, den: 2, mult: 2 }
        response: { kind: number, value: 3 }
        match: true
      - params: { mode: pad, missing: num, picture: true, num: 1, den: 2, mult: 2 }
        response: { kind: number, value: 1 }
        match: false

  - id: MC.fraction-equiv-one-side
    name: Changes only the top or only the bottom number (1/2 = 1/4)
    detect: { kind: answer, rule: fractionEquivOneSide }
    appliesTo: { generators: [frac.equiv] }
    skills: [FRA.05, FRA.17]
    remediation: [FRA.09]
    feedback: fb.mc.fraction-equiv-one-side
    priority: 30
    parentTip: >-
      Cut each half of a sandwich into two. Now there are four parts, and two of them are the
      half you had: both numbers changed together.
    examples:
      - params: { mode: pad, missing: num, picture: true, num: 1, den: 2, mult: 2 }
        response: { kind: number, value: 1 }
        match: true
      - params: { mode: pad, missing: num, picture: true, num: 1, den: 2, mult: 2 }
        response: { kind: number, value: 3 }
        match: false

  - id: MC.fraction-bigger-numbers
    name: Thinks a fraction with bigger numbers (more parts) is bigger (4/8 > 1/2)
    detect: { kind: answer, rule: fractionBiggerNumbers }
    appliesTo: { generators: [frac.compare] }
    skills: [FRA.15]
    remediation: [FRA.06]
    feedback: fb.mc.fraction-bigger-numbers
    priority: 40
    parentTip: >-
      Shade four eighths of one paper strip and one half of another strip of the same size. Hold
      them side by side: the shading ends at the same place.
    examples:
      - params: { kind: benchmark, bench: half, symbols: true, shape: bar, num: 4, den: 8 }
        response: { kind: choice, id: left }
        match: true
      - params: { kind: benchmark, bench: half, symbols: true, shape: bar, num: 4, den: 8 }
        response: { kind: choice, id: same }
        match: false

  - id: MC.fraction-half-by-top
    name: Compares with one half by the top numbers (shaded parts) alone (3/8 > 1/2)
    detect: { kind: answer, rule: fractionHalfByTop }
    appliesTo: { generators: [frac.compare] }
    skills: [FRA.15]
    remediation: [FRA.06]
    feedback: fb.mc.fraction-half-by-top
    priority: 30
    parentTip: >-
      Ask how many eighths make one half (four). Three eighths is one fewer, so it is less than
      one half even though 3 is more than 1.
    examples:
      - params: { kind: benchmark, bench: half, symbols: true, shape: bar, num: 3, den: 8 }
        response: { kind: choice, id: left }
        match: true
      - params: { kind: benchmark, bench: half, symbols: true, shape: bar, num: 3, den: 8 }
        response: { kind: choice, id: right }
        match: false

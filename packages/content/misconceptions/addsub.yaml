# Addition and subtraction misconceptions (03 §7.2). K01 lists the K–1 skills authored so far;
# ADD.14, ADD.22 and the K02 MDA skills join these rows when they are authored (slice 2a: the
# grade-2 rows within 100 and the three column bugs; slice 2b: the rows within 1000 and
# MC.borrow-across-zero).
area: addsub
misconceptions:
  - id: MC.count-start-number
    name: Counts the starting number when counting on
    detect: { kind: answer, rule: countStartNumber }
    appliesTo: { generators: [addsub.facts] }
    skills: [ADD.03, ADD.04, ADD.15, ADD.27]
    remediation: [CNT.07, ADD.03]
    feedback: fb.mc.count-start-number
    priority: 60
    parentTip: >-
      When counting on from 5 to add 3, say "5" quietly and count "6, 7, 8" on three fingers.
    examples:
      - params: { a: 5, b: 3, op: "+", unknown: result }
        response: { kind: number, value: 7 }
        match: true
      - params: { a: 5, b: 3, op: "+", unknown: result }
        response: { kind: number, value: 9 }
        match: false

  - id: MC.count-all-instead
    name: Counts both groups from 1 instead of counting on
    detect: { kind: process, rule: countAllInstead }
    appliesTo: { generators: [addsub.facts, addsub.three] }
    skills: [ADD.03, ADD.06, ADD.08, ADD.13]
    remediation: [ADD.03]
    feedback: fb.mc.count-all-instead
    priority: 40
    parentTip: >-
      Hide the first group under a cup, say how many are inside, then count on from there.
    examples:
      - params: { a: 5, b: 3, op: "+", unknown: result }
        response: { kind: number, value: 8 }
        meta:
          latencyMs: 9000
          trace:
            - { t: tap, target: counter-0, ms: 0 }
            - { t: tap, target: counter-1, ms: 600 }
            - { t: tap, target: counter-2, ms: 1200 }
            - { t: tap, target: counter-3, ms: 1800 }
            - { t: tap, target: counter-4, ms: 2400 }
            - { t: tap, target: counter-5, ms: 3000 }
            - { t: tap, target: counter-6, ms: 3600 }
            - { t: tap, target: counter-7, ms: 4200 }
        match: true
      - params: { a: 5, b: 3, op: "+", unknown: result }
        response: { kind: number, value: 8 }
        meta:
          latencyMs: 4000
          trace:
            - { t: tap, target: counter-5, ms: 0 }
            - { t: tap, target: counter-6, ms: 600 }
            - { t: tap, target: counter-7, ms: 1200 }
        match: false
      # Three addends (ADD.13): every one of the 3 + 2 + 4 counters, from the first.
      - generator: addsub.three
        params: { a: 3, b: 2, c: 4 }
        response: { kind: number, value: 9 }
        meta:
          latencyMs: 9000
          trace:
            - { t: tap, target: counter-0, ms: 0 }
            - { t: tap, target: counter-1, ms: 500 }
            - { t: tap, target: counter-2, ms: 1000 }
            - { t: tap, target: counter-3, ms: 1500 }
            - { t: tap, target: counter-4, ms: 2000 }
            - { t: tap, target: counter-5, ms: 2500 }
            - { t: tap, target: counter-6, ms: 3000 }
            - { t: tap, target: counter-7, ms: 3500 }
            - { t: tap, target: counter-8, ms: 4000 }
        match: true
      - generator: addsub.three
        params: { a: 3, b: 2, c: 4 }
        response: { kind: number, value: 9 }
        meta:
          latencyMs: 4000
          trace:
            - { t: tap, target: counter-0, ms: 0 }
            - { t: tap, target: counter-1, ms: 500 }
            - { t: tap, target: counter-2, ms: 1000 }
            - { t: tap, target: counter-3, ms: 1500 }
            - { t: tap, target: counter-4, ms: 2000 }
        match: false

  - id: MC.forgot-the-ten
    name: Makes a ten, then leaves the ten out of the answer
    detect: { kind: answer, rule: forgotTheTen }
    appliesTo: { generators: [addsub.facts, addsub.three, mda.addsub] }
    skills: [ADD.08, ADD.13, ADD.26, MDA.08, ADD.14]
    remediation: [CPS.04, ADD.26]
    feedback: fb.mc.forgot-the-ten
    # Above MC.wrong-operation: on ADD.14, 7 + 5 → 2 is both (a + b − 10 = |a − b| when the
    # smaller addend is 5), and a sum within 20 is taught by making a ten.
    priority: 55
    parentTip: >-
      After making a ten, point to the full ten-frame and say "ten" before counting the ones left.
    examples:
      - params: { a: 8, b: 5, op: "+", unknown: result }
        response: { kind: number, value: 3 }
        match: true
      # 37 + 5 (MDA.08): the new ten made from the ones is left out, 32.
      - generator: mda.addsub
        params: { a: 37, b: 5, op: "+" }
        response: { kind: number, value: 32 }
        match: true
      - generator: mda.addsub
        params: { a: 37, b: 5, op: "+" }
        response: { kind: state, value: { hundreds: 0, tens: 4, ones: 2, value: 32 } }
        match: true
      # The mat left at 37 (nothing combined) with 32 typed shows no ten made and dropped.
      - generator: mda.addsub
        params: { a: 37, b: 5, op: "+" }
        response: { kind: state, value: { hundreds: 0, tens: 3, ones: 7, value: 32 } }
        match: false
      - generator: mda.addsub
        params: { a: 37, b: 5, op: "+" }
        response: { kind: number, value: 41 }
        match: false
      - params: { a: 8, b: 5, op: "+", unknown: result }
        response: { kind: number, value: 12 }
        match: false
      - params: { a: 8, b: 5, op: "+", unknown: result }
        response: { kind: number, value: 13 }
        match: false
      - generator: addsub.three
        params: { a: 7, b: 3, c: 5 }
        response: { kind: number, value: 5 }
        match: true

  - id: MC.wrong-operation
    name: Adds when the fact takes away, or takes away when it adds
    detect: { kind: answer, rule: wrongOperation }
    appliesTo: { generators: [addsub.facts, mda.addsub] }
    skills: [ADD.06, ADD.09, ADD.14, ADD.22, MDA.11, MDA.12]
    remediation: [ADD.09]
    feedback: fb.mc.wrong-operation
    parentTip: >-
      Before solving, have your child point to the sign and say "plus" or "take away" out loud.
    examples:
      - params: { a: 9, b: 4, op: "-", unknown: result }
        response: { kind: number, value: 13 }
        match: true
      - params: { a: 6, b: 3, op: "+", unknown: result }
        response: { kind: number, value: 3 }
        match: true
      - params: { a: 9, b: 4, op: "-", unknown: result }
        response: { kind: number, value: 4 }
        match: false

  - id: MC.keyword-more-means-add
    name: Adds whenever a story says "more", even when it takes away
    detect: { kind: answer, rule: keywordMoreMeansAdd }
    appliesTo: { generators: [story.addsub] }
    skills: [ADD.12, ADD.21]
    remediation: [ADD.21]
    feedback: fb.mc.keyword-more-means-add
    parentTip: >-
      Act the story out with two rows of objects, matching them up, before choosing to add or take away.
    examples:
      - params: { situation: compare/difference-more, context: beach-shells, a: 9, b: 3 }
        response: { kind: number, value: 12 }
        match: true
      - params: { situation: compare/smaller-more, context: beach-shells, a: 9, b: 3 }
        response: { kind: number, value: 12 }
        match: true
      - params: { situation: compare/difference-more, context: beach-shells, a: 9, b: 3 }
        response: { kind: number, value: 5 }
        match: false
      - params: { situation: compare/bigger-more, context: beach-shells, a: 9, b: 3 }
        response: { kind: number, value: 12 }
        match: false

  - id: MC.start-unknown-reversed
    name: With the start unknown, does the operation it sees instead of undoing it
    detect: { kind: answer, rule: startUnknownReversed }
    appliesTo: { generators: [equality.eq, story.addsub, addsub.facts] }
    skills: [ADD.11, ADD.12]
    remediation: [ADD.09, ADD.11]
    feedback: fb.mc.start-unknown-reversed
    priority: 55
    parentTip: >-
      Try the answer in the first box and read the whole sentence aloud to check that it is true.
    examples:
      - generator: equality.eq
        params: { form: _+b=c, mode: fill, op: "-", a: 8, b: 3 }
        response: { kind: number, value: 2 }
        match: true
      - generator: equality.eq
        params: { form: _+b=c, mode: fill, op: "+", a: 5, b: 3 }
        response: { kind: number, value: 11 }
        match: true
      - generator: equality.eq
        params: { form: _+b=c, mode: fill, op: "-", a: 8, b: 3 }
        response: { kind: number, value: 5 }
        match: false
      - generator: story.addsub
        params: { situation: take-from/start, context: beach-shells, a: 3, b: 5 }
        response: { kind: number, value: 2 }
        match: true

  # K02 slice 2a (#17): the column bugs of two-digit addition and subtraction.
  - id: MC.forgot-to-regroup-add
    name: Adds each column but leaves out the new ten the ones make
    detect: { kind: answer, rule: forgotToRegroupAdd }
    appliesTo: { generators: [mda.addsub] }
    skills: [MDA.03, MDA.04, MDA.05, MDA.07]
    remediation: [PV.12, MDA.03]
    feedback: fb.mc.forgot-to-regroup-add
    priority: 60
    parentTip: >-
      When the ones add up to ten or more, bundle ten of them and say "one more ten" out loud.
    examples:
      # 47 + 38: 7 + 8 = 15, the 1 ten is dropped, 75.
      - generator: mda.addsub
        params: { a: 47, b: 38, op: "+" }
        response: { kind: number, value: 75 }
        match: true
      - generator: mda.addsub
        params: { a: 47, b: 38, op: "+" }
        response: { kind: state, value: { hundreds: 0, tens: 8, ones: 5, value: 75 } }
        match: true
      - generator: mda.addsub
        params: { a: 47, b: 38, op: "+" }
        response: { kind: number, value: 85 }
        match: false
      # No carry: nothing is dropped, so 34 + 25 cannot show it.
      - generator: mda.addsub
        params: { a: 34, b: 25, op: "+" }
        response: { kind: number, value: 59 }
        match: false
      # 19 + 18 + 26: the ones make 23, the 2 tens are dropped, 43.
      - generator: mda.addsub
        params: { a: 19, b: 18, c: 26, op: "+", addends: 3 }
        response: { kind: number, value: 43 }
        match: true

  - id: MC.smaller-from-larger
    name: Takes the smaller digit from the larger in each column instead of splitting a ten
    detect: { kind: answer, rule: smallerFromLarger }
    appliesTo: { generators: [mda.addsub] }
    skills: [MDA.10, MDA.12, MDA.17, MDA.18, MDA.21]
    remediation: [PV.12, MDA.12]
    feedback: fb.mc.smaller-from-larger
    priority: 60
    parentTip: >-
      Ask "are there enough ones to take away?" before subtracting, and split a ten when there are not.
    examples:
      # 52 − 27: 7 − 2 in the ones, 35.
      - generator: mda.addsub
        params: { a: 52, b: 27, op: "-" }
        response: { kind: number, value: 35 }
        match: true
      # 42 − 5: 5 − 2 in the ones, 43.
      - generator: mda.addsub
        params: { a: 42, b: 5, op: "-" }
        response: { kind: number, value: 43 }
        match: true
      - generator: mda.addsub
        params: { a: 52, b: 27, op: "-" }
        response: { kind: number, value: 25 }
        match: false
      - generator: mda.addsub
        params: { a: 57, b: 22, op: "-" }
        response: { kind: number, value: 35 }
        match: false

  - id: MC.borrow-no-decrement
    name: Splits a ten for the ones but does not take it from the tens
    detect: { kind: answer, rule: borrowNoDecrement }
    appliesTo: { generators: [mda.addsub] }
    skills: [MDA.12, MDA.17, MDA.18, MDA.21]
    remediation: [PV.12, MDA.12]
    feedback: fb.mc.borrow-no-decrement
    priority: 55
    parentTip: >-
      After splitting a ten, cross it out in the tens and count the tens that are left.
    examples:
      # 53 − 27: 13 − 7 = 6 in the ones, but 5 − 2 = 3 in the tens, 36.
      - generator: mda.addsub
        params: { a: 53, b: 27, op: "-" }
        response: { kind: number, value: 36 }
        match: true
      - generator: mda.addsub
        params: { a: 53, b: 27, op: "-" }
        response: { kind: number, value: 26 }
        match: false
      - generator: mda.addsub
        params: { a: 58, b: 27, op: "-" }
        response: { kind: number, value: 31 }
        match: false

  # K02 slice 2b (#17): a borrow across a zero.
  - id: MC.borrow-across-zero
    name: Turns the zero into 9 but does not take one from the place before it
    detect: { kind: answer, rule: borrowAcrossZero }
    appliesTo: { generators: [mda.addsub] }
    skills: [MDA.18, MDA.17, MDA.21]
    remediation: [PV.16, MDA.18]
    feedback: fb.mc.borrow-across-zero
    priority: 58
    parentTip: >-
      Build 403 with disks. There are no tens to split, so split a hundred into ten tens first,
      then one ten into ten ones. Count the hundreds that are left.
    examples:
      # 403 − 127: 13 − 7 = 6, the 0 becomes 9 and 9 − 2 = 7, but 4 − 1 = 3 keeps all 4 hundreds.
      - generator: mda.addsub
        params: { a: 403, b: 127, op: "-" }
        response: { kind: number, value: 376 }
        match: true
      - generator: mda.addsub
        params: { a: 403, b: 127, op: "-" }
        response: { kind: number, value: 276 }
        match: false
      # 400 − 168: 10 − 8 = 2, 9 − 6 = 3, 4 − 1 = 3: 332 instead of 232.
      - generator: mda.addsub
        params: { a: 400, b: 168, op: "-" }
        response: { kind: number, value: 332 }
        match: true
      # No zero to borrow across: 453 − 127 cannot show it.
      - generator: mda.addsub
        params: { a: 453, b: 127, op: "-" }
        response: { kind: number, value: 326 }
        match: false

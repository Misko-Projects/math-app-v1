# Pattern and data misconceptions (03 §7.2). K01 (#11) adds MC.pattern-restart for the repeating
# patterns; K02 adds MC.graph-scale-ignored with the scaled graphs (DAT.06, DAT.07).
area: patterns-data
misconceptions:
  - id: MC.pattern-restart
    name: Starts a repeating pattern over instead of continuing it
    detect: { kind: state, rule: patternRestart }
    appliesTo: { generators: [pattern.repeat] }
    skills: [ALG.01, ALG.04]
    remediation: [ALG.04]
    feedback: fb.mc.pattern-restart
    priority: 50
    parentTip: >-
      Build a pattern with spoons and forks, then stop in the middle of a repeat and ask what comes
      next, saying the pattern aloud from the last one.
    examples:
      # shell fish shell fish shell, then two more: fish, shell. Starting over gives shell, fish.
      - params: { mode: extend, core: AB, shown: 5, ask: 2, theme: 0 }
        response: { kind: state, value: { tokens: [{ sprite: shell }, { sprite: fish }] } }
        match: true
      - params: { mode: extend, core: AB, shown: 5, ask: 2, theme: 0 }
        response: { kind: state, value: { tokens: [{ sprite: fish }, { sprite: shell }] } }
        match: false

  # K02 slice 4e (#17): grade 2 patterns and puzzles.
  - id: MC.grow-as-repeat
    name: Continues a growing pattern as if it repeated
    detect: { kind: state, rule: growAsRepeat }
    appliesTo: { generators: [pattern.grow] }
    skills: [ALG.10]
    remediation: [ALG.02]
    feedback: fb.mc.grow-as-repeat
    priority: 50
    parentTip: >-
      Build steps of 2, 4 and 6 blocks and ask how many the next step needs, counting what each
      step adds.
    examples:
      # Stacks of 2, 4 and 6 squares: starting over gives 2, the next step has 8.
      - params: { kind: shape, mode: extend, start: 2, step: 2, ask: 1 }
        response: { kind: state, value: { tokens: [{ tiles: 2 }] } }
        match: true
      - params: { kind: shape, mode: extend, start: 2, step: 2, ask: 1 }
        response: { kind: state, value: { tokens: [{ tiles: 8 }] } }
        match: false

  - id: MC.cage-repeat-digit
    name: Makes every cage add up but repeats a digit in a row or column
    detect: { kind: state, rule: cageRepeatDigit }
    appliesTo: { generators: [puzzle.grid] }
    skills: [PUZ.04]
    remediation: [PUZ.04]
    feedback: fb.mc.cage-repeat-digit
    priority: 50
    parentTip: >-
      Point along one row and say the numbers in it aloud: 1, 2 and 3 should each come once.
    examples:
      # Cages A (top left two) 3, B (top right column) 4, C (left column, lower two) 5, D 6.
      - params: { variant: cage-sum, square: 0, layout: 0, givens: 0 }
        response: { kind: state, value: { fill: [[2, 1, 3], [2, 2, 1], [3, 2, 2]] } }
        match: true
      - params: { variant: cage-sum, square: 0, layout: 0, givens: 0 }
        response: { kind: state, value: { fill: [[1, 2, 3], [2, 3, 1], [3, 1, 2]] } }
        match: false

  - id: MC.digit-order-reversed
    name: Puts the biggest digit last to make the biggest number
    detect: { kind: answer, rule: digitOrderReversed }
    appliesTo: { generators: [puzzle.grid] }
    skills: [PUZ.06]
    remediation: [PV.06]
    feedback: fb.mc.digit-order-reversed
    priority: 50
    parentTip: >-
      Write two numbers made from the same cards, like 47 and 74, and ask which is more and why.
    examples:
      # Cards 4, 7 and 2: the biggest number is 742; the biggest digit last gives 2, 4, 7.
      - params: { variant: digit-cards, count: 3, d1: 4, d2: 7, d3: 2, want: biggest }
        response: { kind: numbers, values: [2, 4, 7] }
        match: true
      - params: { variant: digit-cards, count: 3, d1: 4, d2: 7, d3: 2, want: biggest }
        response: { kind: numbers, values: [7, 4, 2] }
        match: false

  - id: MC.way-counted-twice
    name: Counts the same coins in another order as a new way to pay
    detect: { kind: state, rule: wayCountedTwice }
    appliesTo: { generators: [money.coins] }
    skills: [PUZ.09]
    remediation: [MON.05]
    feedback: fb.mc.way-counted-twice
    priority: 50
    parentTip: >-
      Lay out two dimes and a nickel, then swap them around: it is still the same coins, so the
      same way.
    examples:
      # 25 cents with dimes and nickels; two dimes and a nickel are already found.
      - params: { mode: ways, cents: 25, kinds: dn, found: 1 }
        response: { kind: state, value: { coins: { penny: 0, nickel: 1, dime: 2, quarter: 0 } } }
        match: true
      - params: { mode: ways, cents: 25, kinds: dn, found: 1 }
        response: { kind: state, value: { coins: { penny: 0, nickel: 3, dime: 1, quarter: 0 } } }
        match: false

  # K02 slice 4c-1 (#17): line plot reading (DAT.03). The examples run on DAT.03.t1 (how-many):
  # 3 planks are 15 inches long; the stacks beside it hold 2 and 1.
  - id: MC.lineplot-position-as-count
    name: Reads the number under a stack of Xs as how many there are
    detect: { kind: answer, rule: linePlotPositionAsCount }
    appliesTo: { generators: [data.lineplot] }
    skills: [DAT.03]
    remediation: [DAT.03]
    feedback: fb.mc.lineplot-position-as-count
    priority: 50
    parentTip: >-
      Put three spoons above a card that says 6. Ask how many spoons there are: the card says
      how long, the spoons say how many.
    examples:
      - params:
          {
            question: how-many,
            min: 14,
            positions: 5,
            precision: 1,
            x1: 2,
            x2: 3,
            x3: 1,
            x4: 4,
            x5: 1,
            at: 2,
          }
        response: { kind: number, value: 15 }
        match: true
      - params:
          {
            question: how-many,
            min: 14,
            positions: 5,
            precision: 1,
            x1: 2,
            x2: 3,
            x3: 1,
            x4: 4,
            x5: 1,
            at: 2,
          }
        response: { kind: number, value: 3 }
        match: false

  - id: MC.lineplot-wrong-stack
    name: Counts the Xs above the mark next to the one asked about
    detect: { kind: answer, rule: linePlotWrongStack }
    appliesTo: { generators: [data.lineplot] }
    skills: [DAT.03]
    remediation: [DAT.03]
    feedback: fb.mc.lineplot-wrong-stack
    priority: 40
    parentTip: >-
      Point at the number first, then slide your finger straight up and count only what is above
      it.
    examples:
      - params:
          {
            question: how-many,
            min: 14,
            positions: 5,
            precision: 1,
            x1: 2,
            x2: 3,
            x3: 1,
            x4: 4,
            x5: 1,
            at: 2,
          }
        response: { kind: number, value: 1 }
        match: true
      - params:
          {
            question: how-many,
            min: 14,
            positions: 5,
            precision: 1,
            x1: 2,
            x2: 3,
            x3: 1,
            x4: 4,
            x5: 1,
            at: 2,
          }
        response: { kind: number, value: 4 }
        match: false

  # K02 slice 4c-2 (#17): input–output machines (ALG.09, alg.function tables).
  - id: MC.function-column-pattern
    name: Continues the Out numbers as a pattern instead of using the machine
    detect: { kind: answer, rule: functionColumnPattern }
    appliesTo: { generators: [alg.function] }
    skills: [ALG.09]
    remediation: [ALG.02]
    feedback: fb.mc.function-column-pattern
    priority: 52
    parentTip: >-
      Play "number machine": you secretly add 3 to every number your child says, out of order,
      and they guess your rule from what comes out.
    examples:
      # Add 3: 16 → 19, 1 → 4, 9 → 12, then 2 → 5. The Outs 4, 12 read as a pattern give 20.
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 0, arrange: 1 }
        response: { kind: numbers, values: [20] }
        match: true
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 0, arrange: 1 }
        response: { kind: numbers, values: [5] }
        match: false

  - id: MC.function-first-pair-double
    name: Takes a rule from the first pair only (doubling)
    detect: { kind: answer, rule: functionFirstPairDouble }
    appliesTo: { generators: [alg.function] }
    skills: [ALG.09]
    remediation: [ALG.09]
    feedback: fb.mc.function-first-pair-double
    priority: 53
    parentTip: >-
      When a rule fits one pair, ask your child to try it on a second pair before using it.
    examples:
      # Add 3: 3 → 6 also doubles, but 16 → 19 does not; 9 doubled gives 18, not 12.
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 1, arrange: 1 }
        response: { kind: numbers, values: [18] }
        match: true
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 1, arrange: 1 }
        response: { kind: numbers, values: [12] }
        match: false

  - id: MC.function-backwards
    name: Runs an adding machine backwards (takes away)
    detect: { kind: answer, rule: functionBackwards }
    appliesTo: { generators: [alg.function] }
    skills: [ALG.09]
    remediation: [ADD.11]
    feedback: fb.mc.function-backwards
    priority: 51
    parentTip: >-
      Ask whether each Out is bigger or smaller than its In before deciding what the machine does.
    examples:
      # Add 3, asked for 9: 9 take away 3 gives 6.
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 1, arrange: 1 }
        response: { kind: numbers, values: [6] }
        match: true
      - params: { op: add, n: 3, max: 20, rows: 4, blanks: 1, lure: 1, arrange: 1 }
        response: { kind: numbers, values: [12] }
        match: false

  - id: MC.function-add-for-take
    name: Adds where the machine takes away
    detect: { kind: answer, rule: functionAddForTake }
    appliesTo: { generators: [alg.function] }
    skills: [ALG.09]
    remediation: [ADD.11]
    feedback: fb.mc.function-add-for-take
    priority: 51
    parentTip: >-
      Ask whether each Out is bigger or smaller than its In before deciding what the machine does.
    examples:
      # Take away 7, asked for 26 and 23: adding 7 gives 33 and 30.
      - params: { op: sub, n: 7, max: 60, rows: 4, blanks: 2, lure: 0, arrange: 1 }
        response: { kind: numbers, values: [33, 30] }
        match: true
      - params: { op: sub, n: 7, max: 60, rows: 4, blanks: 2, lure: 0, arrange: 1 }
        response: { kind: numbers, values: [19, 16] }
        match: false

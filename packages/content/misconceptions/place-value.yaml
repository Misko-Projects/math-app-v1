# Place-value misconceptions (03 §7.2). Skills list the catalog skills authored so far. K02 slice
# 1a (#17) added the grade-2 skills to 1000 and the entries MC.zero-placeholder and
# MC.compare-first-digit. Still to join: PV.20 (MC.write-as-spoken), MDA.18 (MC.zero-placeholder),
# CMP.10 (MC.compare-first-digit) and the rounding entries, with their skills.
area: place-value
misconceptions:
  - id: MC.place-swap
    name: Swaps the tens and the ones (34 written as 43)
    detect: { kind: answer, rule: placeSwap }
    appliesTo: { generators: [pv.number] }
    skills: [PV.01, PV.13, PV.15]
    remediation: [PV.01]
    feedback: fb.mc.place-swap
    # Below MC.teen-reversal: 41 written as 14 is both, and the teen word is the cause.
    priority: 45
    parentTip: >-
      Build the number together with bundles of ten and single sticks, then say it: the bundles
      are the first number, the single sticks the last.
    examples:
      # 34 built as 4 tens and 3 ones (PV.01 bundles).
      - params: { n: 34 }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 4, ones: 3 } }
        match: true
      - params: { n: 34 }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 3, ones: 4 } }
        match: false
      - params: { n: 34 }
        response: { kind: number, value: 43 }
        match: true
      # 345 built as 3 hundreds 5 tens 4 ones (PV.15): the hundreds stay, the tens and ones swap.
      - params: { n: 345, mode: build }
        response: { kind: state, value: { thousands: 0, hundreds: 3, tens: 5, ones: 4 } }
        match: true
      - params: { n: 345, mode: build }
        response: { kind: state, value: { thousands: 0, hundreds: 5, tens: 4, ones: 3 } }
        match: false
      # 30 swapped would start with 0: nothing to tell apart.
      - params: { n: 30 }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 0, ones: 3 } }
        match: false

  - id: MC.face-value
    name: Counts each digit as ones (3 tens 4 ones as 7)
    detect: { kind: answer, rule: faceValue }
    appliesTo: { generators: [pv.number] }
    skills: [PV.01, PV.15, PV.24]
    remediation: [PV.09, PV.01]
    feedback: fb.mc.face-value
    priority: 50
    parentTip: >-
      Count a bundle of ten sticks out loud together, then count by tens over the bundles: each
      bundle is ten, not one.
    examples:
      # 34 built with 7 ones.
      - params: { n: 34 }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 0, ones: 7 } }
        match: true
      - params: { n: 34 }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 2, ones: 14 } }
        match: false
      - params: { n: 34 }
        response: { kind: number, value: 7 }
        match: true
      - params: { n: 34 }
        response: { kind: number, value: 8 }
        match: false
      # The 4 in 345 put in as 4 ones beside the 3 hundreds and 5 ones on the mat (PV.24); 4 tens
      # is right, and not a match.
      - params: { n: 345, mode: digit-value, place: 1 }
        response: { kind: state, value: { thousands: 0, hundreds: 3, tens: 0, ones: 9 } }
        match: true
      - params: { n: 345, mode: digit-value, place: 1 }
        response: { kind: state, value: { thousands: 0, hundreds: 3, tens: 4, ones: 5 } }
        match: false

  # No predict (03 §7.1): the written-as-spoken number (407 for 47) is never a possible option of a
  # two-digit pick, so the rule only tags typed answers.
  - id: MC.write-as-spoken
    name: Writes the number the way it sounds (forty-seven as 407)
    detect: { kind: answer, rule: writeAsSpoken }
    appliesTo: { generators: [pv.number] }
    skills: [PV.05, PV.13, PV.14]
    remediation: [PV.15, PV.13]
    feedback: fb.mc.write-as-spoken
    priority: 50
    parentTip: >-
      Write 40 and 7 on two cards, then slide the 7 on top of the zero: forty-seven needs only two
      digits.
    examples:
      # 40 + 7 written as 407 (PV.13, the expanded form to the number).
      - params: { n: 47 }
        response: { kind: number, value: 407 }
        match: true
      - params: { n: 47 }
        response: { kind: number, value: 74 }
        match: false
      - params: { n: 14 }
        response: { kind: number, value: 104 }
        match: false
      # 3 hundreds and 5 ones read off the mat and written as 3005 (PV.05), and as 35, which is
      # the missing zero and not this.
      - params: { n: 305, mode: read }
        response: { kind: number, value: 3005 }
        match: true
      - params: { n: 305, mode: read }
        response: { kind: number, value: 35 }
        match: false

  - id: MC.zero-placeholder
    name: Leaves out the zero that holds a place (305 written as 35)
    detect: { kind: answer, rule: zeroPlaceholder }
    appliesTo: { generators: [pv.number] }
    skills: [PV.05, PV.14, PV.15]
    remediation: [PV.14]
    feedback: fb.mc.zero-placeholder
    priority: 50
    parentTip: >-
      Write the number in a chart with hundreds, tens and ones columns: a column with nothing in it
      still gets a zero.
    examples:
      - params: { n: 305, mode: read }
        response: { kind: number, value: 35 }
        match: true
      - params: { n: 305, mode: read }
        response: { kind: number, value: 350 }
        match: false
      # 305 built with 3 tens and 5 ones.
      - params: { n: 305, mode: build }
        response: { kind: state, value: { thousands: 0, hundreds: 0, tens: 3, ones: 5 } }
        match: true
      # A zero at the end is not inside the number: 340 as 34 is another slip.
      - params: { n: 340, mode: read }
        response: { kind: number, value: 34 }
        match: false

  - id: MC.compare-first-digit
    name: Compares by the first digit, not by how many digits (89 greater than 102)
    detect: { kind: answer, rule: compareFirstDigit }
    appliesTo: { generators: [compare.numbers] }
    # PV.02 (03 §7.2) compares two-digit numbers only, so no item of it can show the slip: it
    # joins when a template of it mixes digit counts.
    skills: [PV.06, PV.17]
    remediation: [PV.15, PV.06]
    feedback: fb.mc.compare-first-digit
    # Above MC.symbol-reversed: 89 > 102 is both, and the digit count is the cause.
    priority: 55
    parentTip: >-
      Before comparing, count the digits together: a number with three digits is always greater
      than a number with two.
    examples:
      - params: { a: 89, b: 102, extra: 0, min: 60, max: 140, ask: more }
        response: { kind: choice, id: left }
        match: true
      - params: { a: 89, b: 102, extra: 0, min: 60, max: 140, ask: more }
        response: { kind: choice, id: same }
        match: false
      # Both have three digits: nothing to tell apart.
      - params: { a: 189, b: 202, extra: 0, min: 60, max: 240, ask: more }
        response: { kind: choice, id: left }
        match: false
      # Smallest first: 102, 89, 95 is the order of the first digits.
      - params: { a: 89, b: 102, extra: 1, x1: 95, min: 60, max: 140, ask: fewer }
        response: { kind: numbers, values: [102, 89, 95] }
        match: true
      - params: { a: 89, b: 102, extra: 1, x1: 95, min: 60, max: 140, ask: fewer }
        response: { kind: numbers, values: [95, 89, 102] }
        match: false

  # K02 (#17) slice 1b: rounding (PV.08, PV.18). The examples run on PV.08.t1 and PV.18.t1, the
  # pv.round number pads (47 → 50, 347 → 300).
  - id: MC.round-down-always
    name: Always rounds down (47 to 40)
    detect: { kind: answer, rule: roundDownAlways }
    appliesTo: { generators: [pv.round] }
    skills: [PV.08, PV.18]
    remediation: [CMP.12]
    feedback: fb.mc.round-down-always
    priority: 50
    parentTip: >-
      Draw a short line from 40 to 50 and mark 45 in the middle. Numbers past the middle are
      closer to 50, so they round up.
    examples:
      - params: { n: 47, place: 10 }
        response: { kind: number, value: 40 }
        match: true
      - params: { n: 47, place: 10 }
        response: { kind: number, value: 30 }
        match: false
      # 43 rounds down: the answer itself is 40.
      - params: { n: 43, place: 10 }
        response: { kind: number, value: 40 }
        match: false
      # In the middle rounds up too.
      - params: { n: 45, place: 10 }
        response: { kind: number, value: 40 }
        match: true

  - id: MC.round-wrong-place
    name: Rounds to the wrong place (347 to the nearest hundred as 350)
    detect: { kind: answer, rule: roundWrongPlace }
    appliesTo: { generators: [pv.round] }
    skills: [PV.18]
    remediation: [PV.08, PV.18]
    feedback: fb.mc.round-wrong-place
    priority: 50
    parentTip: >-
      Say the two hundreds the number is between before rounding: 347 is between 300 and 400.
    examples:
      - params: { n: 347, place: 100 }
        response: { kind: number, value: 350 }
        match: true
      - params: { n: 347, place: 100 }
        response: { kind: number, value: 400 }
        match: false
      # 302 rounded to the ten is 300, the answer: nothing to tell apart.
      - params: { n: 302, place: 100 }
        response: { kind: number, value: 400 }
        match: false

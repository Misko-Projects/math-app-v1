# Multiplication and division misconceptions (03 §7.2). K01 (#11) adds MC.unequal-share for its
# grade-1 sharing skill; K02 adds the grade 2–3 rows and skills (MUL.01, MUL.05).
area: multdiv
misconceptions:
  - id: MC.unequal-share
    name: Deals shares unequally, or keeps a leftover big enough for another round
    detect: { kind: state, rule: unequalShare }
    appliesTo: { generators: [div.share] }
    skills: [MUL.12, MUL.01, MUL.05]
    remediation: [MUL.12]
    feedback: fb.mc.unequal-share
    priority: 50
    parentTip: >-
      When sharing snacks, deal them out one at a time, "one for you, one for me", and stop only
      when there are too few left to go round again.
    examples:
      - params: { ask: each, items: 6, recipients: 2 }
        response: { kind: state, value: { shares: [4, 2], leftover: 0, value: 4 } }
        match: true
      - params: { ask: each, items: 6, recipients: 2 }
        response: { kind: state, value: { shares: [2, 2], leftover: 2, value: 2 } }
        match: true
      - params: { ask: each, items: 6, recipients: 2 }
        response: { kind: state, value: { shares: [3, 3], leftover: 0, value: 4 } }
        match: false

  # K02 (#17) slice 3a: the two equal-groups rows of the 03 §7.2 table.
  - id: MC.add-instead-of-multiply
    name: Adds the two numbers instead of finding the total of the equal groups
    detect: { kind: answer, rule: addInsteadOfMultiply }
    appliesTo: { generators: [mul.groups, mul.facts, mul.tens] }
    skills: [MUL.04, MUL.06, MUL.11, MUL.13, MUL.09, MUL.10]
    remediation: [MUL.02, MUL.04]
    feedback: fb.mc.add-instead-of-multiply
    priority: 50
    parentTip: >-
      Make 4 piles of 3 spoons together and count them all. "4 groups of 3" is 12, not 4 and 3.
    examples:
      - params: { groups: 4, perGroup: 3, unknown: total, mode: build }
        response: { kind: state, value: { groups: [3, 3, 3, 3], value: 7 } }
        match: true
      - params: { groups: 4, perGroup: 3, unknown: total, mode: build }
        response: { kind: state, value: { groups: [3, 3, 3, 3], value: 11 } }
        match: false

  - id: MC.skip-count-slip
    name: Skip-counts one group too few or too many
    detect: { kind: answer, rule: skipCountSlip }
    appliesTo: { generators: [mul.groups, mul.facts] }
    skills: [MUL.02, MUL.13, MUL.14, MUL.15, MUL.09]
    remediation: [MUL.02]
    feedback: fb.mc.skip-count-slip
    priority: 40
    parentTip: >-
      When counting by fives or tens, touch one group for each number you say, so none is skipped.
    examples:
      - params: { groups: 4, perGroup: 5, unknown: total, mode: read }
        response: { kind: number, value: 15 }
        match: true
      - params: { groups: 4, perGroup: 5, unknown: total, mode: read }
        response: { kind: number, value: 25 }
        match: true
      - params: { groups: 4, perGroup: 5, unknown: total, mode: read }
        response: { kind: number, value: 9 }
        match: false

  # K02 (#17) slice 3b: facts and strategies. MC.times-zero-keeps and MC.double-once are not in
  # the 03 §7.2 table before this slice; the table gains them in the same PR.
  - id: MC.times-zero-keeps
    name: Gives the other factor when one factor is 0
    detect: { kind: answer, rule: timesZeroKeeps }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.06]
    remediation: [MUL.06]
    feedback: fb.mc.times-zero-keeps
    priority: 55
    parentTip: >-
      Put out 4 empty bowls: 4 groups of 0 is 0. Then 0 groups of 7 is nothing at all, so also 0.
    examples:
      - params: { a: 7, b: 0, family: x0x1 }
        response: { kind: number, value: 7 }
        match: true
      - params: { a: 7, b: 0, family: x0x1 }
        response: { kind: number, value: 1 }
        match: false

  - id: MC.double-once
    name: Doubles only once when timesing by 4 or 8
    detect: { kind: answer, rule: doubleOnce }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.14]
    remediation: [MUL.14]
    feedback: fb.mc.double-once
    priority: 45
    parentTip: >-
      Times 4 is double, then double again: 4 × 6 is 6 + 6 = 12, and 12 + 12 = 24.
    examples:
      - params: { a: 4, b: 7, family: x4, strategy: double }
        response: { kind: numbers, values: [14, 14, 14] }
        match: true
      - params: { a: 4, b: 7, family: x4, strategy: double }
        response: { kind: numbers, values: [14, 14, 21] }
        match: false

  - id: MC.tens-dropped
    name: Drops the zero when timesing by a multiple of ten
    detect: { kind: answer, rule: tensDropped }
    appliesTo: { generators: [mul.tens] }
    skills: [MUL.11]
    remediation: [PV.10, MUL.11]
    feedback: fb.mc.tens-dropped
    priority: 50
    parentTip: >-
      Say it in tens: 4 × 30 is 4 × 3 tens, which is 12 tens. Twelve tens is 120, not 12.
    examples:
      - params: { a: 4, b: 30, steps: true }
        response: { kind: numbers, values: [12, 12] }
        match: true
      - params: { a: 4, b: 30, steps: true }
        response: { kind: numbers, values: [12, 34] }
        match: false

  - id: MC.partial-product-dropped
    name: Gives one part of a broken-apart fact as the total
    detect: { kind: answer, rule: partialProductDropped }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.07]
    remediation: [MUL.07]
    feedback: fb.mc.partial-product-dropped
    priority: 50
    parentTip: >-
      Split 7 rows of 6 into 5 rows and 2 rows. Find both parts, then add them: 30 + 12 = 42.
    examples:
      - params: { a: 7, b: 6, strategy: break-apart }
        response: { kind: numbers, values: [30, 12, 30] }
        match: true
      - params: { a: 7, b: 6, strategy: break-apart }
        response: { kind: numbers, values: [30, 12, 41] }
        match: false

  # K02 (#17) slice 3c: division facts and missing factors (mul.facts op ÷, unknown factor or
  # dividend; MUL.10's story pads are the same items). New rows of the 03 §7.2 table.
  - id: MC.multiply-instead-of-divide
    name: Multiplies the two numbers it sees where the sentence or story divides or a factor is missing
    detect: { kind: answer, rule: multiplyInsteadOfDivide }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.08, MUL.17, MUL.18, MUL.21, MUL.10]
    remediation: [MUL.08]
    feedback: fb.mc.multiply-instead-of-divide
    priority: 50
    parentTip: >-
      Share 12 grapes onto 3 plates. Ask: did the number on each plate get bigger than 12? Sharing
      a total among two or more plates gives each plate less than the total.
    examples:
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 96 }
        match: true
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 7 }
        match: false

  - id: MC.told-number-back
    name: Gives back a number the sentence already tells (the divisor, the dividend, or the product for a missing factor)
    detect: { kind: answer, rule: toldNumberBack }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.08, MUL.17, MUL.18, MUL.21, MUL.10]
    remediation: [MUL.08]
    feedback: fb.mc.told-number-back
    priority: 45
    parentTip: >-
      Cover the missing number with a finger and read the fact aloud: "4 times what is 24?" The
      answer is the number under your finger, not one you can already see.
    examples:
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 4 }
        match: true
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 24 }
        match: true
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 5 }
        match: false

  - id: MC.neighbour-fact
    name: Gives the answer of the next fact up or down (24 ÷ 4 → 5 or 7)
    detect: { kind: answer, rule: neighbourFact }
    appliesTo: { generators: [mul.facts] }
    skills: [MUL.08, MUL.17, MUL.18, MUL.21]
    remediation: [MUL.08]
    feedback: fb.mc.neighbour-fact
    priority: 40
    parentTip: >-
      Check a divide fact with its times fact: 4 times 7 is 28, not 24, so 24 divided by 4 is not 7.
    examples:
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 7 }
        match: true
      - params: { a: 4, b: 6, op: "÷", unknown: result }
        response: { kind: number, value: 9 }
        match: false

# Authored lessons (03 §4.5, §6). Skills without an entry get an auto lesson (03 §6.4).
strand: CNT
lessons:
  - skillId: CNT.03
    mode: authored
    templateId: CNT.03.t1
    worked:
      - params: { n: 5, mode: how-many, layout: line }
        steps:
          - actor: demo
            say: ls.CNT.03.w1.s1
            action: { op: tap, args: { index: 0 } }
          - actor: demo
            say: ls.CNT.03.w1.s2
            vars: { n: 5 }
            action: { op: count-aloud, args: { upTo: 5 } }
          - actor: demo
            say: ls.CNT.03.w1.s3
            vars: { n: 5 }
            action: { op: say-total }
    faded:
      - params: { n: 6, mode: how-many, layout: line }
        childSteps: 1
      - params: { n: 8, mode: how-many, layout: scatter }
        childSteps: 2
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3 }
    outro: ls.CNT.03.outro

  # Gateway (03 §6.4): one more on the boat, then the same idea on a ten-frame.
  - skillId: CNT.14
    mode: authored
    templateId: CNT.14.t1
    worked:
      - params: { n: 6, start: 5, mode: add-more }
        steps:
          - actor: demo
            say: ls.CNT.14.w1.s1
            vars: { start: 5 }
            action: { op: count-aloud }
          - actor: demo
            say: ls.CNT.14.w1.s2
            action: { op: drag, args: { count: 1 } }
          - actor: demo
            say: ls.CNT.14.w1.s3
            vars: { start: 5, n: 6 }
            action: { op: close-container }
    # Authored faded steps: the generator's solutions put the extra one in before the child's
    # turn, so with them the child would only close the boat or name a total already built. Here
    # the one-more move is always the child's (03 §6.2).
    faded:
      - params: { n: 4, start: 3, mode: add-more }
        steps:
          - actor: demo
            say: ls.CNT.14.f1.s1
            vars: { start: 3 }
            action: { op: count-aloud }
          - actor: child
            say: ls.CNT.14.f1.s2
            action: { op: drag, args: { count: 1 } }
            expect: { answer: true }
        childSteps: 1
      - templateId: CNT.14.t2
        params: { n: 8, start: 7, mode: add-more }
        steps:
          - actor: demo
            say: ls.CNT.14.f2.s1
            vars: { start: 7 }
            action: { op: highlight, args: { target: frame-0 } }
          - actor: child
            say: ls.CNT.14.f2.s2
            action: { op: place, args: { frame: 0, count: 1, color: b } }
            expect: { op: place }
          - actor: child
            say: ls.CNT.14.f2.s3
            action: { op: count-total }
            expect: { answer: true }
        childSteps: 2
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3 }
    outro: ls.CNT.14.outro

  # CNT.15 is authored only to pin its test-out pool (03 §6.5). The compiler reads answer kinds
  # from formats, and tap-count can answer either way, so its own pool would mix the tap-count
  # ordinal items (choice answers) with CNT.15.t4 (a typed place number). CNT.15.t5 (the place just
  # after, typed) joins it, so the test-out spans the pictorial and abstract tiers. The examples are
  # what the auto lesson would play: generator solutions on the concrete template.
  - skillId: CNT.15
    mode: authored
    templateId: CNT.15.t1
    worked:
      - params: { k: 3, n: 6, from: left }
    faded:
      - params: { k: 5, n: 7, from: left }
        childSteps: 1
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [CNT.15.t4, CNT.15.t5] }

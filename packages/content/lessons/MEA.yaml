# Authored lessons (03 §4.5, §6). Skills without an entry get an auto lesson (03 §6.4).
strand: MEA
lessons:
  # These lessons only pin the test-out pool (03 §6.5) to each skill's pictorial constructed-answer
  # template (04 §7a). The compiler reads answer kinds from formats, and shape-sort and
  # measure-length can also answer with a choice, so the auto pool would mix them with the compare
  # (choice) template. The examples are exactly what the auto lesson plays: the same seeds and
  # targets on the concrete template.
  - skillId: MEA.15
    mode: authored
    templateId: MEA.15.t1
    worked:
      - { seed: 1899677662, target: easy }
    faded:
      - { seed: 1899677663, target: typical, childSteps: 1 }
      - { seed: 1899677664, target: typical, childSteps: 2 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [MEA.15.t4] }

  - skillId: MEA.22
    mode: authored
    templateId: MEA.22.t1
    worked:
      - { seed: 1513939520, target: easy }
    faded:
      - { seed: 1513939521, target: typical, childSteps: 1 }
      - { seed: 1513939522, target: typical, childSteps: 2 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [MEA.22.t3] }

  # K02 slice 4b (#17): MEA.03 plays the ruler from 0 (t2), not the laid tiles the auto lesson would
  # pick (t1, the first concrete template): the skill is reading a ruler.
  - skillId: MEA.03
    mode: authored
    templateId: MEA.03.t2
    worked:
      - { seed: 3031, target: easy }
    faded:
      - { seed: 3032, target: typical, childSteps: 1 }
      - { seed: 3033, target: typical, childSteps: 1 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3 }

  # K02 slice 4c-1 (#17): MEA.08 plays the unit sort (things a child knows the size of); its
  # test-out draws the pictorial sort (constructed), never the estimate picks (03 §6.5).
  - skillId: MEA.08
    mode: authored
    templateId: MEA.08.t1
    worked:
      - { seed: 4081, target: easy }
    faded:
      - { seed: 4082, target: typical, childSteps: 1 }
      - { seed: 4083, target: typical, childSteps: 2 }

  # PV.04 (gateway): ten bundles of ten are tied into one hundred. The second faded example goes
  # the other way on the mat: one hundred is split into ten tens. Both solutions have two steps,
  # so the child does the last one each time. The test-out pool is the compiler's (03 §6.5).
  - skillId: PV.04
    mode: authored
    templateId: PV.04.t1
    worked:
      - params: { n: 100, from: regrouped, to: canonical, places: 3 }
        steps:
          - actor: demo
            say: ls.PV.04.w1.s1
            action: { op: count-by, args: { kind: tens } }
          - actor: demo
            say: ls.PV.04.w1.s2
            action: { op: fuse, args: { kind: tens } }
          - actor: demo
            say: ls.PV.04.w1.s3
            action: { op: count-by, args: { kind: hundreds } }
    faded:
      - templateId: PV.04.t1
        params: { n: 300, from: regrouped, to: canonical, places: 3 }
        childSteps: 1
      - templateId: PV.04.t2
        params: { n: 200, from: canonical, to: regrouped, places: 3 }
        childSteps: 1
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3 }
    outro: ls.PV.04.outro


            action: { op: count-by, args: { kind: tens } }
    faded:
      - templateId: PV.09.t2
        params: { n: 26, from: ones, to: canonical }
        childSteps: 1
      - templateId: PV.09.t2
        params: { n: 32, from: ones, to: canonical }

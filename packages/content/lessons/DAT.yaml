# Authored lessons (03 §4.5, §6). Skills without an entry get an auto lesson (03 §6.4).
strand: DAT
lessons:
  # These lessons only pin the test-out pool (03 §6.5) to each skill's pictorial constructed-answer
  # templates (04 §7a). bar-graph-read can answer a number or a choice, so the compiler's pool would
  # mix the most / least (choice) template in. The examples are exactly what the auto lesson plays:
  # the same seeds and targets on the same template.
  - skillId: DAT.02
    mode: authored
    templateId: DAT.02.t1
    worked:
      - { seed: 1988461758, target: easy }
    faded:
      - { seed: 1988461759, target: typical, childSteps: 1 }
      - { seed: 1988461760, target: typical, childSteps: 2 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [DAT.02.t1, DAT.02.t2, DAT.02.t5] }

  - skillId: DAT.09
    mode: authored
    templateId: DAT.09.t1
    worked:
      - { seed: 1837463187, target: easy }
    faded:
      - { seed: 1837463188, target: typical, childSteps: 1 }
      - { seed: 1837463189, target: typical, childSteps: 2 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [DAT.09.t2, DAT.09.t4] }

  # DAT.10 has no sort-only template (sorting is DAT.01, PR #84 review): its lesson plays the
  # picture-graph count (t1), the template the auto lesson would pick, and the test-out counts (t1)
  # and orders (t3) the groups.
  - skillId: DAT.10
    mode: authored
    templateId: DAT.10.t1
    worked:
      - { seed: 4203254561, target: easy }
    faded:
      - { seed: 4203254562, target: typical, childSteps: 1 }
      - { seed: 4203254563, target: typical, childSteps: 2 }
    scaffolded: { count: 2, hintStart: 2 }
    testOut: { items: 3, minCorrect: 3, templateIds: [DAT.10.t1, DAT.10.t3] }


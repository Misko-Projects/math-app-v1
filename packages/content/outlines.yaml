# Shape outlines for the geo.compose generator (03 §5.6): GEO.10, GEO.11 and PUZ.03.
# The engine table packages/engine/src/generators/geo/outlines.ts is the source of each outline's
# geometry and reference tiling; packages/engine/src/generators/geo/outlines.test.ts keeps this file
# in step with it (ids, points to 6 decimals, pieces).
# Pattern-block and shapes-kit outlines: x right, y up, one unit = one block side; `pieces` are the
# pieces of the reference tiling. grid-* outlines are puzzle-grid shape-fill outlines on square
# cells (x = column, y = row counted down from the top).

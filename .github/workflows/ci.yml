# CI (docs/spec/09-quality.md §2).
# Required checks (stable names): verify, e2e, bundle-size. Non-required: visual, and sim, which
# e2e needs.
# The scheduled nightly job lives in nightly.yml so it never reports a check on pull requests.
# No secrets are used anywhere in CI; every AI provider is mocked.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  PLAYWRIGHT_VERSION: "1.65.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 03 §9.4: the content property test runs 100 seeds per template on PRs (500 nightly).
      CONTENT_PROPERTY_N: "100"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      # Story play functions and axe checks run in Vitest browser mode inside `pnpm test`.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify

  # 04 §8 simulated-learner harness on the content as it is. A job of its own, next to `verify`:
  # with the full K–1 catalog the two no longer fit one 15-minute job on a slow runner (#84).
  # It is not a required check by name; the required `e2e` job needs it and fails, never skips,
  # unless it succeeded (see the gate step there).
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: TEMPORARY forced failure (proof for the PR 84 review; reverted in the next commit)
        run: exit 1
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm test:sim

  e2e:
    needs: [verify, sim]
    # GitHub skips a job whose needed job failed or was cancelled, and counts a skipped job as a
    # passing required check. So this job always runs, and its first step fails unless `verify`
    # and `sim` both succeeded: a failed or timed-out simulator makes the required `e2e` check fail.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require verify and sim
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SIM_RESULT: ${{ needs.sim.result }}
        run: |
          echo "verify: $VERIFY_RESULT, sim: $SIM_RESULT"
          test "$VERIFY_RESULT" = success
          test "$SIM_RESULT" = success
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm content:build
      - run: pnpm e2e
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle-size

  visual:
    # Non-required. Baselines are generated only inside this pinned image (09 §2).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm visual
      - name: Upload visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
